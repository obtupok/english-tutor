<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Yomi — English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Бумажный блокнот: тёплая бумага, чернила, один терракотовый акцент. Тёмная тема — та же бумага ночью. */
:root{
  --paper:#F4EFE6; --sheet:#FBF8F2; --ink:#1F1B16; --ink-2:#4A443B; --muted:#756C60; --line:#E1D8C8; --line-2:#CFC4B0;
  --accent:#B4432B; --accent-ink:#FFFFFF; --green:#2F6B45; --green-bg:#E7EFE3; --amber:#8A5D0E; --amber-bg:#F5EAD3; --red-bg:#F6E1DA;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#17140F; --sheet:#201C16; --ink:#EDE6DA; --ink-2:#CFC6B7; --muted:#A39A8C; --line:#332D25; --line-2:#463E33;
  --accent:#E07A5F; --accent-ink:#17140F; --green:#86C09A; --green-bg:#1E2A21; --amber:#E2B661; --amber-bg:#2C2416; --red-bg:#33201A;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}

header{display:flex;align-items:baseline;gap:12px;padding:14px 20px 6px}
.brand{flex:1;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em}
.brand small{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.meta{display:flex;gap:14px;align-items:baseline;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.meta .lv{padding:1px 8px;border:1px solid var(--ink);border-radius:6px;color:var(--ink);font-weight:600;font-size:13px}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:4px 20px 20px}

nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding-bottom:var(--safe-b);background:var(--paper)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:8px 0;font-size:12px;color:var(--muted);position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ink)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ink)}
nav .badge{position:absolute;top:6px;left:calc(50% + 7px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;line-height:18px}

/* Говорить */
.modes{display:flex;gap:20px;overflow-x:auto;padding:0 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chats{display:flex;gap:4px;margin:4px 20px 2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
.chats button{flex:1;min-height:40px;border-radius:9px;font-size:15px;font-weight:500;color:var(--muted)}
.chats button.on{background:var(--ink);color:var(--paper)}
.modes .hint{flex:none;align-self:center;font-size:14px;color:var(--muted)}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;min-height:44px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.modes button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.chat{display:flex;flex-direction:column;gap:18px;padding-top:16px}
.turn-t .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.turn-t .tx{font-family:var(--serif);font-size:20px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.tools{display:flex;gap:4px;margin:4px 0 0 -10px}
.tools button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--muted)}
.tools button:hover,.tools button:active{background:var(--sheet);color:var(--ink)}
.tools svg{width:16px;height:16px}
.trl{margin-top:6px;padding-left:12px;border-left:2px solid var(--line-2);color:var(--ink-2);font-size:15px}
.newwords{margin-top:8px;font-size:14px;color:var(--muted)}
.newwords b{color:var(--ink);font-weight:500;border-bottom:1px dotted var(--muted)}
.turn-u{align-self:flex-end;max-width:85%;padding:10px 14px;border:1px solid var(--line);border-radius:14px 14px 4px 14px;background:var(--sheet);white-space:pre-wrap;overflow-wrap:anywhere}
.note{align-self:flex-end;max-width:85%;margin-top:-10px;padding:8px 0 0 12px;border-left:2px solid var(--green);font-size:14px}
.note small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.note b{display:block;font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ink)}
.note span{display:block;color:var(--muted)}
.result{padding:18px;border:1px solid var(--ink);border-radius:4px;background:var(--sheet)}
.result .big{font-family:var(--serif);font-size:56px;font-weight:600;line-height:1}
.result p{margin:8px 0 0}
.result h4{margin:14px 0 2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.result ol,.result ul{margin:0;padding-left:20px}
.typing{display:flex;gap:5px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.err{align-self:center;text-align:center;color:var(--accent);font-size:14px;padding:4px 12px}

.dock{padding:2px 20px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;border-top:1px solid var(--line)}
.status{font-size:14px;color:var(--muted);min-height:21px;text-align:center}
.dock-row{display:flex;align-items:center;justify-content:center;gap:32px;width:100%}
.side{width:48px;height:48px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-2)}
.side svg{width:20px;height:20px}
.side.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mic{--lvl:0;width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;position:relative;
  outline:2px solid transparent;outline-offset:4px;transition:transform .12s,background .2s}
.mic:active{transform:scale(.96)}
.mic svg{width:30px;height:30px}
.mic.listen{background:var(--accent);color:var(--accent-ink);outline-color:var(--accent);outline-offset:calc(4px + var(--lvl) * 16px);transition:outline-offset 80ms linear,background .2s}
.mic.think::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--ink);animation:spin .9s linear infinite}
.mic .i-stop,.mic.speak .i-mic{display:none}
.mic.speak .i-stop{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.typebox{display:none;width:100%;gap:8px}
.typebox.on{display:flex}
.typebox input{flex:1;min-width:0;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);font:inherit;outline:none}
.typebox input:focus{border-color:var(--ink)}
.typebox button{min-width:48px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.typebox button svg{width:20px;height:20px}

/* Слова / Ошибки / Прогресс */
h2{font-family:var(--serif);font-size:30px;font-weight:600;margin:14px 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.cta b{font-family:var(--serif);font-size:40px;font-weight:600;display:block;line-height:1}
.cta small{color:var(--muted)}
.btn{min-height:46px;padding:10px 18px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:600}
.btn.line{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.row .w{flex:1;min-width:0}
.row .w b{display:block;font-family:var(--serif);font-size:19px;font-weight:500}
.row .w span{color:var(--ink-2)}
.row .w i{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.row .tools{margin:0}
.ib{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover,.ib:active{background:var(--sheet);color:var(--ink)}
.ib svg{width:18px;height:18px}
.mist s{color:var(--muted);text-decoration-color:var(--accent)}
.mist .ok{font-family:var(--serif);font-size:18px;margin-top:4px}
.mist .n{color:var(--muted);font-size:14px;margin-top:2px}
.mist time{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:48px 12px}
.figures{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px}
.figures div{padding:14px 4px;text-align:center}
.figures div+div{border-left:1px solid var(--line)}
.figures b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
.figures span{font-size:12px;color:var(--muted)}
.chart-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.bars{display:flex;align-items:flex-end;gap:5px;height:96px;margin-bottom:22px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars i{display:block;width:100%;border-radius:2px;background:var(--ink-2);min-height:2px}
.bars i.zero{background:var(--line)}
.bars i.today{background:var(--accent)}
.bars span{font-size:10px;color:var(--muted)}
.plan{padding:16px 0;border-top:1px solid var(--line);margin-bottom:16px}
.plan h3{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
.plan p{color:var(--muted);margin:6px 0 0}
.plan ol{margin:10px 0 0;padding-left:20px}
.plan li{margin-bottom:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:1px solid var(--line)}
.setrow input[type=range]{flex:1;max-width:220px;accent-color:var(--accent)}
.emos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.emos button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--ink-2)}
.emos button span{font-size:24px}
.emos button:active{background:var(--sheet)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px}
.voices{display:flex;flex-direction:column;margin-top:8px}
.voice{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.voice .w{flex:1}
.voice .w b{display:block;font-family:var(--serif);font-size:18px;font-weight:500}
.voice .w span{font-size:13px;color:var(--muted)}

/* листы: сценарии и тренировка */
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(20,16,12,.45);align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;background:var(--paper);border-radius:16px 16px 0 0;padding:10px 20px calc(20px + var(--safe-b));animation:up .2s ease-out}
.sheet .in::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 8px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.scenes{display:flex;flex-direction:column}
.scenes button{text-align:left;min-height:52px;padding:12px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:19px;display:flex;justify-content:space-between;align-items:center}
.scenes button svg{width:18px;height:18px;color:var(--muted)}
.card{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 20px;border:1px solid var(--line-2);border-radius:6px;background:var(--sheet);text-align:center;
  background-image:linear-gradient(var(--sheet) 46px,var(--accent) 46px,var(--accent) 47px,var(--sheet) 47px)}
.card .word{font-family:var(--serif);font-size:36px;font-weight:600}
.card .ex{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:17px}
.card .tr{font-size:20px;color:var(--green);font-weight:500}
.card small{color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grades button{min-height:52px;border-radius:12px;font-weight:600;border:1px solid transparent}
.g0{background:var(--red-bg);color:var(--accent)}.g1{background:var(--amber-bg);color:var(--amber)}.g2{background:var(--green-bg);color:var(--green)}
.gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;padding:32px;text-align:center;color:var(--muted)}
.gate b{color:var(--ink);font-family:var(--serif);font-size:26px;font-weight:600}
/* Кролик Yomi: чиби, нарисован чернилами по бумаге. Плавает поверх всего сайта: зажать и перетащить, водить по нему — гладить.
   data-s — что происходит в разговоре (idle/listen/think/speak), data-p — эмоция из ответа модели (18 штук),
   data-mood — короткая реакция на реплику (happy/oops), f-* — случайные «живые» движения, t-* — реакция на нажатие,
   .petting — гладят, .carried — несут. */
.buddy{--lvl:0;--ex:0px;--ey:0px;--b-fur:#FBF8F2;--b-ink:#2A241D;--b-belly:#F1E6D6;--b-nose:#E79A97;--bsize:110px;
  position:fixed;z-index:30;left:var(--bx,calc(100% - var(--bsize) - 10px));top:var(--by,calc(100% - var(--bsize) - 190px));
  width:var(--bsize);height:calc(var(--bsize) * .915);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.buddy[hidden]{display:none!important}
.buddy svg{width:100%;height:100%;overflow:hidden;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.buddy::after{content:"";position:absolute;left:24%;right:24%;bottom:2px;height:6px;border-radius:50%;background:#000;opacity:.12;pointer-events:none;transition:transform .2s,opacity .2s}
.buddy.carried{cursor:grabbing}
.buddy.carried::after{transform:scale(.6) translateY(14px);opacity:.06}
.buddy.carried > svg{animation:b-dangle .5s ease-in-out infinite!important;transform-origin:50% 10%}
.b-ear{transform-box:view-box;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.b-ear.l{transform-origin:64px 80px}.b-ear.r{transform-origin:96px 80px}
.b-head,.b-look,.b-eyes,.b-foot,.b-body,.b-nose,.b-vein,.b-heart,.b-zzz text,.b-steam circle,.b-stars path,.b-hearts path,.b-mark,.b-flame,.b-sparkle,.b-tear{transform-box:fill-box}
.b-line{fill:var(--b-fur);stroke:var(--b-ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.b-inner{fill:var(--accent);opacity:.3}
.b-ink{fill:var(--b-ink)}
.b-belly{fill:var(--b-belly)}
.b-shade{fill:var(--b-ink);opacity:.045}
.b-nose{fill:var(--b-nose);stroke:var(--b-ink);stroke-width:1.3;stroke-linejoin:round;transform-origin:center}
.b-whisk{fill:none;stroke:var(--b-ink);stroke-width:1.4;stroke-linecap:round;opacity:.55}
.b-scarf{fill:var(--accent);stroke:var(--b-ink);stroke-width:2.2;stroke-linejoin:round}
.b-scarf-stripe{fill:none;stroke:var(--b-fur);stroke-width:2;stroke-linecap:round;opacity:.55}
.b-gloss{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;opacity:.7}
.b-fluff{stroke-width:2}
.b-dots circle{fill:var(--muted)}
.b-stroke{fill:none;stroke:var(--b-ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.b-cheek{fill:var(--accent);opacity:.32;transition:opacity .3s,fill .3s}
.b-blush{fill:none;stroke:#D9475A;stroke-width:1.8;stroke-linecap:round}
.b-mark{font:800 26px var(--sans);fill:var(--accent)}
.b-zzz text{font:700 15px var(--sans);fill:var(--muted)}
/* движения всего кролика — на самой картинке: так их рисует видеокарта, а не процессор */
.buddy > svg{transform-origin:50% 96%;animation:b-breathe 3.2s ease-in-out infinite;will-change:transform}
.b-head{transform-origin:50% 85%;transition:transform .35s ease}
.b-look{transform:translate(var(--ex),var(--ey));transition:transform .25s ease-out}
.b-eyes{transform-origin:center;animation:b-blink 4.6s infinite}
.b-foot{transform-origin:20% 100%}
.b-ear.l{transform:rotate(-8deg)}.b-ear.r{transform:rotate(14deg)}
/* всё необычное по умолчанию скрыто; эмоции включают нужные детали */
.b-wide,.b-star,.b-heye,.b-swirl,.b-half,.b-glasses,.b-happy,.b-oops,.b-lids,.b-spark,.b-brows,.b-sadbrows,.b-detbrows,.b-raise,.b-blush,
.b-open,.b-frown,.b-grin,.b-o,.b-wavy,.b-smirk,.b-flat,.b-smile,
.b-tear,.b-sweat,.b-vein,.b-mark,.b-flame,.b-sparkle,.b-heart,.b-hearts,.b-zzz,.b-dots,.b-waves,.b-steam,.b-stars{opacity:0;transition:opacity .18s}

@keyframes b-breathe{50%{transform:translateY(1.5px) scaleY(.982)}}
@keyframes b-blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
@keyframes b-hop{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(0) scale(1.06,.92)}40%{transform:translateY(-16px) scale(.95,1.06)}65%{transform:translateY(0) scale(1.05,.95)}80%{transform:translateY(-3px)}}
@keyframes b-boing{0%,100%{transform:scale(1)}20%{transform:scale(1.14,.84)}45%{transform:scale(.9,1.12)}65%{transform:scale(1.05,.96)}85%{transform:scale(.98,1.02)}}
@keyframes b-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes b-jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px) scale(1.04)}}
@keyframes b-shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes b-dangle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes b-dot{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes b-wave{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
@keyframes b-float{0%{transform:translateY(4px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translateY(-14px) scale(1);opacity:0}}
@keyframes b-bob{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-2.5deg) translateY(1px)}70%{transform:rotate(2deg) translateY(-1px)}}
@keyframes b-tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes b-stomp{0%,70%,100%{transform:translate(0)}74%{transform:translate(-2px,0)}78%{transform:translate(2px,0)}82%{transform:translate(-2px,0)}86%{transform:translate(1px,0)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-nod{0%,55%,100%{transform:rotate(0) translateY(0)}75%{transform:rotate(7deg) translateY(4px)}82%{transform:rotate(-1deg) translateY(-1px)}}
@keyframes b-giggle{0%,60%,100%{transform:rotate(0)}64%{transform:rotate(-4deg)}68%{transform:rotate(4deg)}72%{transform:rotate(-4deg)}76%{transform:rotate(3deg)}80%{transform:rotate(0)}}
@keyframes b-wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes b-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes b-pop{0%{transform:scale(0) rotate(0);opacity:0}30%{transform:scale(1.2) rotate(20deg);opacity:1}100%{transform:scale(.6) rotate(45deg);opacity:0}}
@keyframes b-pulse{50%{transform:scale(1.18)}}
@keyframes b-twitch{0%,100%{transform:rotate(14deg)}20%{transform:rotate(24deg)}40%{transform:rotate(6deg)}60%{transform:rotate(20deg)}}
@keyframes b-lookaround{0%,100%{transform:translate(0,0)}25%,40%{transform:translate(-3.5px,0)}60%,80%{transform:translate(3.5px,-.5px)}}
@keyframes b-sniff{0%,100%{transform:translateY(0) scale(1)}20%,60%{transform:translateY(-1px) scale(1.15,.9)}40%,80%{transform:translateY(0) scale(1)}}
@keyframes b-stretch{0%,100%{transform:scale(1)}40%,60%{transform:scale(.96,1.08)}}
@keyframes b-tilt{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-9deg)}}

/* говорит: рот (класс .mo) и кивки головой, пока звучит голос (класс .talking) */
.buddy .b-mouth.mo > *{opacity:0!important}
.buddy .b-mouth.mo .b-open{opacity:1!important}
.buddy.talking .b-head{animation:b-bob .55s ease-in-out infinite}
/* слушает: уши торчком и подёргиваются в такт голосу, голова набок, волны у уха */
.buddy[data-s="listen"] .b-ear.l{transform:rotate(calc(-2deg - var(--lvl) * 12deg))}
.buddy[data-s="listen"] .b-ear.r{transform:rotate(calc(2deg + var(--lvl) * 12deg))}
.buddy[data-s="listen"] .b-head{transform:rotate(-6deg) translateY(2px)}
.buddy[data-s="listen"] .b-waves{opacity:1}
.buddy[data-s="listen"] .b-waves path{animation:b-wave 1.2s infinite}
.buddy[data-s="listen"] .b-waves path+path{animation-delay:.3s}
/* думает: глаза вверх, голова набок, «…» над головой, постукивает лапкой */
.buddy[data-s="think"] .b-look{transform:translate(3px,-4px)}
.buddy[data-s="think"] .b-head{transform:rotate(5deg)}
.buddy[data-s="think"] .b-dots{opacity:1}
.buddy[data-s="think"] .b-dots circle{animation:b-dot 1s infinite}
.buddy[data-s="think"] .b-dots circle:nth-child(2){animation-delay:.2s}
.buddy[data-s="think"] .b-dots circle:nth-child(3){animation-delay:.4s}
.buddy[data-s="think"] .b-foot.r{animation:b-tap .45s ease-in-out infinite}

/* ---------- 18 эмоций (data-p) ---------- */
/* глаза: какие эмоции заменяют обычные глаза */
.buddy:is([data-p="sleepy"],[data-p="proud"],[data-p="excited"],[data-p="surprised"],[data-p="scared"],[data-p="love"],[data-p="confused"],[data-p="sly"],[data-p="bored"],[data-p="cool"]) .b-eyes{opacity:0}
/* рты: какие эмоции заменяют обычный рот-«w» */
.buddy:is([data-p="angry"],[data-p="funny"],[data-p="excited"],[data-p="surprised"],[data-p="shy"],[data-p="proud"],[data-p="sad"],[data-p="confused"],[data-p="love"],[data-p="cool"],[data-p="scared"],[data-p="sly"],[data-p="bored"],[data-p="determined"]) .b-closed{opacity:0}
.buddy[data-p="cute"] .b-spark{opacity:1}
.buddy[data-p="cute"] .b-cheek{opacity:.62}
.buddy[data-p="cute"] .b-heart{opacity:1;animation:b-float 2.4s ease-out infinite}
.buddy[data-p="cute"] > svg{animation:b-sway 2.6s ease-in-out infinite}
.buddy[data-p="angry"] :is(.b-brows,.b-frown,.b-vein,.b-steam){opacity:1}
.buddy[data-p="angry"] .b-cheek{fill:#D24B3A;opacity:.5}
.buddy[data-p="angry"] .b-ear.l{transform:rotate(-20deg)}.buddy[data-p="angry"] .b-ear.r{transform:rotate(24deg)}
.buddy[data-p="angry"] .b-body{animation:b-stomp 3.2s infinite}
.buddy[data-p="angry"] .b-steam circle{animation:b-float 1.4s ease-out infinite}
.buddy[data-p="angry"] .b-steam circle:nth-child(2){animation-delay:.45s}
.buddy[data-p="angry"] .b-steam circle:nth-child(3){animation-delay:.9s}
.buddy[data-p="funny"] :is(.b-grin,.b-raise){opacity:1}
.buddy[data-p="funny"] > svg{animation:b-giggle 2.2s ease-in-out infinite}
.buddy[data-p="sleepy"] :is(.b-lids,.b-zzz){opacity:1}
.buddy[data-p="sleepy"] .b-zzz text{animation:b-float 2.6s ease-out infinite}
.buddy[data-p="sleepy"] .b-zzz text+text{animation-delay:1.3s}
.buddy[data-p="sleepy"] > svg{animation-duration:5s}
.buddy[data-p="sleepy"] .b-head{animation:b-nod 4.5s ease-in-out infinite}
.buddy[data-p="sleepy"] .b-ear.l{transform:rotate(-26deg)}.buddy[data-p="sleepy"] .b-ear.r{transform:rotate(28deg)}
.buddy[data-p="excited"] :is(.b-star,.b-grin,.b-stars){opacity:1}
.buddy[data-p="excited"] .b-star path{animation:b-pulse .8s ease-in-out infinite;transform-origin:center}
.buddy[data-p="excited"] .b-stars path{animation:b-pop 1.6s ease-out infinite}
.buddy[data-p="excited"] .b-stars path:nth-child(2){animation-delay:.4s}.buddy[data-p="excited"] .b-stars path:nth-child(3){animation-delay:.8s}.buddy[data-p="excited"] .b-stars path:nth-child(4){animation-delay:1.2s}
.buddy[data-p="excited"] > svg{animation:b-bounce .6s ease-in-out infinite}
.buddy[data-p="excited"] .b-ear.l{transform:rotate(-2deg)}.buddy[data-p="excited"] .b-ear.r{transform:rotate(4deg)}
.buddy[data-p="surprised"] :is(.b-wide,.b-o,.b-excl){opacity:1}
.buddy[data-p="surprised"] .b-ear.l{transform:rotate(0)}.buddy[data-p="surprised"] .b-ear.r{transform:rotate(0)}
.buddy[data-p="surprised"] > svg{animation:b-jump .5s ease-out}
.buddy[data-p="shy"] :is(.b-blush,.b-wavy){opacity:1}
.buddy[data-p="shy"] .b-cheek{opacity:.7}
.buddy[data-p="shy"] .b-look{transform:translate(-2px,3px)}
.buddy[data-p="shy"] .b-head{transform:rotate(-7deg)}
.buddy[data-p="shy"] .b-ear.l{transform:rotate(-16deg)}.buddy[data-p="shy"] .b-ear.r{transform:rotate(22deg)}
.buddy[data-p="proud"] :is(.b-lids,.b-smirk,.b-sparkle){opacity:1}
.buddy[data-p="proud"] .b-sparkle{animation:b-pulse 1.2s ease-in-out infinite}
.buddy[data-p="proud"] .b-head{transform:rotate(-5deg) translateY(-2px)}
.buddy[data-p="curious"] :is(.b-quest,.b-raise){opacity:1}
.buddy[data-p="curious"] .b-head{transform:rotate(9deg)}
.buddy[data-p="curious"] .b-ear.r{transform:rotate(28deg)}
.buddy[data-p="curious"] .b-look{transform:translate(3px,-1px)}
.buddy[data-p="sad"] :is(.b-sadbrows,.b-frown,.b-tear){opacity:1}
.buddy[data-p="sad"] .b-tear{animation:b-float 2.6s ease-in infinite reverse}
.buddy[data-p="sad"] .b-ear.l{transform:rotate(-28deg)}.buddy[data-p="sad"] .b-ear.r{transform:rotate(30deg)}
.buddy[data-p="sad"] > svg{animation-duration:5s}
.buddy[data-p="sad"] .b-head{transform:translateY(2px)}
.buddy[data-p="confused"] :is(.b-swirl,.b-wavy,.b-quest){opacity:1}
.buddy[data-p="confused"] .b-head{animation:b-wobble 2s ease-in-out infinite}
.buddy[data-p="love"] :is(.b-heye,.b-smile,.b-hearts){opacity:1}
.buddy[data-p="love"] .b-cheek{opacity:.65}
.buddy[data-p="love"] .b-heye path{animation:b-pulse .9s ease-in-out infinite;transform-origin:center}
.buddy[data-p="love"] .b-hearts path{animation:b-float 2.2s ease-out infinite}
.buddy[data-p="love"] .b-hearts path:nth-child(2){animation-delay:.7s}.buddy[data-p="love"] .b-hearts path:nth-child(3){animation-delay:1.4s}
.buddy[data-p="love"] > svg{animation:b-sway 2.4s ease-in-out infinite}
.buddy[data-p="cool"] :is(.b-glasses,.b-smirk){opacity:1}
.buddy[data-p="cool"] .b-head{transform:rotate(-4deg)}
.buddy[data-p="cool"] .b-ear.r{transform:rotate(26deg)}
.buddy[data-p="scared"] :is(.b-wide,.b-wavy,.b-sweat){opacity:1}
.buddy[data-p="scared"] .b-wide .b-ink{transform:scale(.55);transform-box:fill-box;transform-origin:center}
.buddy[data-p="scared"] > svg{animation:b-shiver .12s linear infinite}
.buddy[data-p="scared"] .b-ear.l{transform:rotate(-30deg)}.buddy[data-p="scared"] .b-ear.r{transform:rotate(30deg)}
.buddy[data-p="sly"] :is(.b-half,.b-smirk,.b-raise){opacity:1}
.buddy[data-p="sly"] .b-look{transform:translate(3px,0)}
.buddy[data-p="sly"] .b-head{transform:rotate(4deg)}
.buddy[data-p="bored"] :is(.b-half,.b-flat){opacity:1}
.buddy[data-p="bored"] .b-ear.l{transform:rotate(-24deg)}.buddy[data-p="bored"] .b-ear.r{transform:rotate(26deg)}
.buddy[data-p="bored"] > svg{animation-duration:6s}
.buddy[data-p="determined"] :is(.b-detbrows,.b-flat,.b-flame){opacity:1}
.buddy[data-p="determined"] .b-flame{animation:b-pulse .7s ease-in-out infinite}
.buddy[data-p="determined"] .b-ear.l{transform:rotate(-2deg)}.buddy[data-p="determined"] .b-ear.r{transform:rotate(2deg)}

/* реакции на реплику: радость (без ошибок) и смущение (была ошибка) — поверх эмоции */
.buddy[data-mood] :is(.b-eyes,.b-wide,.b-star,.b-heye,.b-swirl,.b-half,.b-glasses,.b-lids,.b-spark){opacity:0}
.buddy[data-mood="happy"] > svg{animation:b-hop .75s ease-out}
.buddy[data-mood="happy"] :is(.b-happy,.b-stars){opacity:1}
.buddy[data-mood="happy"] .b-stars path{animation:b-pop .9s ease-out both}
.buddy[data-mood="happy"] .b-stars path:nth-child(2){animation-delay:.12s}
.buddy[data-mood="happy"] .b-stars path:nth-child(3){animation-delay:.24s}
.buddy[data-mood="happy"] .b-stars path:nth-child(4){animation-delay:.36s}
.buddy[data-mood="oops"] :is(.b-oops,.b-sweat){opacity:1}
.buddy[data-mood="oops"] .b-ear.l{transform:rotate(-28deg)}.buddy[data-mood="oops"] .b-ear.r{transform:rotate(28deg)}
.buddy[data-mood="oops"] > svg{animation:b-shake .5s ease-in-out}

/* гладят: зажмурился, покраснел, уши прижал, прильнул к руке */
.buddy.petting :is(.b-eyes,.b-wide,.b-star,.b-heye,.b-swirl,.b-half,.b-glasses,.b-lids,.b-oops,.b-tear){opacity:0!important}
.buddy.petting :is(.b-happy,.b-blush,.b-smile){opacity:1!important}
.buddy.petting .b-mouth > :not(.b-smile){opacity:0!important}
.buddy.petting .b-cheek{opacity:.75!important;fill:var(--accent)!important}
.buddy.petting .b-ear.l{transform:rotate(-30deg)!important}.buddy.petting .b-ear.r{transform:rotate(32deg)!important}
.buddy.petting .b-head{transform:rotate(var(--pet-tilt, 0deg)) translateY(2px)!important;animation:none!important}

/* сам по себе: ухо дёргается, оглядывается, нюхает, потягивается, наклоняет голову, подпрыгивает */
.buddy.f-ear .b-ear.r{animation:b-twitch .6s ease-in-out}
.buddy.f-look .b-look{animation:b-lookaround 1.6s ease-in-out}
.buddy.f-sniff .b-nose{animation:b-sniff .7s ease-in-out}
.buddy.f-stretch > svg{animation:b-stretch 1.1s ease-in-out}
.buddy.f-tilt .b-head{animation:b-tilt 1.4s ease-in-out}
.buddy.f-hop > svg{animation:b-hop .75s ease-out}
/* нажатие */
.buddy.t-hop > svg{animation:b-hop .75s ease-out}
.buddy.t-boing > svg{animation:b-boing .8s ease-out}
.buddy.t-wiggle .b-ear.l{animation:b-tap .25s ease-in-out 3}
.buddy.t-wiggle .b-ear.r{animation:b-twitch .5s ease-in-out 2}
.buddy.t-heart :is(.b-hearts){opacity:1}
.buddy.t-heart .b-hearts path{animation:b-float 1.2s ease-out}
.buddy.t-heart .b-happy{opacity:1}.buddy.t-heart :is(.b-eyes,.b-wide,.b-star,.b-heye,.b-swirl,.b-half,.b-glasses,.b-lids){opacity:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><div class="brand">Yomi<small>English</small></div><div class="meta"><span id="streak" hidden></span><span class="lv" id="lvl" hidden></span></div></header>
  <main id="main">
    <section class="view on" id="v-talk">
      <div class="chats" id="chats" role="tablist"><button data-ch="learn" role="tab">Учёба</button><button data-ch="talk" role="tab">Болтовня</button></div>
      <div class="modes" id="modes" role="tablist"></div>
      <div class="scroll" id="chatWrap"><div class="chat" id="chat" aria-live="polite"></div></div>
      <div class="dock">
        <div class="status" id="status">Нажми и говори по-английски</div>
        <div class="dock-row">
          <button class="side" id="kbBtn" aria-label="Написать текстом"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M7 15h10"/></svg></button>
          <button class="mic" id="mic" aria-label="Говорить"><svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg class="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
          <button class="side" id="endBtn" aria-label="Закончить разговор"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <form class="typebox" id="typebox"><input id="typeIn" placeholder="Type in English…" autocomplete="off" aria-label="Сообщение"><button aria-label="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
      </div>
    </section>
    <section class="view" id="v-words"><div class="scroll" id="wordsBox"></div></section>
    <section class="view" id="v-mist"><div class="scroll" id="mistBox"></div></section>
    <section class="view" id="v-prog"><div class="scroll" id="progBox"></div></section>
    <section class="view" id="v-yomi"><div class="scroll" id="yomiBox"></div></section>
  </main>
  <nav id="nav">
    <button data-v="talk" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Говорить</button>
    <button data-v="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Слова<span class="badge" id="dueBadge" hidden></span></button>
    <button data-v="mist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Ошибки</button>
    <button data-v="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Прогресс</button>
    <button data-v="yomi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9.5C7 6 7.2 2.5 8.6 2.4S10.8 5.8 10.6 9M15.5 9.5C17 6 16.8 2.5 15.4 2.4S13.2 5.8 13.4 9"/><ellipse cx="12" cy="15" rx="7.5" ry="6.5"/><path d="M9.6 14.6h.01M14.4 14.6h.01M11 17.2q1 .8 2 0"/></svg>Yomi</button>
  </nav>
</div>
<div class="buddy" id="buddy" data-s="idle" data-p="kind" title="Yomi — погладь меня" aria-hidden="true"><svg viewBox="-14 -8 188 172">
          <g class="b-all">
            <g class="b-ear l"><path class="b-line" d="M54 82 C42 34 44 7 58 5 C72 3 77 32 75 82 Z"/><path class="b-inner" d="M60 58 C52 36 53 15 59 13 C65 12 67 34 66 56 Z"/></g>
            <g class="b-ear r"><path class="b-line" d="M106 82 C118 34 116 7 102 5 C88 3 83 32 85 82 Z"/><path class="b-inner" d="M100 58 C108 36 107 15 101 13 C95 12 93 34 94 56 Z"/></g>
            <g class="b-body">
              <ellipse class="b-line" cx="80" cy="132" rx="27" ry="16"/>
              <ellipse class="b-belly" cx="80" cy="136" rx="13" ry="9"/>
              <g class="b-foot l"><ellipse class="b-line" cx="66" cy="145" rx="9" ry="5.5"/><path class="b-whisk" d="M63 147.5v-3M67 148v-3"/></g>
              <g class="b-foot r"><ellipse class="b-line" cx="94" cy="145" rx="9" ry="5.5"/><path class="b-whisk" d="M93 148v-3M97 147.5v-3"/></g>
            </g>
            <g class="b-head">
              <ellipse class="b-line" cx="80" cy="92" rx="49" ry="40"/>
              <path class="b-stroke" stroke-width="2" d="M73 55 q3.5-6 7-1 q3.5-6 7 1"/>
              <ellipse class="b-shade" cx="80" cy="117" rx="36" ry="12"/>
              <path class="b-gloss" d="M50 70 Q58 59 71 55"/>
              <path class="b-stroke b-fluff" d="M33 95 l-4 3 4 3 M127 95 l4 3 -4 3"/>
              <circle class="b-cheek" cx="50" cy="103" r="7.5"/><circle class="b-cheek" cx="110" cy="103" r="7.5"/>
              <path class="b-blush" d="M44 100 l3 -5 M49 101 l3 -5 M54 102 l3 -5 M104 102 l3 -5 M109 101 l3 -5 M114 100 l3 -5"/>
              <!-- глаза, которые следят за пальцем (.b-look): обычные и их варианты -->
              <g class="b-look">
                <g class="b-eyes">
                  <ellipse class="b-ink" cx="63" cy="91" rx="6" ry="7.6"/><ellipse class="b-ink" cx="97" cy="91" rx="6" ry="7.6"/>
                  <circle fill="var(--b-fur)" cx="65.2" cy="87.6" r="2.3"/><circle fill="var(--b-fur)" cx="99.2" cy="87.6" r="2.3"/>
                  <circle fill="var(--b-fur)" cx="61" cy="94.6" r="1.1"/><circle fill="var(--b-fur)" cx="95" cy="94.6" r="1.1"/>
                </g>
                <g class="b-wide">
                  <circle fill="#fff" stroke="var(--b-ink)" stroke-width="2.4" cx="63" cy="90" r="8.5"/><circle fill="#fff" stroke="var(--b-ink)" stroke-width="2.4" cx="97" cy="90" r="8.5"/>
                  <circle class="b-ink" cx="63" cy="91" r="3"/><circle class="b-ink" cx="97" cy="91" r="3"/>
                </g>
                <g class="b-star" fill="var(--b-ink)">
                  <path d="M63 81 l2.6 6 6.4 .5 -4.9 4.2 1.5 6.3 -5.6 -3.4 -5.6 3.4 1.5 -6.3 -4.9 -4.2 6.4 -.5z"/>
                  <path d="M97 81 l2.6 6 6.4 .5 -4.9 4.2 1.5 6.3 -5.6 -3.4 -5.6 3.4 1.5 -6.3 -4.9 -4.2 6.4 -.5z"/>
                </g>
                <g class="b-heye" fill="#D9475A">
                  <path d="M63 97 c-6-4-9-7-9-11 c0-4 5-6 9-1 c4-5 9-3 9 1 c0 4-3 7-9 11z"/>

function streak(){
  const days = S.stats?.days || {}; let n = 0;
  const d = new Date(); if(!days[d.toISOString().slice(0, 10)]) d.setUTCDate(d.getUTCDate() - 1);
  while(days[d.toISOString().slice(0, 10)]){ n++; d.setUTCDate(d.getUTCDate() - 1); }

}

function drawChat(){
  const box = $('#chat');
  box.innerHTML = chat.map((m, i) => m.role === 'user'
    ? `<div class="turn-u">${esc(m.text)}</div>${m.fix ? `<div class="note"><small>Лучше так</small><b>${esc(m.fix.fixed)}</b>${(m.fix.notes || []).map(n => `<span>${esc(n)}</span>`).join('')}</div>` : ''}`
    : m.role === 'result' ? resultHtml(m.a)
    : `<div class="turn-t"><div class="who">Yomi</div><div class="tx">${esc(m.text)}</div><div class="tools"><button data-say="${i}">${ICON.speak}Послушать</button>${m.en !== false ? `<button data-tr="${i}">${ICON.tr}Перевод</button>` : ''}</div>${m.trl ? `<div class="trl">${esc(m.trl)}</div>` : ''}${(m.words || []).length ? `<div class="newwords">Новые слова: ${m.words.map(w => `<b>${esc(w.word)}</b> — ${esc(w.translation)}`).join(', ')}</div>` : ''}</div>`).join('')
    + (busy && state !== 'listen' ? '<div class="turn-t"><div class="who">Yomi</div><div class="typing"><i></i><i></i><i></i></div></div>' : '')
    + (errText ? `<div class="err">${esc(errText)}</div>` : '');
  const w = $('#chatWrap'); w.scrollTop = w.scrollHeight;
}
function resultHtml(a){
  const list = (t, items, tag = 'ul') => items?.length ? `<h4>${t}</h4><${tag}>${items.map(x => `<li>${esc(x)}</li>`).join('')}</${tag}>` : '';
  return `<div class="result"><div class="big">${esc(a.level)}</div><p>${esc(a.summary)}</p>${list('Сильные стороны', a.strengths)}${list('Над чем поработать', a.weaknesses)}${list('План', a.plan, 'ol')}</div>`;
}
$('#chat').onclick = async e => {
  const b = e.target.closest('[data-say],[data-tr]'); if(!b) return;
  if(b.dataset.say){ const m = chat[b.dataset.say]; if(m) sayText(m.text, m.en !== false ? 'en' : 'ru'); }
  if(b.dataset.tr){ const m = chat[b.dataset.tr]; if(!m) return; if(m.trl){ m.trl = ''; drawChat(); return; }

};

// ответ сервера → лента + звук
function onReply(out, userText){
  if(out.fix) out.emotion = 'angry';   // ошибка — Yomi злится
  const bd = $('#buddy'); if(bd) bd.dataset.p = out.emotion || 'kind';   // настроение Yomi меняется само — по ответу модели

/* ---------- звук: один плеер, «разблокированный» первым нажатием (iOS) ---------- */
const player = new Audio(); player.preload = 'auto';
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let unlocked = false;
function unlock(){ sfxReady(); if(unlocked) return; unlocked = true; player.src = SILENT; player.play().catch(() => {}); }
function playB64(b64, mime = 'audio/mpeg'){
  return new Promise(res => {
    if(!b64) return res();
    player.onended = player.onerror = () => res();
    player.src = `data:${mime};base64,` + b64;
    player.play().catch(() => res());
  });
}
function speakLocal(text, lang){
  return new Promise(res => {
    if(!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text); u.lang = lang === 'ru' ? 'ru-RU' : 'en-US'; u.rate = .95;
    const done = () => { clearTimeout(t); mouth(false); res(); };
    const t = setTimeout(done, 2000 + text.length * 90);   // некоторые браузеры молча не говорят и не присылают onend
    u.onstart = () => mouth(true);
    u.onend = u.onerror = done;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  });
}
const ttsCache = new Map();
async function sayText(text, lang = 'en', speaker = S.speaker){
  stopAudio();
  const key = [lang, speaker, $('#buddy')?.dataset.p || 'kind', text].join('|');
  let a = ttsCache.get(key);
  if(!a){ const j = await api('tts', {text, lang, speaker, emotion: $('#buddy')?.dataset.p || 'kind'}); if(j.audio){ a = {b: j.audio, mime: j.mime}; ttsCache.set(key, a); } }
  return a ? playB64(a.b, a.mime) : speakLocal(text, lang);
}
function stopAudio(){ try{ player.pause(); }catch{} try{ speechSynthesis.cancel(); }catch{} mouth(false); }

/* ---------- звуки кролика: синтез в браузере, без файлов; тихие и короткие ---------- */
let sfxOn = store.get('yomi_sfx', true), sfxCtx = null;
function sfxReady(){
  if(!sfxOn) return null;
  try{ sfxCtx ||= new (window.AudioContext || window.webkitAudioContext)(); if(sfxCtx.state === 'suspended') sfxCtx.resume(); }catch{ return null; }
  return sfxCtx;
}
// тон: частота скользит по точкам [время, частота], громкость — мягкая атака и затухание
function tone(c, t0, type, freqs, dur, vol = .12, lowpass = 0){
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  freqs.forEach(([t, f], i) => i ? o.frequency.exponentialRampToValueAtTime(f, t0 + t) : o.frequency.setValueAtTime(f, t0 + t));
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  let out = o;
  if(lowpass){ const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass; o.connect(f); out = f; }
  out.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + .02);
}
// шорох: короткий шум через полосовой фильтр
function noise(c, t0, dur, freq, vol = .06){
  const len = Math.ceil(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t0);
}
// каждый звук возвращает свою длину в секундах
const SFX = {
  hop:    (c, t) => { tone(c, t, 'triangle', [[0, 520], [.11, 1250]], .14, .1); return .15; },
  boing:  (c, t) => { tone(c, t, 'sine', [[0, 180], [.08, 620], [.22, 330], [.38, 420]], .42, .16); return .42; },
  ear:    (c, t) => { [0, .09, .18].forEach(d => noise(c, t + d, .05, 3800, .11)); return .25; },
  heart:  (c, t) => { tone(c, t, 'sine', [[0, 760], [.14, 980], [.36, 640]], .4, .1); return .4; },
  happy:  (c, t) => { tone(c, t, 'sine', [[0, 1046]], .18, .09); tone(c, t + .1, 'sine', [[0, 1568]], .3, .08); tone(c, t + .2, 'triangle', [[0, 2093]], .25, .035); return .45; },
  oops:   (c, t) => { tone(c, t, 'triangle', [[0, 620], [.14, 520]], .16, .1); tone(c, t + .17, 'triangle', [[0, 470], [.2, 330]], .26, .1); return .45; },
  angry:  (c, t) => { tone(c, t, 'sawtooth', [[0, 140], [.15, 110], [.3, 150], [.5, 95]], .55, .07, 600); return .55; },
  funny:  (c, t) => { [0, .07, .14, .21, .28].forEach((d, i) => tone(c, t + d, 'sine', [[0, i % 2 ? 1180 : 980], [.05, i % 2 ? 1300 : 1080]], .06, .07)); return .36; },
  sleepy: (c, t) => { tone(c, t, 'sine', [[0, 520], [.25, 620], [.8, 260]], .85, .07, 1200); return .85; },
  cute:   (c, t) => { tone(c, t, 'sine', [[0, 880], [.12, 1175], [.3, 990]], .32, .08); return .32; },

  $('#progBox').innerHTML = `<h2>Прогресс</h2><p class="lead">${st ? `Занимаешься ${st} ${plural(st, 'день', 'дня', 'дней')} подряд.` : 'Скажи сегодня хотя бы пару фраз — начнётся серия.'}</p>
    <div class="figures"><div><b>${S.level || '—'}</b><span>уровень</span></div><div><b>${days[today] || 0}</b><span>фраз сегодня</span></div><div><b>${total}</b><span>фраз всего</span></div></div>
    <div class="figures"><div><b>${st}</b><span>дней подряд</span></div><div><b>${S.words}</b><span>слов</span></div><div><b>${S.due}</b><span>к повтору</span></div></div>
    <p class="chart-h">Фразы за две недели</p>
    <div class="bars">${last.map(([k, n]) => `<div><i class="${k === today ? 'today' : n ? '' : 'zero'}" style="height:${Math.round(n / max * 100)}%"></i><span>${+k.slice(8)}</span></div>`).join('')}</div>
    <div class="plan">${p ? `<h3>Мой план · ${esc(p.level)}</h3><p>${esc(p.summary || '')}</p><ol>${(p.plan || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>`
      : '<h3>Плана пока нет</h3><p>Пройди тест уровня или расскажи Yomi о своих целях — он составит план.</p>'}</div>
    <div class="actions"><button class="btn" data-go="test">Пройти тест уровня</button><button class="btn line" data-go="coach">Составить план</button></div>`;
}
$('#progBox').onclick = async e => {
  unlock();
  const go = e.target.closest('[data-go]'), vp = e.target.closest('[data-vp]'), vs = e.target.closest('[data-vs]');
  if(go){ tab('talk'); switchMode(go.dataset.go); }
  if(vp) sayText(S.engine === 'gemini' ? "Hi, I'm Yomi! Привет, я Йоми. Let's practise English together!" : "Hi, I'm Yomi. Let's practise English together. How was your day?", 'en', vp.dataset.vp);
  if(e.target.closest('[data-sfx]')){ sfxOn = !sfxOn; store.set('yomi_sfx', sfxOn); showProgress(); if(sfxOn) sfx('happy'); }
  if(vs && vs.dataset.vs !== S.speaker){ const j = await api('speaker', {speaker: vs.dataset.vs}); if(j.ok){ S.speaker = j.speaker; showProgress(); } }
};

/* ---------- вкладка «Yomi»: кролик на экране, эмоции, звуки, голос ---------- */
function showYomi(){
  $('#yomiBox').innerHTML = `<h2>Yomi</h2><p class="lead">Твой кролик-помощник ходит за тобой по всему сайту. Зажми его на мгновение и перетащи куда удобно, води по нему пальцем — погладишь.</p>
    <div class="plan"><h3>Кролик на экране</h3>
      <div class="setrow"><span>${bunnyOn ? 'Показан' : 'Спрятан'}</span><button class="btn sm${bunnyOn ? ' line' : ''}" data-bon>${bunnyOn ? 'Спрятать' : 'Показать'}</button></div>
      <label class="setrow"><span>Размер</span><input type="range" id="bsizeIn" min="60" max="180" step="2" value="${bsize}" aria-label="Размер кролика"></label>
      <div class="setrow"><span>Место</span><button class="btn line sm" data-bpos>Вернуть в угол</button></div></div>
    <div class="plan"><h3>Эмоции</h3><p>Их ${EMOS.length}, Yomi выбирает их сам по ходу разговора. Нажми, чтобы посмотреть.</p>
      <div class="emos">${EMOS.map(([k, e, n]) => `<button data-emo="${k}"><span aria-hidden="true">${e}</span>${n}</button>`).join('')}</div></div>
    <div class="plan"><h3>Звуки кролика</h3><p>Писк, «боинг», ворчание, хихиканье и другие звуки-реакции.</p><button class="btn${sfxOn ? ' line' : ''} sm" data-sfx style="margin-top:10px">${sfxOn ? 'Выключить звуки' : 'Включить звуки'}</button></div>
    <div class="plan"><h3>Голос Yomi</h3><p>Нажми, чтобы послушать. Выбранный голос будет и на сайте, и в боте.</p>
      <div class="voices">${(S.speakers || Object.keys(VOICE_INFO).slice(0, 6)).filter(k => VOICE_INFO[k]).map(k => [k, ...VOICE_INFO[k]]).map(([k, n, g]) => `<div class="voice${S.speaker === k ? ' on' : ''}"><button class="ib" data-vp="${k}" aria-label="Послушать ${n}">${ICON.speak}</button>
        <div class="w"><b>${n}</b><span>${g}</span></div><button class="btn${S.speaker === k ? '' : ' line'} sm" data-vs="${k}">${S.speaker === k ? 'Выбран' : 'Выбрать'}</button></div>`).join('')}</div></div>`;
  $('#bsizeIn').oninput = e => { bsize = +e.target.value; store.set('yomi_bsize', bsize); placeBunny(); };
}
$('#yomiBox').onclick = async e => {
  unlock();
  const vp = e.target.closest('[data-vp]'), vs = e.target.closest('[data-vs]'), emo = e.target.closest('[data-emo]');
  if(e.target.closest('[data-bon]')){ bunnyOn = !bunnyOn; store.set('yomi_bunny', bunnyOn); placeBunny(); showYomi(); if(bunnyOn) hop(); }
  if(e.target.closest('[data-bpos]')){ bpos = null; store.set('yomi_bpos', null); placeBunny(); hop(); }
  if(emo){ if(!bunnyOn){ bunnyOn = true; store.set('yomi_bunny', true); placeBunny(); showYomi(); }
    const b = $('#buddy'); b.dataset.p = emo.dataset.emo; sfx(EMO_SOUND[emo.dataset.emo] || 'hop'); }
  if(vp) sayText(S.engine === 'gemini' ? "Hi, I'm Yomi! Привет, я Йоми. Let's practise English together!" : "Hi, I'm Yomi. Let's practise English together. How was your day?", 'en', vp.dataset.vp);
  if(e.target.closest('[data-sfx]')){ sfxOn = !sfxOn; store.set('yomi_sfx', sfxOn); showYomi(); if(sfxOn) sfx('happy'); }
  if(vs && vs.dataset.vs !== S.speaker){ const j = await api('speaker', {speaker: vs.dataset.vs}); if(j.ok){ S.speaker = j.speaker; showYomi(); } }
};

/* ---------- вкладки и запуск ---------- */
function tab(v){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  if(v !== 'talk' && inCall) endCall();
  if(v === 'words') showWords();
  if(v === 'mist') showMistakes();
  if(v === 'prog') showProgress();
  if(v === 'yomi') showYomi();
}
// переключение «Учёба» ↔ «Болтовня»: у каждого чата своя лента и своя история на сервере
$('#chats').onclick = e => {
  const b = e.target.closest('[data-ch]'); if(!b || b.dataset.ch === CH || busy) return;
  unlock(); if(inCall) endCall(); stopAudio();
  saveChat(); CH = b.dataset.ch; store.set('yomi_ch', CH);
  chat = store.get(chatKey(), []); if(!chat.length) chat = serverChat();
  errText = ''; drawModes(); drawChat(); setState('idle');
};
$('#nav').onclick = e => { const b = e.target.closest('[data-v]'); if(b) tab(b.dataset.v); };

(async () => {
  if(!AUTH) return gate();
  drawModes(); drawChat(); setState('idle');
  const j = await api('state').catch(() => ({error:'failed'}));
  if(j.error){ if(j.error !== 'auth'){ errText = 'Нет связи с сервером. Обнови страницу.'; drawChat(); } return; }
  Object.assign(S, j);
  // лента из браузера устарела (разговор шёл в боте) — показываем историю с сервера
  const last = chat.filter(m => m.role === 'tutor').pop()?.text, srv = (CH === 'talk' ? S.talk || [] : S.history).filter(m => m.role === 'assistant').pop()?.text;
  if(last !== srv) chat = serverChat();
  saveChat(); drawModes(); drawHead(); drawChat(); setState('idle');
})();
</script>
</body>
</html>
