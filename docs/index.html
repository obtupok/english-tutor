<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Yomi — English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Бумажный блокнот: тёплая бумага, чернила, один терракотовый акцент. Тёмная тема — та же бумага ночью. */
:root{
  --paper:#F4EFE6; --sheet:#FBF8F2; --ink:#1F1B16; --ink-2:#4A443B; --muted:#756C60; --line:#E1D8C8; --line-2:#CFC4B0;
  --accent:#B4432B; --accent-ink:#FFFFFF; --green:#2F6B45; --green-bg:#E7EFE3; --amber:#8A5D0E; --amber-bg:#F5EAD3; --red-bg:#F6E1DA;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#17140F; --sheet:#201C16; --ink:#EDE6DA; --ink-2:#CFC6B7; --muted:#A39A8C; --line:#332D25; --line-2:#463E33;
  --accent:#E07A5F; --accent-ink:#17140F; --green:#86C09A; --green-bg:#1E2A21; --amber:#E2B661; --amber-bg:#2C2416; --red-bg:#33201A;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}

header{display:flex;align-items:baseline;gap:12px;padding:14px 20px 6px}
.brand{flex:1;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em}
.brand small{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.meta{display:flex;gap:14px;align-items:baseline;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.meta .lv{padding:1px 8px;border:1px solid var(--ink);border-radius:6px;color:var(--ink);font-weight:600;font-size:13px}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:4px 20px 20px}

nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-bottom:var(--safe-b);background:var(--paper)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:8px 0;font-size:12px;color:var(--muted);position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ink)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ink)}
nav .badge{position:absolute;top:6px;left:calc(50% + 7px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;line-height:18px}

/* Говорить */
.modes{display:flex;gap:20px;overflow-x:auto;padding:0 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;min-height:44px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.modes button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.chat{display:flex;flex-direction:column;gap:18px;padding-top:16px}
.turn-t .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.turn-t .tx{font-family:var(--serif);font-size:20px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.tools{display:flex;gap:4px;margin:4px 0 0 -10px}
.tools button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--muted)}
.tools button:hover,.tools button:active{background:var(--sheet);color:var(--ink)}
.tools svg{width:16px;height:16px}
.trl{margin-top:6px;padding-left:12px;border-left:2px solid var(--line-2);color:var(--ink-2);font-size:15px}
.newwords{margin-top:8px;font-size:14px;color:var(--muted)}
.newwords b{color:var(--ink);font-weight:500;border-bottom:1px dotted var(--muted)}
.turn-u{align-self:flex-end;max-width:85%;padding:10px 14px;border:1px solid var(--line);border-radius:14px 14px 4px 14px;background:var(--sheet);white-space:pre-wrap;overflow-wrap:anywhere}
.note{align-self:flex-end;max-width:85%;margin-top:-10px;padding:8px 0 0 12px;border-left:2px solid var(--green);font-size:14px}
.note small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.note b{display:block;font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ink)}
.note span{display:block;color:var(--muted)}
.result{padding:18px;border:1px solid var(--ink);border-radius:4px;background:var(--sheet)}
.result .big{font-family:var(--serif);font-size:56px;font-weight:600;line-height:1}
.result p{margin:8px 0 0}
.result h4{margin:14px 0 2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.result ol,.result ul{margin:0;padding-left:20px}
.typing{display:flex;gap:5px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.err{align-self:center;text-align:center;color:var(--accent);font-size:14px;padding:4px 12px}

.dock{padding:10px 20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;border-top:1px solid var(--line)}
.status{font-size:14px;color:var(--muted);min-height:21px;text-align:center}
.dock-row{display:flex;align-items:center;justify-content:center;gap:32px;width:100%}
.side{width:48px;height:48px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-2)}
.side svg{width:20px;height:20px}
.side.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mic{--lvl:0;width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;position:relative;
  outline:2px solid transparent;outline-offset:4px;transition:transform .12s,background .2s}
.mic:active{transform:scale(.96)}
.mic svg{width:30px;height:30px}
.mic.listen{background:var(--accent);color:var(--accent-ink);outline-color:var(--accent);outline-offset:calc(4px + var(--lvl) * 16px);transition:outline-offset 80ms linear,background .2s}
.mic.think::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--ink);animation:spin .9s linear infinite}
.mic .i-stop,.mic.speak .i-mic{display:none}
.mic.speak .i-stop{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.typebox{display:none;width:100%;gap:8px}
.typebox.on{display:flex}
.typebox input{flex:1;min-width:0;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);font:inherit;outline:none}
.typebox input:focus{border-color:var(--ink)}
.typebox button{min-width:48px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.typebox button svg{width:20px;height:20px}

/* Слова / Ошибки / Прогресс */
h2{font-family:var(--serif);font-size:30px;font-weight:600;margin:14px 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.cta b{font-family:var(--serif);font-size:40px;font-weight:600;display:block;line-height:1}
.cta small{color:var(--muted)}
.btn{min-height:46px;padding:10px 18px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:600}
.btn.line{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.row .w{flex:1;min-width:0}
.row .w b{display:block;font-family:var(--serif);font-size:19px;font-weight:500}
.row .w span{color:var(--ink-2)}
.row .w i{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.row .tools{margin:0}
.ib{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover,.ib:active{background:var(--sheet);color:var(--ink)}
.ib svg{width:18px;height:18px}
.mist s{color:var(--muted);text-decoration-color:var(--accent)}
.mist .ok{font-family:var(--serif);font-size:18px;margin-top:4px}
.mist .n{color:var(--muted);font-size:14px;margin-top:2px}
.mist time{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:48px 12px}
.figures{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px}
.figures div{padding:14px 4px;text-align:center}
.figures div+div{border-left:1px solid var(--line)}
.figures b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
.figures span{font-size:12px;color:var(--muted)}
.chart-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.bars{display:flex;align-items:flex-end;gap:5px;height:96px;margin-bottom:22px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars i{display:block;width:100%;border-radius:2px;background:var(--ink-2);min-height:2px}
.bars i.zero{background:var(--line)}
.bars i.today{background:var(--accent)}
.bars span{font-size:10px;color:var(--muted)}
.plan{padding:16px 0;border-top:1px solid var(--line);margin-bottom:16px}
.plan h3{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
.plan p{color:var(--muted);margin:6px 0 0}
.plan ol{margin:10px 0 0;padding-left:20px}
.plan li{margin-bottom:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px}
.voices{display:flex;flex-direction:column;margin-top:8px}
.voice{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.voice .w{flex:1}
.voice .w b{display:block;font-family:var(--serif);font-size:18px;font-weight:500}
.voice .w span{font-size:13px;color:var(--muted)}

/* листы: сценарии и тренировка */
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(20,16,12,.45);align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;background:var(--paper);border-radius:16px 16px 0 0;padding:10px 20px calc(20px + var(--safe-b));animation:up .2s ease-out}
.sheet .in::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 8px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.scenes{display:flex;flex-direction:column}
.scenes button{text-align:left;min-height:52px;padding:12px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:19px;display:flex;justify-content:space-between;align-items:center}
.scenes button svg{width:18px;height:18px;color:var(--muted)}
.card{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 20px;border:1px solid var(--line-2);border-radius:6px;background:var(--sheet);text-align:center;
  background-image:linear-gradient(var(--sheet) 46px,var(--accent) 46px,var(--accent) 47px,var(--sheet) 47px)}
.card .word{font-family:var(--serif);font-size:36px;font-weight:600}
.card .ex{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:17px}
.card .tr{font-size:20px;color:var(--green);font-weight:500}
.card small{color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grades button{min-height:52px;border-radius:12px;font-weight:600;border:1px solid transparent}
.g0{background:var(--red-bg);color:var(--accent)}.g1{background:var(--amber-bg);color:var(--amber)}.g2{background:var(--green-bg);color:var(--green)}
.gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;padding:32px;text-align:center;color:var(--muted)}
.gate b{color:var(--ink);font-family:var(--serif);font-size:26px;font-weight:600}
/* Кролик Yomi: чиби, нарисован чернилами по бумаге. data-s — что происходит в разговоре, data-mood — реакция на реплику */
.buddy{--lvl:0;--b-fur:#FBF8F2;--b-ink:#2A241D;width:120px;height:108px;margin:-4px auto -6px;cursor:pointer;touch-action:manipulation}
.buddy svg{width:100%;height:100%;overflow:visible}
.buddy *{transform-box:fill-box}
.b-line{fill:var(--b-fur);stroke:var(--b-ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.b-inner{fill:var(--accent);opacity:.28}
.b-ink{fill:var(--b-ink)}
.b-dots circle{fill:var(--muted)}
.b-stroke{fill:none;stroke:var(--b-ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.b-cheek{fill:var(--accent);opacity:.32}
.b-shadow{fill:var(--ink);opacity:.1}
.b-all{transform-origin:50% 100%;animation:b-breathe 3.2s ease-in-out infinite}
.b-ear{transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.b-ear.l{transform:rotate(-8deg)}.b-ear.r{transform:rotate(14deg)}
.b-head{transform-origin:50% 80%;transition:transform .35s ease}
.b-eyes{transform-origin:center;animation:b-blink 4.6s infinite;transition:transform .3s ease}
.b-happy,.b-oops,.b-sweat,.b-dots,.b-waves,.b-open{opacity:0;transition:opacity .15s}
@keyframes b-breathe{50%{transform:translateY(1.5px) scaleY(.985)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes b-hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-12px)}60%{transform:translateY(0)}75%{transform:translateY(-4px)}}
@keyframes b-dot{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes b-wave{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
/* слушает: уши торчком и подёргиваются в такт голосу, голова набок, волны у уха */
.buddy[data-s="listen"] .b-ear.l{transform:rotate(calc(-2deg - var(--lvl) * 10deg))}
.buddy[data-s="listen"] .b-ear.r{transform:rotate(calc(2deg + var(--lvl) * 10deg))}
.buddy[data-s="listen"] .b-head{transform:rotate(-5deg)}
.buddy[data-s="listen"] .b-waves{opacity:1}
.buddy[data-s="listen"] .b-waves path{animation:b-wave 1.2s infinite}
.buddy[data-s="listen"] .b-waves path+path{animation-delay:.3s}
/* думает: глаза вверх, «…» над головой */
.buddy[data-s="think"] .b-eyes{transform:translate(3px,-4px)}
.buddy[data-s="think"] .b-head{transform:rotate(4deg)}
.buddy[data-s="think"] .b-dots{opacity:1}
.buddy[data-s="think"] .b-dots circle{animation:b-dot 1s infinite}
.buddy[data-s="think"] .b-dots circle:nth-child(2){animation-delay:.2s}
.buddy[data-s="think"] .b-dots circle:nth-child(3){animation-delay:.4s}
/* говорит: рот открывается (класс .mo ставит скрипт) */
.buddy.mo .b-open{opacity:1}.buddy.mo .b-closed{opacity:0}
/* реакции: радость (без ошибок) и смущение (была ошибка) */
.buddy[data-mood="happy"] .b-all{animation:b-hop .7s ease-out}
.buddy[data-mood="happy"] .b-eyes{opacity:0}.buddy[data-mood="happy"] .b-happy{opacity:1}
.buddy[data-mood="oops"] .b-eyes{opacity:0}.buddy[data-mood="oops"] .b-oops,.buddy[data-mood="oops"] .b-sweat{opacity:1}
.buddy[data-mood="oops"] .b-ear.l{transform:rotate(-34deg)}.buddy[data-mood="oops"] .b-ear.r{transform:rotate(34deg)}
.buddy.hop .b-all{animation:b-hop .7s ease-out}
.dock:has(.typebox.on) .buddy{width:84px;height:76px}
/* характеры кролика: data-p на .buddy */
.b-brows,.b-raise,.b-frown,.b-grin,.b-lids,.b-spark,.b-heart,.b-zzz{opacity:0;transition:opacity .2s}
@keyframes b-float{0%{transform:translateY(4px);opacity:0}30%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
.buddy[data-p="angry"] .b-brows,.buddy[data-p="angry"] .b-frown{opacity:1}
.buddy[data-p="angry"] .b-closed{opacity:0}
.buddy[data-p="angry"] .b-cheek{fill:#D24B3A;opacity:.5}
.buddy[data-p="angry"] .b-ear.l{transform:rotate(-22deg)}.buddy[data-p="angry"] .b-ear.r{transform:rotate(26deg)}
.buddy[data-p="cute"] .b-spark{opacity:1}
.buddy[data-p="cute"] .b-cheek{opacity:.6}
.buddy[data-p="cute"] .b-heart{opacity:1;animation:b-float 2.4s ease-out infinite}
.buddy[data-p="funny"] .b-grin,.buddy[data-p="funny"] .b-raise{opacity:1}
.buddy[data-p="funny"] .b-closed{opacity:0}
.buddy[data-p="sleepy"] .b-eyes{opacity:0}
.buddy[data-p="sleepy"] .b-lids{opacity:1}
.buddy[data-p="sleepy"] .b-zzz text{animation:b-float 2.6s ease-out infinite}
.buddy[data-p="sleepy"] .b-zzz text+text{animation-delay:1.3s}
.buddy[data-p="sleepy"] .b-zzz{opacity:1}
.buddy[data-p="sleepy"] .b-all{animation-duration:5s}
.buddy[data-p="sleepy"] .b-ear.l{transform:rotate(-30deg)}.buddy[data-p="sleepy"] .b-ear.r{transform:rotate(32deg)}
.buddy.mo .b-frown,.buddy.mo .b-grin{opacity:0}
.buddy[data-mood] .b-lids,.buddy[data-mood] .b-spark{opacity:0}
.b-zzz text{font:700 15px var(--sans);fill:var(--muted)}
.personas{display:flex;flex-direction:column}
.personas button{display:flex;gap:12px;align-items:center;text-align:left;min-height:60px;padding:12px 0;border-bottom:1px solid var(--line)}
.personas b{display:block;font-family:var(--serif);font-size:19px;font-weight:500}
.personas span{display:block;color:var(--muted);font-size:14px}
.personas .em{font-size:26px;width:36px;text-align:center}
.personas button.on b::after{content:" · выбран";font-family:var(--sans);font-size:13px;color:var(--accent);font-weight:500}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><div class="brand">Yomi<small>English</small></div><div class="meta"><span id="streak" hidden></span><span class="lv" id="lvl" hidden></span></div></header>
  <main id="main">
    <section class="view on" id="v-talk">
      <div class="modes" id="modes" role="tablist"></div>
      <div class="scroll" id="chatWrap"><div class="chat" id="chat" aria-live="polite"></div></div>
      <div class="dock">
        <div class="buddy" id="buddy" data-s="idle" title="Yomi" aria-hidden="true"><svg viewBox="0 0 160 150">
          <ellipse class="b-shadow" cx="80" cy="146" rx="36" ry="4"/>
          <g class="b-all">
            <g class="b-ear l"><path class="b-line" d="M57 66 C44 34 45 8 58 6 C71 4 75 32 72 64 Z"/><path class="b-inner" d="M60 58 C52 36 53 16 59 14 C65 13 67 34 66 56 Z"/></g>
            <g class="b-ear r"><path class="b-line" d="M103 66 C116 34 115 8 102 6 C89 4 85 32 88 64 Z"/><path class="b-inner" d="M100 58 C108 36 107 16 101 14 C95 13 93 34 94 56 Z"/></g>
            <ellipse class="b-line" cx="80" cy="128" rx="26" ry="15"/>

    + (busy && state !== 'listen' ? '<div class="turn-t"><div class="who">Yomi</div><div class="typing"><i></i><i></i><i></i></div></div>' : '')

}
$('#chat').onclick = async e => {

};

// ответ сервера → лента + звук
function onReply(out, userText){
  if(userText){ chat.push({role:'user', text:userText, fix: out.fix || null}); }
  chat.push({role:'tutor', text: out.reply, en: out.english, words: out.words || []});

}

/* ---------- звук: один плеер, «разблокированный» первым нажатием (iOS) ---------- */
const player = new Audio(); player.preload = 'auto';
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let unlocked = false;
function unlock(){ if(unlocked) return; unlocked = true; player.src = SILENT; player.play().catch(() => {}); }
function playB64(b64, mime = 'audio/mpeg'){
  return new Promise(res => {
    if(!b64) return res();
    player.onended = player.onerror = () => res();
    player.src = `data:${mime};base64,` + b64;
    player.play().catch(() => res());
  });
}
function speakLocal(text, lang){
  return new Promise(res => {
    if(!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text); u.lang = lang === 'ru' ? 'ru-RU' : 'en-US'; u.rate = .95;
    const t = setTimeout(res, 2000 + text.length * 90);   // некоторые браузеры молча не говорят и не присылают onend
    u.onend = u.onerror = () => { clearTimeout(t); res(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  });
}
const ttsCache = new Map();
async function sayText(text, lang = 'en', speaker = S.speaker){
  stopAudio();
  const key = [lang, speaker, text].join('|');
  let a = ttsCache.get(key);
  if(!a){ const j = await api('tts', {text, lang, speaker}); if(j.audio){ a = {b: j.audio, mime: j.mime}; ttsCache.set(key, a); } }
  return a ? playB64(a.b, a.mime) : speakLocal(text, lang);
}
function stopAudio(){ try{ player.pause(); }catch{} try{ speechSynthesis.cancel(); }catch{} }

/* ---------- разговор «как звонок»: слушаем, ловим паузу, отправляем, слушаем ответ, снова слушаем ---------- */
let state = 'idle', inCall = false, stream = null, actx = null, analyser = null, rec = null, chunks = [], vadTimer = 0;
const STATUS = {idle:'Нажми и говори по-английски', listen:'Слушаю. Нажми, чтобы отправить сразу', think:'Думаю…', speak:'Говорю. Нажми, чтобы перебить'};
function setState(s){
  state = s;
  const mic = $('#mic'); mic.className = 'mic' + (s === 'idle' ? '' : ' ' + s); mic.style.setProperty('--lvl', 0);
  mic.setAttribute('aria-label', {idle:'Говорить', listen:'Отправить', think:'Думаю', speak:'Перебить'}[s]);
  $('#status').textContent = s === 'idle' && !canRecord() ? 'Микрофон недоступен — можно писать текстом' : STATUS[s];
  $('#endBtn').style.visibility = inCall ? 'visible' : 'hidden';
  buddyState(s);
}
/* ---------- кролик ---------- */
let mouthTimer = 0, moodTimer = 0;
function buddyState(s){
  const b = $('#buddy'); if(!b) return; b.dataset.s = s; b.style.setProperty('--lvl', 0);
  clearTimeout(mouthTimer); b.classList.remove('mo');
  if(s === 'speak'){ const flap = () => { b.classList.toggle('mo'); mouthTimer = setTimeout(flap, 90 + Math.random() * 140); }; flap(); }
}
function buddyMood(m){ const b = $('#buddy'); if(!b) return; clearTimeout(moodTimer); b.dataset.mood = m; moodTimer = setTimeout(() => { delete b.dataset.mood; }, 2200); }
const PERSONA_INFO = {kind:['😊','Добрый','Мягко поправляет и хвалит'], cute:['🌸','Милый','Восторженный и ласковый, «yay!»'], angry:['😠','Злой','Ворчливый строгий учитель, придирается к каждой ошибке'], funny:['😄','Весёлый','Шутит и подкалывает'], sleepy:['😴','Сонный','Медленный и спокойный, всё время зевает']};
function hop(){ const b = $('#buddy'); b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop'); setTimeout(() => b.classList.remove('hop'), 700); }
$('#buddy').onclick = () => {
  hop();
  sheet(`<h2>Характер Yomi</h2><p class="lead">Меняется, как он говорит и как выглядит. Учит одинаково хорошо.</p><div class="personas">${Object.entries(PERSONA_INFO).map(([k, [e, n, d]]) =>
    `<button data-pe="${k}" class="${S.persona === k ? 'on' : ''}"><span class="em" aria-hidden="true">${e}</span><div><b>${n}</b><span>${d}</span></div></button>`).join('')}</div>`);
  $('#sheetIn').onclick = async e => {
    const b = e.target.closest('[data-pe]'); if(!b) return;
    closeSheet();
    if(b.dataset.pe === S.persona) return;
    const j = await api('persona', {persona: b.dataset.pe});
    if(j.ok){ S.persona = j.persona; $('#buddy').dataset.p = j.persona; hop(); $('#status').textContent = `Теперь Yomi — ${PERSONA_INFO[j.persona][1].toLowerCase()}`; }
  };
};
const canRecord = () => !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder && S.stt);

async function startCall(){
  unlock();
  if(!canRecord()){ toggleType(true); return; }
  try{
    stream ||= await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  }catch{ errText = 'Разреши доступ к микрофону в настройках'; drawChat(); return; }
  actx ||= new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') await actx.resume();
  if(!analyser){ analyser = actx.createAnalyser(); analyser.fftSize = 1024; actx.createMediaStreamSource(stream).connect(analyser); }
  inCall = true; errText = '';
  if(!chat.length) await switchMode(S.mode);   // первая реплика репетитора
  else listen();
}
function endCall(){
  inCall = false; clearInterval(vadTimer);
  if(rec?.state === 'recording'){ rec.onstop = null; rec.stop(); }
  stopAudio();
  stream?.getTracks().forEach(t => t.stop()); stream = null; analyser = null;
  if(actx){ actx.close().catch(() => {}); actx = null; }
  setState('idle'); drawChat();
}
function listen(){
  if(!inCall) return;
  const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
  rec = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined); chunks = [];
  rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  rec.onstop = sendRecording;
  rec.start(250); setState('listen');
  // пауза в речи: громкость выше шума → говорим; 1.2 c тишины после речи → отправляем
  const buf = new Float32Array(analyser.fftSize), t0 = Date.now();
  let floor = 0.01, spoke = false, lastLoud = 0, speechMs = 0;
  clearInterval(vadTimer);
  vadTimer = setInterval(() => {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0; for(const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length), now = Date.now();
    if(now - t0 < 400) floor = Math.max(floor, rms * 0.9);           // первые 0.4 с — уровень шума
    const loud = rms > Math.max(0.02, floor * 2.5);
    const lvl = Math.min(1, rms * 8).toFixed(2); $('#mic').style.setProperty('--lvl', lvl); $('#buddy').style.setProperty('--lvl', lvl);
    if(loud){ spoke = spoke || (speechMs += 50) > 250; lastLoud = now; }
    if((spoke && now - lastLoud > 1200) || now - t0 > 45000) finishUtterance();
  }, 50);
}
function finishUtterance(){ clearInterval(vadTimer); if(rec?.state === 'recording') rec.stop(); }
async function sendRecording(){
  const blob = new Blob(chunks, {type: rec.mimeType || 'audio/webm'});
  if(!inCall) return;
  if(blob.size < 3000){ listen(); return; }
  setState('think'); busy = true; drawChat();
  const audio = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(blob); });
  const j = await api('talk', {audio, mime: blob.type}).catch(() => ({error:'failed'}));
  busy = false;
  await handleTalk(j);
}
async function sendText(text){
  text = text.trim(); if(!text || busy) return;
  unlock(); stopAudio(); busy = true; errText = ''; setState('think');
  chat.push({role:'user', text, pending:true}); drawChat();
  const j = await api('talk', {text}).catch(() => ({error:'failed'}));
  chat = chat.filter(m => !m.pending); busy = false;
  if(j.error) chat.push({role:'user', text});
  await handleTalk(j, text);
}
async function handleTalk(j, typed){
  if(j.error){
    errText = {not_heard:'Не расслышал — повтори, пожалуйста', no_stt:'Распознавание речи не подключено', failed:'Не получилось получить ответ. Попробуй ещё раз.'}[j.error] || 'Ошибка: ' + j.error;
    drawChat();
    if(inCall && j.error === 'not_heard'){ listen(); return; }
    if(inCall) endCall(); else setState('idle');
    return;
  }
  errText = '';
  if(j.level !== undefined) S.level = j.level;
  if(j.plan !== undefined) S.plan = j.plan;
  if(j.stats) S.stats = j.stats;
  drawHead();
  onReply(j.out, j.heard || typed);
  buddyMood(j.out.fix ? 'oops' : 'happy');
  setState('speak');
  await (j.out.audio ? playB64(j.out.audio, j.out.mime) : speakLocal(j.out.reply, j.out.english ? 'en' : 'ru'));
  if(state !== 'speak') return;           // перебили
  if(inCall) listen(); else setState('idle');
}
async function switchMode(mode, scene){
  stopAudio(); clearInterval(vadTimer); if(rec?.state === 'recording'){ rec.onstop = null; rec.stop(); }
  busy = true; errText = ''; chat = []; setState('think'); drawChat();
  const j = await api('mode', {mode, scene}).catch(() => ({error:'failed'}));
  busy = false;
  if(j.error){ errText = 'Не получилось начать. Попробуй ещё раз.'; drawChat(); setState('idle'); return; }
  Object.assign(S, {mode: j.mode, scene: j.scene, level: j.level, plan: j.plan, stats: j.stats});
  drawModes(); drawHead();
  onReply(j.out);
  setState('speak');
  await (j.out.audio ? playB64(j.out.audio, j.out.mime) : speakLocal(j.out.reply, j.out.english ? 'en' : 'ru'));
  if(state !== 'speak') return;
  if(inCall) listen(); else setState('idle');
}

$('#mic').onclick = () => {
  unlock();
  if(state === 'idle') startCall();
  else if(state === 'listen') finishUtterance();
  else if(state === 'speak'){ stopAudio(); setState('idle'); if(inCall) listen(); }
};
$('#endBtn').onclick = endCall;
function toggleType(on){ const t = $('#typebox'); t.classList.toggle('on', on ?? !t.classList.contains('on')); $('#kbBtn').classList.toggle('on', t.classList.contains('on')); if(t.classList.contains('on')) $('#typeIn').focus(); }
$('#kbBtn').onclick = () => toggleType();
$('#typebox').onsubmit = e => { e.preventDefault(); const v = $('#typeIn').value; $('#typeIn').value = ''; sendText(v); };
$('#modes').onclick = e => {
  const b = e.target.closest('[data-m]'); if(!b || busy) return; unlock();
  const m = b.dataset.m;
  if(m === 'scenario') return openScenes();
  switchMode(m === 'reset' ? S.mode : m, S.scene);
};
function openScenes(){
  sheet(`<h2>Сценарий</h2><p class="lead">Yomi сыграет роль, а ты попрактикуешься в живой ситуации.</p><div class="scenes">${Object.entries(S.scenes).map(([k, n]) => `<button data-s="${k}">${esc(plain(n))}${ICON.chevron}</button>`).join('')}</div>`);
  $('#sheetIn').onclick = e => { const b = e.target.closest('[data-s]'); if(!b) return; closeSheet(); switchMode('scenario', b.dataset.s); };
}
function sheet(html){ $('#sheetIn').innerHTML = html; $('#sheet').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); }
$('#sheet').onclick = e => { if(e.target.id === 'sheet') closeSheet(); };

/* ---------- Слова ---------- */
let words = [];
async function showWords(){
  $('#wordsBox').innerHTML = '<div class="empty">Загружаю…</div>';
  const j = await api('words'); words = j.words || [];
  const due = words.filter(w => Date.parse(w.due) <= Date.now());
  S.due = due.length; S.words = words.length; drawHead();
  $('#wordsBox').innerHTML = `<h2>Мои слова</h2>
    <div class="cta"><div><b>${due.length}</b><small>повторить сейчас · всего ${words.length}</small></div><button class="btn" id="trainBtn" ${due.length ? '' : 'disabled'}>Тренировать</button></div>
    ${words.length ? `<div class="list">${words.map(w => `<div class="row"><div class="w"><b>${esc(w.word)}</b><span>${esc(w.translation)}</span>${w.example ? `<i>${esc(w.example)}</i>` : ''}</div>
      <div class="tools"><button class="ib" data-ws="${w.id}" aria-label="Послушать">${ICON.speak}</button><button class="ib" data-wd="${w.id}" aria-label="Удалить">${ICON.trash}</button></div></div>`).join('')}</div>`
    : '<div class="empty">Пока пусто. Новые слова из разговоров появятся здесь сами.</div>'}`;
  $('#trainBtn').onclick = () => train(due);
}
$('#wordsBox').onclick = async e => {
  const s = e.target.closest('[data-ws]'), d = e.target.closest('[data-wd]');
  if(s){ unlock(); const w = words.find(x => x.id == s.dataset.ws); if(w) sayText(w.word); }
  if(d && confirm('Удалить слово?')){ await api('delword', {id: +d.dataset.wd}); showWords(); }
};
function train(list){
  unlock();
  const queue = [...list].sort(() => Math.random() - .5);
  const next = () => {
    const w = queue.shift();
    if(!w){ closeSheet(); showWords(); return; }
    sheet(`<h2>Тренировка</h2><p class="lead">Осталось ${queue.length + 1}</p>
      <div class="card" id="card"><div class="word">${esc(w.word)}</div>${w.example ? `<div class="ex">${esc(w.example)}</div>` : ''}<div class="tr" id="cardTr" hidden>${esc(w.translation)}</div>
      <small id="cardHint">нажми, чтобы увидеть перевод</small></div>
      <div class="grades" id="grades" hidden><button class="g0" data-g="0">Не помню</button><button class="g1" data-g="1">Трудно</button><button class="g2" data-g="2">Знаю</button></div>`);
    sayText(w.word);
    $('#card').onclick = () => { $('#cardTr').hidden = false; $('#cardHint').hidden = true; $('#grades').hidden = false; };
    $('#grades').onclick = e => { const b = e.target.closest('[data-g]'); if(!b) return;
      api('review', {id: w.id, grade: +b.dataset.g});
      if(b.dataset.g === '0') queue.push(w);          // забытое — ещё раз в конце
      next(); };
  };
  next();
}

/* ---------- Ошибки ---------- */
async function showMistakes(){
  $('#mistBox').innerHTML = '<div class="empty">Загружаю…</div>';
  const j = await api('mistakes'), list = j.mistakes || [];
  $('#mistBox').innerHTML = `<h2>Разбор ошибок</h2><p class="lead">Как ты сказал и как лучше.</p>${list.length ? `<div class="list">${list.map(m => `<div class="row mist"><div class="w">
      <s>${esc(m.original)}</s><div class="ok">${esc(m.fixed)}</div>${(m.notes || []).map(n => `<div class="n">${esc(n)}</div>`).join('')}
      <time>${new Date(m.at).toLocaleString('ru', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</time></div>
      <div class="tools"><button class="ib" data-ms="${esc(m.fixed)}" aria-label="Послушать">${ICON.speak}</button></div></div>`).join('')}</div>`
    : '<div class="empty">Ошибок пока нет. Поговори с Yomi — исправления будут собираться здесь.</div>'}`;
}
$('#mistBox').onclick = e => { const b = e.target.closest('[data-ms]'); if(b){ unlock(); sayText(b.dataset.ms); } };

/* ---------- Прогресс ---------- */
function showProgress(){
  const days = S.stats?.days || {}, today = new Date().toISOString().slice(0, 10);
  const total = Object.values(days).reduce((a, b) => a + b, 0);
  const last = [...Array(14)].map((_, i) => { const d = new Date(); d.setUTCDate(d.getUTCDate() - 13 + i); const k = d.toISOString().slice(0, 10); return [k, days[k] || 0]; });
  const max = Math.max(5, ...last.map(x => x[1]));
  const p = S.plan, st = streak();
  $('#progBox').innerHTML = `<h2>Прогресс</h2><p class="lead">${st ? `Занимаешься ${st} ${plural(st, 'день', 'дня', 'дней')} подряд.` : 'Скажи сегодня хотя бы пару фраз — начнётся серия.'}</p>
    <div class="figures"><div><b>${S.level || '—'}</b><span>уровень</span></div><div><b>${days[today] || 0}</b><span>фраз сегодня</span></div><div><b>${total}</b><span>фраз всего</span></div></div>
    <div class="figures"><div><b>${st}</b><span>дней подряд</span></div><div><b>${S.words}</b><span>слов</span></div><div><b>${S.due}</b><span>к повтору</span></div></div>
    <p class="chart-h">Фразы за две недели</p>
    <div class="bars">${last.map(([k, n]) => `<div><i class="${k === today ? 'today' : n ? '' : 'zero'}" style="height:${Math.round(n / max * 100)}%"></i><span>${+k.slice(8)}</span></div>`).join('')}</div>
    <div class="plan">${p ? `<h3>Мой план · ${esc(p.level)}</h3><p>${esc(p.summary || '')}</p><ol>${(p.plan || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>`
      : '<h3>Плана пока нет</h3><p>Пройди тест уровня или расскажи Yomi о своих целях — он составит план.</p>'}</div>
    <div class="actions"><button class="btn" data-go="test">Пройти тест уровня</button><button class="btn line" data-go="coach">Составить план</button></div>
    <div class="plan" style="margin-top:22px"><h3>Голос Yomi</h3><p>Нажми, чтобы послушать. Выбранный голос будет и на сайте, и в боте.</p>
      <div class="voices">${VOICES.map(([k, n, g]) => `<div class="voice${S.speaker === k ? ' on' : ''}"><button class="ib" data-vp="${k}" aria-label="Послушать ${n}">${ICON.speak}</button>
        <div class="w"><b>${n}</b><span>${g}</span></div><button class="btn${S.speaker === k ? '' : ' line'} sm" data-vs="${k}">${S.speaker === k ? 'Выбран' : 'Выбрать'}</button></div>`).join('')}</div></div>`;
}
$('#progBox').onclick = async e => {
  unlock();
  const go = e.target.closest('[data-go]'), vp = e.target.closest('[data-vp]'), vs = e.target.closest('[data-vs]');
  if(go){ tab('talk'); switchMode(go.dataset.go); }
  if(vp) sayText("Hi, I'm Yomi. Let's practise English together. How was your day?", 'en', vp.dataset.vp);
  if(vs && vs.dataset.vs !== S.speaker){ const j = await api('speaker', {speaker: vs.dataset.vs}); if(j.ok){ S.speaker = j.speaker; showProgress(); } }
};

/* ---------- вкладки и запуск ---------- */
function tab(v){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  if(v !== 'talk' && inCall) endCall();
  if(v === 'words') showWords();
  if(v === 'mist') showMistakes();
  if(v === 'prog') showProgress();
}
$('#nav').onclick = e => { const b = e.target.closest('[data-v]'); if(b) tab(b.dataset.v); };

(async () => {
  if(!AUTH) return gate();
  drawModes(); drawChat(); setState('idle');
  const j = await api('state').catch(() => ({error:'failed'}));
  if(j.error){ if(j.error !== 'auth'){ errText = 'Нет связи с сервером. Обнови страницу.'; drawChat(); } return; }
  Object.assign(S, j);
  // лента из браузера устарела (разговор шёл в боте) — показываем историю с сервера
  const last = chat.filter(m => m.role === 'tutor').pop()?.text, srv = S.history.filter(m => m.role === 'assistant').pop()?.text;
  if(last !== srv) chat = S.history.map(m => m.role === 'user' ? {role:'user', text:m.text} : {role:'tutor', text:m.text, en:true});
  $('#buddy').dataset.p = S.persona || 'kind';
  saveChat(); drawModes(); drawHead(); drawChat(); setState('idle');
})();
</script>
</body>
