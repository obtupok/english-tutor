<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YomiScore — IELTS и SAT с кроликом Yomi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Дизайн-система (UI/UX Pro Max: Claymorphism для учебного приложения с маскотом).
   Светлая тема: индиго — основное, зелёный — прогресс и верные ответы, оранжевый — акценты и серия дней.
   Шрифты: Nunito 800/900 — заголовки (скруглённые), Manrope 500 — текст. Касания ≥ 44 px, ритм отступов 4/8. */
:root{
  --bg:#EEF2FF; --card:#FFFFFF; --fg:#1E1B4B; --fg-2:#3B3A6B; --muted:#475569; --muted-bg:#E9ECFA; --border:#C7D2FE; --border-2:#A5B4FC;
  --primary:#4F46E5; --primary-d:#3730A3; --on-primary:#FFFFFF; --secondary:#818CF8;
  --green:#15803D; --green-bg:#DCFCE7; --green-d:#166534; --orange:#C2410C; --orange-bg:#FFEDD5; --red:#DC2626; --red-bg:#FEE2E2;
  --amber:#B45309; --amber-bg:#FEF3C7;
  --ring:#4F46E5;
  /* старые имена — их использует рисунок кролика (шарф и т. п.) */
  --accent:#F97316; --accent-ink:#FFFFFF; --ink:var(--fg); --ink-2:var(--fg-2); --paper:var(--bg); --sheet:var(--card); --line:var(--border); --line-2:var(--border-2); --serif:var(--head); --sans:var(--body);
  --head:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  --clay:0 6px 0 var(--border),0 14px 28px rgba(79,70,229,.10);
  --clay-sm:0 4px 0 var(--border),0 8px 16px rgba(79,70,229,.08);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --t-fast:150ms; --t-med:220ms; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:500 16px/1.5 var(--body)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:12px}
svg{flex:none}
h1,h2,h3{font-family:var(--head);color:var(--fg);margin:0;letter-spacing:-.01em}
h2{font-size:26px;font-weight:900;line-height:1.15}
h3{font-size:19px;font-weight:800;line-height:1.25}
.lead{color:var(--muted);margin:6px 0 16px;font-size:15px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* каркас */
.app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-t)) 16px 8px}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:900;font-size:24px;color:var(--fg)}
.brand .logo{width:34px;height:34px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--primary-d)}
.brand .logo svg{width:22px;height:22px}
.brand-s{color:var(--primary);margin-left:-8px}
.brand small{font:700 12px var(--body);color:var(--primary);background:#E0E7FF;padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:99px;background:var(--card);border:2px solid var(--border);font-weight:700;font-size:14px;color:var(--fg)}
.chip svg{width:18px;height:18px}
.chip.fire{color:var(--orange);border-color:#FED7AA;background:#FFF7ED}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:2px solid var(--border);color:var(--fg-2);box-shadow:0 3px 0 var(--border);transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--border)}
.iconbtn svg{width:22px;height:22px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 24px}

/* нижняя навигация: 4 пункта, подписи всегда видны */
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(8px + var(--safe-b));background:var(--card);border-top:2px solid var(--border)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border-radius:16px;font-size:12px;font-weight:700;color:var(--muted);transition:background var(--t-fast),color var(--t-fast)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--primary);background:#E0E7FF}

/* clay-карточки и кнопки */
.card{background:var(--card);border:3px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--clay);padding:16px}
.card + .card{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:var(--r-md);background:var(--primary);color:var(--on-primary);font:800 16px var(--head);letter-spacing:.01em;
  box-shadow:0 5px 0 var(--primary-d);transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),filter var(--t-fast)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-d)}
.btn svg{width:20px;height:20px}
.btn.green{background:#16A34A;box-shadow:0 5px 0 var(--green-d)}.btn.green:active{box-shadow:0 1px 0 var(--green-d)}
.btn.line{background:var(--card);color:var(--primary);border:3px solid var(--border);box-shadow:0 5px 0 var(--border)}.btn.line:active{box-shadow:0 1px 0 var(--border)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:15px;border-radius:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:1}
.empty{color:var(--muted);text-align:center;padding:40px 12px}
.badge{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}

/* главная: кролик-герой с репликой */
.hero{display:flex;align-items:flex-end;gap:6px;margin:4px 0 14px}
.hero-slot{flex:none;width:132px;height:121px;display:grid;place-items:end center}
.bubble{position:relative;flex:1;background:var(--card);border:3px solid var(--border);border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:var(--clay-sm);margin-bottom:26px;font-weight:600;font-size:15px;line-height:1.45}
.bubble b{font-family:var(--head);font-size:18px;display:block;margin-bottom:2px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:120px}
.goal .eyebrow{display:flex;align-items:center;gap:6px}
.goal .big{font:900 30px/1 var(--head);color:var(--fg)}
.goal .big small{font:700 14px var(--body);color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--muted-bg);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--secondary),var(--primary))}
.bar.green i{background:linear-gradient(90deg,#4ADE80,#16A34A)}
.goal .gnote{color:var(--muted);font-size:13px;font-weight:600}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-h h3{font-size:18px}
.tiles{display:flex;flex-direction:column;gap:12px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:3px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--clay-sm);padding:14px;min-height:76px;transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--border)}
.tile .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.tile .ic svg{width:26px;height:26px}
.tile .t{flex:1;min-width:0}.tile .t b{display:block;font:800 17px var(--head)}.tile .t small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.tile .go{color:var(--border-2)}.tile .go svg{width:22px;height:22px}
.ic.indigo{background:var(--primary)}.ic.violet{background:#7C3AED}.ic.green{background:#16A34A}.ic.orange{background:#EA580C}.ic.sky{background:#0284C7}.ic.pink{background:#DB2777}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:2px solid var(--border);border-radius:16px}
.hrow .ic{width:40px;height:40px;border-radius:12px}.hrow .ic svg{width:20px;height:20px}
.hrow span{flex:1;min-width:0}.hrow b{display:block;font-weight:700}.hrow small{color:var(--muted);font-size:13px}
.reading{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;border:0;box-shadow:0 6px 0 #3730A3,0 14px 28px rgba(79,70,229,.25)}
.reading .t small{color:#E0E7FF}.reading .go{color:#C7D2FE}.reading .ic{background:rgba(255,255,255,.18);box-shadow:none}
.hrow em{font:900 18px var(--head);font-style:normal;color:var(--primary)}
.seg{display:flex;gap:6px;padding:5px;background:var(--muted-bg);border-radius:16px}
.seg button{flex:1;min-height:44px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 2px 0 var(--border)}

/* SAT: вопрос */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtop .bar{flex:1}
.qtop b{font:800 15px var(--head);min-width:48px;text-align:right}
.skill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--primary);background:#E0E7FF;padding:4px 10px;border-radius:99px;margin-bottom:10px}
.skill.hard{color:var(--orange);background:var(--orange-bg)}.skill.easy{color:var(--green);background:var(--green-bg)}
.passage{background:#F8FAFF;border:2px solid var(--border);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.6;color:var(--fg-2);white-space:pre-wrap;margin-bottom:12px;max-height:38vh;overflow-y:auto}
.question{font-weight:700;font-size:17px;line-height:1.45;margin:0 0 12px;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:56px;padding:12px 14px;background:var(--card);border:3px solid var(--border);border-radius:16px;box-shadow:0 4px 0 var(--border);font-weight:600;line-height:1.4;transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast),border-color var(--t-fast)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--border)}
.choice .l{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--muted-bg);font:900 15px var(--head);color:var(--fg-2)}
.choice.ok{border-color:#22C55E;background:#F0FDF4;box-shadow:0 4px 0 #86EFAC}.choice.ok .l{background:#16A34A;color:#fff}
.choice.bad{border-color:#F87171;background:#FEF2F2;box-shadow:0 4px 0 #FECACA}.choice.bad .l{background:var(--red);color:#fff}
.choice[disabled]{cursor:default}
.explain{margin-top:14px;padding:14px;border-radius:16px;border:2px solid;font-size:15px;line-height:1.5}
.explain.ok{border-color:#86EFAC;background:#F0FDF4}.explain.bad{border-color:#FECACA;background:#FEF2F2}
.explain b{display:flex;align-items:center;gap:6px;font:800 16px var(--head);margin-bottom:4px}
.explain b svg{width:20px;height:20px}
.score{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--p) * 1%),var(--muted-bg) 0)}
.ring>div{width:88px;height:88px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font:900 28px/1 var(--head)}.ring small{font-size:11px;font-weight:700;color:var(--muted)}
.crit{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.crit div{display:grid;grid-template-columns:1fr 34px;gap:4px 8px;font-size:13px;font-weight:600;color:var(--fg-2)}
.crit div .bar{grid-column:1/-1;height:8px}
.crit div b{text-align:right;color:var(--fg)}
.list{margin:6px 0 0;padding-left:20px}.list li{margin:4px 0;color:var(--fg-2)}
.fix{padding:12px;border-radius:14px;background:#F8FAFF;border:2px solid var(--border);margin-top:8px}
.fix s{color:var(--red);text-decoration-thickness:2px}.fix p{margin:4px 0 0;font-weight:700;color:var(--green)}.fix small{display:block;color:var(--muted);margin-top:4px}
details.rev{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:0 14px;margin-top:8px}
details.rev summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:700;display:flex;gap:10px;align-items:center}
details.rev summary::-webkit-details-marker{display:none}
details.rev summary .dot{flex:none;width:12px;height:12px;border-radius:50%}
details.rev p{margin:0 0 12px;color:var(--fg-2);font-size:15px}
textarea.essay{width:100%;min-height:42vh;padding:14px;border-radius:16px;border:3px solid var(--border);background:var(--card);color:var(--fg);font:500 16px/1.6 var(--body);resize:vertical}
textarea.essay:focus{outline:none;border-color:var(--primary)}
.wc{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 0;font-size:14px;font-weight:700;color:var(--muted)}
.wc .okc{color:var(--green)}
.prompt{background:#F8FAFF;border:2px dashed var(--border-2);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.55;white-space:pre-wrap;margin:10px 0 12px}

/* разговор */
.chats{display:flex;gap:6px;margin:4px 16px 8px;padding:5px;background:var(--muted-bg);border-radius:16px}
.chats button{flex:1;min-height:44px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted)}
.chats button.on{background:var(--card);color:var(--fg);box-shadow:0 2px 0 var(--border)}
.modes{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes .hint{flex:none;align-self:center;font-size:14px;color:var(--muted)}
.modes button{flex:none;min-height:40px;padding:6px 14px;border-radius:99px;border:2px solid var(--border);background:var(--card);font-weight:700;font-size:14px;color:var(--fg-2)}
.modes button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chat{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.turn-t{align-self:flex-start;max-width:92%;background:var(--card);border:2px solid var(--border);border-radius:6px 20px 20px 20px;padding:12px 14px;box-shadow:0 3px 0 var(--border)}
.turn-t .who{font:800 12px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:2px}
.turn-t .tx{font-size:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.tools{display:flex;gap:4px;margin:6px 0 0 -8px}
.tools button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:12px;font-size:13px;font-weight:700;color:var(--muted)}
.tools button:active{background:var(--muted-bg)}
.tools svg{width:18px;height:18px}
.trl{margin-top:6px;padding-left:10px;border-left:3px solid var(--border);color:var(--fg-2);font-size:15px}
.newwords{margin-top:8px;font-size:14px;color:var(--muted)}.newwords b{color:var(--fg)}
.turn-u{align-self:flex-end;max-width:85%;padding:10px 14px;border-radius:20px 20px 6px 20px;background:var(--primary);color:#fff;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--primary-d)}
.note{align-self:flex-end;max-width:85%;margin-top:-6px;padding:10px 12px;border-radius:14px;background:var(--green-bg);border:2px solid #86EFAC;font-size:14px}
.note small{display:block;font:800 11px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.note b{display:block;font-size:16px;color:var(--fg)}.note span{display:block;color:var(--fg-2)}
.result{padding:16px;border:3px solid var(--border);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--clay-sm)}
.result .big{font:900 48px/1 var(--head);color:var(--primary)}
.result p{margin:8px 0 0}.result h4{margin:12px 0 2px;font:800 12px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.result ol,.result ul{margin:0;padding-left:20px}
.typing{display:flex;gap:5px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--secondary);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}
.err{align-self:center;text-align:center;color:var(--red);font-size:14px;font-weight:600;padding:4px 12px}
.dock{padding:8px 16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg)}
.status{font-size:14px;font-weight:600;color:var(--muted);min-height:21px;text-align:center}
.dock-row{display:flex;align-items:center;justify-content:center;gap:28px;width:100%}
.side{width:52px;height:52px;border-radius:18px;border:2px solid var(--border);background:var(--card);display:grid;place-items:center;color:var(--fg-2);box-shadow:0 3px 0 var(--border)}
.side svg{width:22px;height:22px}
.side.on{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 3px 0 var(--primary-d)}
.mic{--lvl:0;width:80px;height:80px;border-radius:28px;background:var(--primary);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 6px 0 var(--primary-d),0 14px 24px rgba(79,70,229,.25);transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast),background var(--t-med)}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--primary-d)}
.mic svg{width:32px;height:32px}
.mic.listen{background:#16A34A;box-shadow:0 6px 0 var(--green-d),0 0 0 calc(4px + var(--lvl) * 14px) rgba(34,197,94,.25)}
.mic.think::after{content:"";position:absolute;inset:-8px;border-radius:32px;border:3px solid var(--border);border-top-color:var(--primary);animation:spin .9s linear infinite}
.mic .i-stop,.mic.speak .i-mic{display:none}.mic.speak .i-stop{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.typebox{display:none;width:100%;gap:8px}.typebox.on{display:flex}
.typebox input{flex:1;min-width:0;min-height:52px;padding:10px 14px;border-radius:16px;border:3px solid var(--border);background:var(--card);color:var(--fg);font:inherit}
.typebox input:focus{outline:none;border-color:var(--primary)}
.typebox button{min-width:52px;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--primary-d)}
.typebox button svg{width:22px;height:22px}
.facechip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(190px + var(--safe-b));z-index:6;padding:10px 16px;border-radius:99px;background:var(--card);border:2px solid var(--border);font-size:14px;font-weight:800;box-shadow:var(--clay-sm)}
.gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;padding:32px;text-align:center;color:var(--muted)}
.gate b{color:var(--fg);font:900 24px var(--head)}

/* листы и уведомления */
.sheet{position:fixed;inset:0;z-index:45;display:none;background:rgba(30,27,75,.45);align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{width:100%;max-width:600px;max-height:90dvh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(20px + var(--safe-b));animation:up var(--t-med) var(--ease);border-top:3px solid var(--border)}
.sheet .in::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--border-2);margin:0 auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.scenes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.scenes button{text-align:left;min-height:52px;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--border);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.scenes button svg{width:18px;height:18px;color:var(--muted)}
.toastx{position:fixed;left:50%;top:calc(12px + var(--safe-t));z-index:60;transform:translate(-50%,-140%);max-width:min(92vw,420px);padding:12px 16px;border-radius:16px;background:var(--fg);color:#fff;font-size:14px;font-weight:600;text-align:center;box-shadow:0 8px 24px rgba(30,27,75,.3);transition:transform .3s var(--ease)}
.toastx:not(.on){visibility:hidden;opacity:0;transition:transform .3s,opacity .3s,visibility 0s .3s}
.toastx.on{transform:translate(-50%,0)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:2px solid var(--muted-bg)}
.setrow input[type=range]{flex:1;max-width:200px;accent-color:var(--primary)}
.pets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.pets button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 8px;border-radius:16px;background:var(--card);border:3px solid var(--border);font-size:12px;font-weight:700}
.pets button.on{border-color:var(--primary);box-shadow:0 3px 0 var(--primary-d)}
.pets .buddy.mini{--bsize:56px}
.voices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.voice{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--card);border:2px solid var(--border)}
.voice.on{border-color:var(--primary)}
.voice .w{flex:1}.voice .w b{display:block;font-weight:800}.voice .w span{font-size:13px;color:var(--muted)}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--primary);background:#E0E7FF}
.ib svg{width:20px;height:20px}
.inp{width:100%;min-height:52px;padding:10px 14px;border-radius:16px;border:3px solid var(--border);background:var(--card);color:var(--fg);font:inherit}
.inp:focus{outline:none;border-color:var(--primary)}
label.lbl{display:block;font-weight:700;margin:12px 0 6px}

/* ---------- экран разговора и экзамена: кролик в центре, ореол по состоянию ---------- */
.face{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:calc(18px + var(--safe-t)) 18px calc(18px + var(--safe-b));overflow-y:auto;text-align:center;--fc:#A5B4FC;--lvl:0}
.face-mode{margin:0;font:800 13px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.face-timer{margin:0;padding:8px 16px;border-radius:99px;background:var(--card);border:2px solid var(--border);font:900 16px var(--head);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--border)}
.face-timer.low{color:var(--red);border-color:#FCA5A5}
.face-stage{position:relative;display:grid;place-items:center;flex:none;width:min(84vw,330px,44vh);aspect-ratio:1;margin-top:auto;border-radius:50%}
.face-stage:focus,.face-stage:focus-visible{outline:none}
.face-halo{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--fc) 55%,transparent) 0,color-mix(in srgb,var(--fc) 18%,transparent) 55%,transparent 72%);transform:scale(calc(.92 + var(--lvl) * .3));transition:transform .12s,background .3s}
.face[data-s="listen"]{--fc:#4ADE80}.face[data-s="speak"]{--fc:#818CF8}.face[data-s="think"]{--fc:#C4B5FD}
.face[data-s="speak"] .face-halo{animation:h-pulse 1.4s ease-in-out infinite}
@keyframes h-pulse{50%{transform:scale(1.06)}}
.face[data-mood="angry"]{--fc:#F87171}.face[data-mood="happy"]{--fc:#FCD34D}.face[data-mood="sad"]{--fc:#93C5FD}
.face-slot{position:relative;z-index:2;display:grid;place-items:center}
.face-flames{position:absolute;z-index:0;left:14%;width:72%;top:-8%;display:none;transform-origin:50% 90%;filter:drop-shadow(0 0 18px rgba(240,85,58,.4))}
.face[data-mood="angry"] .face-flames{display:block;animation:p-fire .35s ease-in-out infinite alternate}
@keyframes p-fire{0%{transform:scale(1,1)}50%{transform:scale(1.03,1.07) skewX(-1.5deg)}100%{transform:scale(.99,1.03) skewX(1.5deg)}}
.face-dots{display:none}
.face[data-s="think"] .face-dots{display:flex;position:absolute;left:50%;bottom:4%;transform:translateX(-50%);gap:6px}
.face-dots i{width:9px;height:9px;border-radius:50%;background:var(--primary);animation:p-dot 1s infinite}.face-dots i:nth-child(2){animation-delay:.15s}.face-dots i:nth-child(3){animation-delay:.3s}
@keyframes p-dot{50%{transform:translateY(-6px);opacity:.4}}
.buddy.staged{position:relative;left:auto;top:auto;z-index:1;--bsize:min(74vw,290px,40vh)!important;pointer-events:none;cursor:default}
.face-cap{max-width:440px;min-height:1.5em;margin:6px 0 0;font:800 19px/1.4 var(--head);color:var(--fg)}
.face-cap.user{color:var(--muted);font:600 16px var(--body);font-style:italic}
.face-fix{max-width:440px;padding:12px 14px;border-radius:16px;background:var(--green-bg);border:2px solid #86EFAC;font-size:15px;text-align:left}.face-fix b{color:var(--green-d)}
.face-card{max-width:440px;width:100%;max-height:34vh;overflow-y:auto;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--border);text-align:left;font-size:15px;line-height:1.55;color:var(--fg-2)}
.face-card ul{margin:6px 0 0;padding-left:18px}.face-card p{margin:0}
.face-status{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
.face-btns{flex:none;display:flex;justify-content:center;gap:36px;margin-top:auto;padding-top:14px}
.face-btn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.face-btn svg{width:60px;height:60px;padding:17px;border-radius:22px;background:var(--card);border:2px solid var(--border);color:var(--fg-2);box-shadow:0 4px 0 var(--border)}
.face-btn.go svg{background:#16A34A;border-color:#16A34A;color:#fff;box-shadow:0 4px 0 var(--green-d)}
.face-btn.end svg{background:#EF4444;border-color:#EF4444;color:#fff;box-shadow:0 4px 0 #B91C1C}
.face[data-exam]{padding-top:calc(14px + var(--safe-t))}
.face[data-exam] .face-stage{width:min(56vw,230px,30vh);margin-top:6px}
.face[data-exam] .buddy.staged{--bsize:min(44vw,180px,26vh)!important}
.face[data-exam] .face-cap{font-size:18px}
.hero-slot .buddy.staged{--bsize:176px!important}
.hero-slot{width:176px!important;height:161px!important;margin-left:-10px}
#satSlot .buddy.staged{--bsize:84px!important}#wrSlot .buddy.staged{--bsize:96px!important}
/* смена наряда — короткая «вспышка» */
.buddy.t-poof > svg{animation:b-poof .45s var(--ease)}
@keyframes b-poof{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1)}}

/* Кролик Yomi: чиби, нарисован чернилами по бумаге. Плавает поверх всего сайта: зажать и перетащить, водить по нему — гладить.
   data-s — что происходит в разговоре (idle/listen/think/speak), data-p — эмоция из ответа модели (18 штук),
   data-mood — короткая реакция на реплику (happy/oops), f-* — случайные «живые» движения, t-* — реакция на нажатие,
   .petting — гладят, .carried — несут. */
.buddy{--lvl:0;--ex:0px;--ey:0px;--b-fur:#FBF8F2;--b-ink:#2A241D;--b-belly:#F1E6D6;--b-nose:#E79A97;--bsize:110px;
  position:fixed;z-index:30;left:var(--bx,calc(100% - var(--bsize) - 10px));top:var(--by,calc(100% - var(--bsize) - 190px));
  width:var(--bsize);height:calc(var(--bsize) * .915);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.buddy[hidden]{display:none!important}
.buddy svg{width:100%;height:100%;overflow:hidden;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.buddy::after{content:"";position:absolute;left:24%;right:24%;bottom:2px;height:6px;border-radius:50%;background:#000;opacity:.12;pointer-events:none;transition:transform .2s,opacity .2s}
.buddy.carried{cursor:grabbing}
.buddy.carried::after{transform:scale(.6) translateY(14px);opacity:.06}
.buddy.carried > svg{animation:b-dangle .5s ease-in-out infinite!important;transform-origin:50% 10%}
.b-ear{transform-box:view-box;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.b-ear.l{transform-origin:64px 80px}.b-ear.r{transform-origin:96px 80px}
.b-head,.b-look,.b-eyes,.b-foot,.b-body,.b-nose,.b-vein,.b-heart,.b-zzz text,.b-steam circle,.b-stars path,.b-hearts path,.b-mark,.b-flame,.b-sparkle,.b-tear{transform-box:fill-box}
.b-line{fill:var(--b-fur);stroke:var(--b-ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.b-inner{fill:var(--accent);opacity:.3}
.b-ink{fill:var(--b-ink)}
.b-belly{fill:var(--b-belly)}
.b-shade{fill:var(--b-ink);opacity:.045}
.b-nose{fill:var(--b-nose);stroke:var(--b-ink);stroke-width:1.3;stroke-linejoin:round;transform-origin:center}
.b-whisk{fill:none;stroke:var(--b-ink);stroke-width:1.4;stroke-linecap:round;opacity:.55}
.b-scarf{fill:var(--accent);stroke:var(--b-ink);stroke-width:2.2;stroke-linejoin:round}
.b-scarf-stripe{fill:none;stroke:var(--b-fur);stroke-width:2;stroke-linecap:round;opacity:.55}
.b-gloss{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;opacity:.7}
.b-fluff{stroke-width:2}
.b-dots circle{fill:var(--muted)}
.b-stroke{fill:none;stroke:var(--b-ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.b-cheek{fill:var(--accent);opacity:.32;transition:opacity .3s,fill .3s}
.b-blush{fill:none;stroke:#D9475A;stroke-width:1.8;stroke-linecap:round}
.b-mark{font:800 26px var(--sans);fill:var(--accent)}
.b-zzz text{font:700 15px var(--sans);fill:var(--muted)}
/* движения всего кролика — на самой картинке: так их рисует видеокарта, а не процессор */
.buddy > svg{transform-origin:50% 96%;animation:b-breathe 3.2s ease-in-out infinite;will-change:transform}
.b-head{transform-box:view-box!important;transform-origin:80px 120px;transition:transform .35s ease}
.b-look{transform:translate(var(--ex),var(--ey));transition:transform .25s ease-out}
.b-eyes{transform-origin:center;animation:b-blink 4.6s infinite}
.b-foot{transform-origin:20% 100%}
.b-ear.l{transform:rotate(-8deg)}.b-ear.r{transform:rotate(14deg)}
/* всё необычное по умолчанию скрыто; эмоции включают нужные детали */
.b-wide,.b-star,.b-heye,.b-swirl,.b-half,.b-glasses,.b-happy,.b-oops,.b-lids,.b-spark,.b-brows,.b-sadbrows,.b-detbrows,.b-raise,.b-blush,
.b-open,.b-frown,.b-grin,.b-o,.b-wavy,.b-smirk,.b-flat,.b-smile,
.b-tear,.b-sweat,.b-vein,.b-mark,.b-flame,.b-sparkle,.b-heart,.b-hearts,.b-zzz,.b-dots,.b-waves,.b-steam,.b-stars{opacity:0;transition:opacity .18s}

@keyframes b-breathe{50%{transform:translateY(1.5px) scaleY(.982)}}
@keyframes b-blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
@keyframes b-hop{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(0) scale(1.06,.92)}40%{transform:translateY(-16px) scale(.95,1.06)}65%{transform:translateY(0) scale(1.05,.95)}80%{transform:translateY(-3px)}}
@keyframes b-boing{0%,100%{transform:scale(1)}20%{transform:scale(1.14,.84)}45%{transform:scale(.9,1.12)}65%{transform:scale(1.05,.96)}85%{transform:scale(.98,1.02)}}
@keyframes b-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes b-jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px) scale(1.04)}}
@keyframes b-shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes b-dangle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes b-dot{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes b-wave{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
@keyframes b-float{0%{transform:translateY(4px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translateY(-14px) scale(1);opacity:0}}
@keyframes b-bob{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-2.5deg) translateY(1px)}70%{transform:rotate(2deg) translateY(-1px)}}
@keyframes b-tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes b-stomp{0%,70%,100%{transform:translate(0)}74%{transform:translate(-2px,0)}78%{transform:translate(2px,0)}82%{transform:translate(-2px,0)}86%{transform:translate(1px,0)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-nod{0%,55%,100%{transform:rotate(0) translateY(0)}75%{transform:rotate(7deg) translateY(4px)}82%{transform:rotate(-1deg) translateY(-1px)}}
@keyframes b-giggle{0%,60%,100%{transform:rotate(0)}64%{transform:rotate(-4deg)}68%{transform:rotate(4deg)}72%{transform:rotate(-4deg)}76%{transform:rotate(3deg)}80%{transform:rotate(0)}}
@keyframes b-wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes b-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes b-pop{0%{transform:scale(0) rotate(0);opacity:0}30%{transform:scale(1.2) rotate(20deg);opacity:1}100%{transform:scale(.6) rotate(45deg);opacity:0}}
@keyframes b-pulse{50%{transform:scale(1.18)}}
@keyframes b-twitch{0%,100%{transform:rotate(14deg)}20%{transform:rotate(24deg)}40%{transform:rotate(6deg)}60%{transform:rotate(20deg)}}
@keyframes b-lookaround{0%,100%{transform:translate(0,0)}25%,40%{transform:translate(-3.5px,0)}60%,80%{transform:translate(3.5px,-.5px)}}
@keyframes b-sniff{0%,100%{transform:translateY(0) scale(1)}20%,60%{transform:translateY(-1px) scale(1.15,.9)}40%,80%{transform:translateY(0) scale(1)}}
@keyframes b-stretch{0%,100%{transform:scale(1)}40%,60%{transform:scale(.96,1.08)}}
@keyframes b-tilt{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-9deg)}}

/* говорит: рот (класс .mo) и кивки головой, пока звучит голос (класс .talking) */
.buddy .b-mouth.mo > *{opacity:0!important}
.buddy .b-mouth.mo .b-open{opacity:1!important}
.buddy.talking .b-head{animation:b-bob .55s ease-in-out infinite}
/* слушает: уши торчком и подёргиваются в такт голосу, голова набок, волны у уха */
.buddy[data-s="listen"] .b-ear.l{transform:rotate(calc(-2deg - var(--lvl) * 12deg))}
.buddy[data-s="listen"] .b-ear.r{transform:rotate(calc(2deg + var(--lvl) * 12deg))}
.buddy[data-s="listen"] .b-head{transform:rotate(-6deg) translateY(2px)}
.buddy[data-s="listen"] .b-waves{opacity:1}
.buddy[data-s="listen"] .b-waves path{animation:b-wave 1.2s infinite}
.buddy[data-s="listen"] .b-waves path+path{animation-delay:.3s}
/* думает: глаза вверх, голова набок, «…» над головой, постукивает лапкой */
.buddy[data-s="think"] .b-look{transform:translate(3px,-4px)}
.buddy[data-s="think"] .b-head{transform:rotate(5deg)}
.buddy[data-s="think"] .b-dots{opacity:1}
.buddy[data-s="think"] .b-dots circle{animation:b-dot 1s infinite}
.buddy[data-s="think"] .b-dots circle:nth-child(2){animation-delay:.2s}
.buddy[data-s="think"] .b-dots circle:nth-child(3){animation-delay:.4s}
.buddy[data-s="think"] .b-foot.r{animation:b-tap .45s ease-in-out infinite}

/* ---------- 18 эмоций (data-p) ---------- */
/* глаза: какие эмоции заменяют обычные глаза */
.buddy:is([data-p="sleepy"],[data-p="proud"],[data-p="excited"],[data-p="surprised"],[data-p="scared"],[data-p="love"],[data-p="confused"],[data-p="sly"],[data-p="bored"],[data-p="cool"]) .b-eyes{opacity:0}
/* рты: какие эмоции заменяют обычный рот-«w» */
.buddy:is([data-p="angry"],[data-p="funny"],[data-p="excited"],[data-p="surprised"],[data-p="shy"],[data-p="proud"],[data-p="sad"],[data-p="confused"],[data-p="love"],[data-p="cool"],[data-p="scared"],[data-p="sly"],[data-p="bored"],[data-p="determined"]) .b-closed{opacity:0}
.buddy[data-p="cute"] .b-spark{opacity:1}
.buddy[data-p="cute"] .b-cheek{opacity:.62}
.buddy[data-p="cute"] .b-heart{opacity:1;animation:b-float 2.4s ease-out infinite}
.buddy[data-p="cute"] > svg{animation:b-sway 2.6s ease-in-out infinite}
.buddy[data-p="angry"] :is(.b-brows,.b-frown,.b-vein,.b-steam){opacity:1}
.buddy[data-p="angry"] .b-cheek{fill:#D24B3A;opacity:.5}
.buddy[data-p="angry"] .b-ear.l{transform:rotate(-20deg)}.buddy[data-p="angry"] .b-ear.r{transform:rotate(24deg)}
.buddy[data-p="angry"] .b-body{animation:b-stomp 3.2s infinite}
.buddy[data-p="angry"] .b-steam circle{animation:b-float 1.4s ease-out infinite}
.buddy[data-p="angry"] .b-steam circle:nth-child(2){animation-delay:.45s}
.buddy[data-p="angry"] .b-steam circle:nth-child(3){animation-delay:.9s}
.buddy[data-p="funny"] :is(.b-grin,.b-raise){opacity:1}
.buddy[data-p="funny"] > svg{animation:b-giggle 2.2s ease-in-out infinite}
.buddy[data-p="sleepy"] :is(.b-lids,.b-zzz){opacity:1}
.buddy[data-p="sleepy"] .b-zzz text{animation:b-float 2.6s ease-out infinite}
.buddy[data-p="sleepy"] .b-zzz text+text{animation-delay:1.3s}
.buddy[data-p="sleepy"] > svg{animation-duration:5s}
.buddy[data-p="sleepy"] .b-head{animation:b-nod 4.5s ease-in-out infinite}
.buddy[data-p="sleepy"] .b-ear.l{transform:rotate(-26deg)}.buddy[data-p="sleepy"] .b-ear.r{transform:rotate(28deg)}
.buddy[data-p="excited"] :is(.b-star,.b-grin,.b-stars){opacity:1}
.buddy[data-p="excited"] .b-star path{animation:b-pulse .8s ease-in-out infinite;transform-origin:center}
.buddy[data-p="excited"] .b-stars path{animation:b-pop 1.6s ease-out infinite}
.buddy[data-p="excited"] .b-stars path:nth-child(2){animation-delay:.4s}.buddy[data-p="excited"] .b-stars path:nth-child(3){animation-delay:.8s}.buddy[data-p="excited"] .b-stars path:nth-child(4){animation-delay:1.2s}
.buddy[data-p="excited"] > svg{animation:b-bounce .6s ease-in-out infinite}
.buddy[data-p="excited"] .b-ear.l{transform:rotate(-2deg)}.buddy[data-p="excited"] .b-ear.r{transform:rotate(4deg)}
.buddy[data-p="surprised"] :is(.b-wide,.b-o,.b-excl){opacity:1}
.buddy[data-p="surprised"] .b-ear.l{transform:rotate(0)}.buddy[data-p="surprised"] .b-ear.r{transform:rotate(0)}
.buddy[data-p="surprised"] > svg{animation:b-jump .5s ease-out}
.buddy[data-p="shy"] :is(.b-blush,.b-wavy){opacity:1}
.buddy[data-p="shy"] .b-cheek{opacity:.7}
.buddy[data-p="shy"] .b-look{transform:translate(-2px,3px)}
.buddy[data-p="shy"] .b-head{transform:rotate(-7deg)}
.buddy[data-p="shy"] .b-ear.l{transform:rotate(-16deg)}.buddy[data-p="shy"] .b-ear.r{transform:rotate(22deg)}
.buddy[data-p="proud"] :is(.b-lids,.b-smirk,.b-sparkle){opacity:1}
.buddy[data-p="proud"] .b-sparkle{animation:b-pulse 1.2s ease-in-out infinite}
.buddy[data-p="proud"] .b-head{transform:rotate(-5deg) translateY(-2px)}
.buddy[data-p="curious"] :is(.b-quest,.b-raise){opacity:1}
.buddy[data-p="curious"] .b-head{transform:rotate(9deg)}
.buddy[data-p="curious"] .b-ear.r{transform:rotate(28deg)}
.buddy[data-p="curious"] .b-look{transform:translate(3px,-1px)}
.buddy[data-p="sad"] :is(.b-sadbrows,.b-frown,.b-tear){opacity:1}
.buddy[data-p="sad"] .b-tear{animation:b-float 2.6s ease-in infinite reverse}
.buddy[data-p="sad"] .b-ear.l{transform:rotate(-28deg)}.buddy[data-p="sad"] .b-ear.r{transform:rotate(30deg)}
.buddy[data-p="sad"] > svg{animation-duration:5s}
.buddy[data-p="sad"] .b-head{transform:translateY(2px)}
.buddy[data-p="confused"] :is(.b-swirl,.b-wavy,.b-quest){opacity:1}
.buddy[data-p="confused"] .b-head{animation:b-wobble 2s ease-in-out infinite}
.buddy[data-p="love"] :is(.b-heye,.b-smile,.b-hearts){opacity:1}
.buddy[data-p="love"] .b-cheek{opacity:.65}
.buddy[data-p="love"] .b-heye path{animation:b-pulse .9s ease-in-out infinite;transform-origin:center}
.buddy[data-p="love"] .b-hearts path{animation:b-float 2.2s ease-out infinite}
.buddy[data-p="love"] .b-hearts path:nth-child(2){animation-delay:.7s}.buddy[data-p="love"] .b-hearts path:nth-child(3){animation-delay:1.4s}
.buddy[data-p="love"] > svg{animation:b-sway 2.4s ease-in-out infinite}
.buddy[data-p="cool"] :is(.b-glasses,.b-smirk){opacity:1}
.buddy[data-p="cool"] .b-head{transform:rotate(-4deg)}
.buddy[data-p="cool"] .b-ear.r{transform:rotate(26deg)}
.buddy[data-p="scared"] :is(.b-wide,.b-wavy,.b-sweat){opacity:1}
.buddy[data-p="scared"] .b-wide .b-ink{transform:scale(.55);transform-box:fill-box;transform-origin:center}
.buddy[data-p="scared"] > svg{animation:b-shiver .12s linear infinite}
.buddy[data-p="scared"] .b-ear.l{transform:rotate(-30deg)}.buddy[data-p="scared"] .b-ear.r{transform:rotate(30deg)}
.buddy[data-p="sly"] :is(.b-half,.b-smirk,.b-raise){opacity:1}
.buddy[data-p="sly"] .b-look{transform:translate(3px,0)}
.buddy[data-p="sly"] .b-head{transform:rotate(4deg)}
.buddy[data-p="bored"] :is(.b-half,.b-flat){opacity:1}
.buddy[data-p="bored"] .b-ear.l{transform:rotate(-24deg)}.buddy[data-p="bored"] .b-ear.r{transform:rotate(26deg)}
.buddy[data-p="bored"] > svg{animation-duration:6s}
.buddy[data-p="determined"] :is(.b-detbrows,.b-flat,.b-flame){opacity:1}
.buddy[data-p="determined"] .b-flame{animation:b-pulse .7s ease-in-out infinite}
.buddy[data-p="determined"] .b-ear.l{transform:rotate(-2deg)}.buddy[data-p="determined"] .b-ear.r{transform:rotate(2deg)}

/* реакции на реплику: радость (без ошибок) и смущение (была ошибка) — поверх эмоции */
.buddy[data-mood] :is(.b-eyes,.b-wide,.b-star,.b-heye,.b-swirl,.b-half,.b-glasses,.b-lids,.b-spark){opacity:0}
.buddy[data-mood="happy"] > svg{animation:b-hop .75s ease-out}
.buddy[data-mood="happy"] :is(.b-happy,.b-stars){opacity:1}
.buddy[data-mood="happy"] .b-stars path{animation:b-pop .9s ease-out both}
.buddy[data-mood="happy"] .b-stars path:nth-child(2){animation-delay:.12s}
.buddy[data-mood="happy"] .b-stars path:nth-child(3){animation-delay:.24s}
.buddy[data-mood="happy"] .b-stars path:nth-child(4){animation-delay:.36s}
.buddy[data-mood="oops"] :is(.b-oops,.b-sweat){opacity:1}
.buddy[data-mood="oops"] .b-ear.l{transform:rotate(-28deg)}.buddy[data-mood="oops"] .b-ear.r{transform:rotate(28deg)}
.buddy[data-mood="oops"] > svg{animation:b-shake .5s ease-in-out}

/* гладят: зажмурился, покраснел, уши прижал, прильнул к руке */
.buddy.petting :is(.b-eyes,.b-wide,.b-star,.b-heye,.b-swirl,.b-half,.b-glasses,.b-lids,.b-oops,.b-tear){opacity:0!important}
.buddy.petting :is(.b-happy,.b-blush,.b-smile){opacity:1!important}
.buddy.petting .b-mouth > :not(.b-smile){opacity:0!important}
.buddy.petting .b-cheek{opacity:.75!important;fill:var(--accent)!important}
.buddy.petting .b-ear.l{transform:rotate(-30deg)!important}.buddy.petting .b-ear.r{transform:rotate(32deg)!important}
.buddy.petting .b-head{transform:rotate(var(--pet-tilt, 0deg)) translateY(2px)!important;animation:none!important}

/* сам по себе: ухо дёргается, оглядывается, нюхает, потягивается, наклоняет голову, подпрыгивает */
.buddy.f-ear .b-ear.r{animation:b-twitch .6s ease-in-out}
.buddy.f-look .b-look{animation:b-lookaround 1.6s ease-in-out}
.buddy.f-sniff .b-nose{animation:b-sniff .7s ease-in-out}
.buddy.f-stretch > svg{animation:b-stretch 1.1s ease-in-out}
.buddy.f-tilt .b-head{animation:b-tilt 1.4s ease-in-out}
.buddy.f-hop > svg{animation:b-hop .75s ease-out}
/* нажатие */
.buddy.t-hop > svg{animation:b-hop .75s ease-out}
.buddy.t-boing > svg{animation:b-boing .8s ease-out}
.buddy.t-wiggle .b-ear.l{animation:b-tap .25s ease-in-out 3}
.buddy.t-wiggle .b-ear.r{animation:b-twitch .5s ease-in-out 2}
.buddy.t-heart :is(.b-hearts){opacity:1}
.buddy.t-heart .b-hearts path{animation:b-float 1.2s ease-out}
.buddy.t-heart .b-happy{opacity:1}.buddy.t-heart :is(.b-eyes,.b-wide,.b-star,.b-heye,.b-swirl,.b-half,.b-glasses,.b-lids){opacity:0}
/* ---------- скины: персонаж (уши и узор), окрас (мех), шапка ---------- */
.b-ear > g,.m-dog,.m-hamster,.m-panda,.m-fox,.m-bear,.m-cat,.h-bow,.h-flower,.h-cap,.h-headphones,.h-wizard,.h-crown{display:none}
.buddy:not([data-char]) .e-bunny,.buddy[data-char="bunny"] .e-bunny,.buddy[data-char="cat"] .e-cat,.buddy[data-char="bear"] .e-round,.buddy[data-char="panda"] .e-round,.buddy[data-char="fox"] .e-fox,.buddy[data-char="hamster"] .e-round{display:inline}
.buddy[data-char="panda"] .m-panda,.buddy[data-char="fox"] .m-fox,.buddy[data-char="bear"] .m-bear,.buddy[data-char="cat"] .m-cat,.buddy[data-char="dog"] .m-dog,.buddy[data-char="hamster"] .m-hamster{display:inline}
.buddy[data-char="panda"] .e-round .b-line{fill:#3B342D}.buddy[data-char="panda"] .e-round .b-inner{opacity:0}
.buddy[data-char="panda"] .b-eyes .b-ink{fill:#000}
.buddy[data-char="cat"]{--b-fur:#E9E3DA;--b-belly:#F6F1EA}
.buddy[data-char="bear"]{--b-fur:#B98559;--b-belly:#E3C29C}
.buddy[data-char="fox"]{--b-fur:#F0A35E;--b-belly:#FFF1E2}
.buddy[data-char="dog"]{--b-fur:#F3E2C6;--b-belly:#FFF6E6}
.buddy[data-char="hamster"]{--b-fur:#E9AE6E;--b-belly:#FFF3E2}
.buddy[data-color="choco"]{--b-fur:#B88A62;--b-belly:#DDBE9C}
.buddy[data-color="gray"]{--b-fur:#C9C4BC;--b-belly:#E4E0DA}
.buddy[data-color="pink"]{--b-fur:#F7CCD5;--b-belly:#FCE6EA}
.buddy[data-color="mint"]{--b-fur:#CBEBDD;--b-belly:#E7F6EF}
.buddy[data-color="sky"]{--b-fur:#CFE2F5;--b-belly:#E8F1FB}
.buddy[data-color="gold"]{--b-fur:#F2D07A;--b-belly:#F9E7B5}
.buddy[data-color="cream"]{--b-fur:#F6EBD3;--b-belly:#FBF5E8}
.buddy[data-color="peach"]{--b-fur:#F9C9A8;--b-belly:#FDE6D6}
.buddy[data-color="lavender"]{--b-fur:#D9CCF2;--b-belly:#EEE8FA}
.buddy[data-color="graphite"]{--b-fur:#9A948E;--b-belly:#C9C4BE}
.buddy[data-hat="bow"] .h-bow,.buddy[data-hat="flower"] .h-flower,.buddy[data-hat="cap"] .h-cap,.buddy[data-hat="headphones"] .h-headphones,.buddy[data-hat="wizard"] .h-wizard,.buddy[data-hat="crown"] .h-crown{display:inline}
.w-bowtie,.w-bell,.w-tie,.w-medal,.w-sweater,.w-overalls,.w-cape,.g-round,.g-sun,.g-heart,.g-star,.g-monocle,.h-beanie,.h-party,.h-beret,.h-santa,.h-chef,.h-halo{display:none}
.buddy[data-wear="bowtie"] .w-bowtie,.buddy[data-wear="bell"] .w-bell,.buddy[data-wear="tie"] .w-tie,.buddy[data-wear="medal"] .w-medal,.buddy[data-wear="sweater"] .w-sweater,.buddy[data-wear="overalls"] .w-overalls,.buddy[data-wear="cape"] .w-cape,.buddy[data-glasses="round"] .g-round,.buddy[data-glasses="sun"] .g-sun,.buddy[data-glasses="heart"] .g-heart,.buddy[data-glasses="star"] .g-star,.buddy[data-glasses="monocle"] .g-monocle,.buddy[data-hat="beanie"] .h-beanie,.buddy[data-hat="party"] .h-party,.buddy[data-hat="beret"] .h-beret,.buddy[data-hat="santa"] .h-santa,.buddy[data-hat="chef"] .h-chef,.buddy[data-hat="halo"] .h-halo{display:inline}
.buddy[data-wear]:not([data-wear="scarf"]) .b-scarf-wrap{display:none}
/* одежда обрезается по силуэту кролика — ничего не торчит */
.b-body [class^="w-"]:not(.w-tutu){clip-path:url(#wearClip)}
.w-dress,.w-tutu,.w-hoodie,.w-jersey,.w-suit,.w-raincoat,.h-twinbows,.h-tiara,.h-gradcap,.h-cowboy,.h-pirate,.h-carrotcap,.h-daisies,.w-fishcharm,.w-pinkbell,.h-rangerhat,.w-apron,.h-detective,.h-leaves,.h-hachimaki,.h-sakura{display:none}
.buddy[data-wear="dress"] .w-dress,.buddy[data-wear="tutu"] .w-tutu,.buddy[data-wear="hoodie"] .w-hoodie,.buddy[data-wear="jersey"] .w-jersey,.buddy[data-wear="suit"] .w-suit,.buddy[data-wear="raincoat"] .w-raincoat,.buddy[data-hat="twinbows"] .h-twinbows,.buddy[data-hat="tiara"] .h-tiara,.buddy[data-hat="gradcap"] .h-gradcap,.buddy[data-hat="cowboy"] .h-cowboy,.buddy[data-hat="pirate"] .h-pirate,.buddy[data-char="bunny"][data-hat="carrotcap"] .h-carrotcap,.buddy[data-char="bunny"][data-hat="daisies"] .h-daisies,.buddy[data-char="cat"][data-wear="fishcharm"] .w-fishcharm,.buddy[data-char="cat"][data-wear="pinkbell"] .w-pinkbell,.buddy[data-char="bear"][data-hat="rangerhat"] .h-rangerhat,.buddy[data-char="bear"][data-wear="apron"] .w-apron,.buddy[data-char="fox"][data-hat="detective"] .h-detective,.buddy[data-char="fox"][data-hat="leaves"] .h-leaves,.buddy[data-char="panda"][data-hat="hachimaki"] .h-hachimaki,.buddy[data-char="panda"][data-hat="sakura"] .h-sakura{display:inline}
/* превью в магазине: неподвижные маленькие копии */
.buddy.mini{position:relative;z-index:auto;left:auto;top:auto;--bsize:66px;cursor:default;pointer-events:none;margin:0 auto}
.buddy.mini::after{display:none}
.buddy.mini > svg,.buddy.mini *{animation:none!important;filter:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.buddy:not([data-char="bunny"]):not([data-char="hamster"]) .b-tail{display:none}


/* ================== Спокойный «взрослый» стиль ==================
   Тёплый светло-серый фон, белые карточки с тонкой границей и мягкой тенью, тёмные кнопки,
   морковный оранжевый только как акцент (прогресс, кольца, выделения). Шрифт — Manrope везде.
   Кролик остаётся единственным «мультяшным» элементом. Движение короткое и без пружин. */
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --fg:#16171B; --fg-2:#3A3D46; --muted:#6B6F7A; --muted-bg:#EFEDE8; --border:#E5E2DB; --border-2:#D6D2C9;
  --primary:#16171B; --primary-d:#16171B; --accent:#E8692F; --accent-bg:#FCEDE4; --ptext:#B4501F; --ring:#16171B;
  --green:#15803D; --green-bg:#E8F5EC; --green-d:#15803D;
  --clay:0 1px 2px rgba(22,23,27,.04),0 6px 20px rgba(22,23,27,.05); --clay-sm:0 1px 2px rgba(22,23,27,.04),0 3px 10px rgba(22,23,27,.04);
  --head:"Manrope",system-ui,sans-serif;
}
html,body{background:var(--bg)}
body,button,input,textarea{font-family:"Manrope",system-ui,sans-serif}
h2{font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:-.025em}
.top .brand{font-family:var(--head);font-weight:800;letter-spacing:-.02em}
.brand .logo{background:var(--fg);color:#fff;box-shadow:none;border-radius:10px}
.brand-s{color:var(--accent)}
/* тонкие границы вместо толстых, мягкие тени вместо «пластилиновых» */
.card,.tile,.bubble,.choice,.result,.textarea,textarea.essay,.inp,.typebox input,.pets button{border:1px solid var(--border)!important}
.hrow,details.rev,.voice,.passage,.prompt,.fix,.turn-t,.scenes button,.modes button,.chip,.iconbtn,.side,.face-card,.face-timer,.face-btn svg,.facechip{border:1px solid var(--border)!important}
.card,.tile,.bubble,.result{box-shadow:var(--clay)}
.hrow,details.rev,.voice,.turn-t,.iconbtn,.side,.chip,.choice,.facechip{box-shadow:var(--clay-sm)}
.tile{transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),border-color var(--t-fast)}
.tile:active,.choice:active{transform:scale(.985);box-shadow:var(--clay-sm)}
@media (hover:hover){.tile:hover{border-color:var(--border-2)!important;box-shadow:0 2px 4px rgba(22,23,27,.05),0 10px 28px rgba(22,23,27,.07)}}
.iconbtn:active,.side:active{transform:scale(.96)}
/* кнопки: тёмные, плоские */
.btn{background:var(--fg);color:#fff;border:0;box-shadow:none;border-radius:14px}
.btn:active{transform:scale(.98);box-shadow:none}
.btn.line{background:var(--card);color:var(--fg);border:1px solid var(--border-2);box-shadow:none}.btn.line:active{box-shadow:none}
.btn.green{background:var(--green);box-shadow:none}.btn.green:active{box-shadow:none}
@media (hover:hover){.btn:hover{filter:brightness(1.15)}.btn.line:hover{background:var(--muted-bg)}}
nav{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
nav button{color:var(--muted)}
nav button.on{background:transparent;color:var(--fg)}
nav button.on svg{color:var(--accent)}
.chip.fire{background:var(--accent-bg);color:var(--ptext);border-color:transparent!important}
.goal{background:var(--card)}
.goal .big,.ring b,.result .big{font-family:var(--head);font-weight:800;letter-spacing:-.03em}
.bar{height:6px;background:var(--muted-bg);border:0}
.bar i{background:var(--accent)}.bar.green i{background:var(--green)}
.ring{background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--muted-bg) 0);box-shadow:none}
.crit div .bar i{background:var(--accent)}
.tile .ic{border:0;box-shadow:none}
.ic.indigo{background:#FCEDE4;color:#B4501F}.ic.violet{background:#EEEAF8;color:#5B4B9A}.ic.green{background:#E8F5EC;color:#15803D}
.ic.orange{background:#FDF3DC;color:#9A6A08}.ic.sky{background:#E6F0FA;color:#22609E}.ic.pink{background:#FBEAF0;color:#A23B65}
.tile .go{color:var(--muted)}
.reading{background:var(--fg);color:#fff;border:0!important;box-shadow:var(--clay)}
.reading .ic{background:rgba(255,255,255,.1);color:#fff}.reading .t small{color:#B9BCC6}.reading .go{color:#fff}
.skill{color:var(--fg-2);background:var(--muted-bg);border:0}.skill.easy{background:var(--green-bg);color:var(--green)}.skill.hard{background:var(--accent-bg);color:var(--ptext)}
.choice .l{border:1px solid var(--border-2);background:var(--card);color:var(--fg-2)}
.choice.ok{background:var(--green-bg);border-color:#9BD3AE!important}.choice.ok .l{background:var(--green);border-color:var(--green);color:#fff}
.choice.bad{background:#FBECEA;border-color:#EBB0A8!important}.choice.bad .l{background:#C2412D;border-color:#C2412D;color:#fff}
.explain{border:1px solid!important}.explain.ok{background:var(--green-bg);border-color:#9BD3AE!important}.explain.bad{background:#FBECEA;border-color:#EBB0A8!important}
.passage,.prompt,.fix{background:#FAF9F7}
.chats,.seg{background:var(--muted-bg);border:0}
.chats button.on,.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(22,23,27,.1)}
.modes button.on{background:var(--fg);color:#fff;border-color:var(--fg)!important}
.turn-t .who{color:var(--ptext)}
.turn-u{background:var(--fg);color:#fff;box-shadow:none}
.mic{background:var(--fg);color:#fff;box-shadow:0 8px 24px rgba(22,23,27,.18)}
.mic:active{transform:scale(.96);box-shadow:0 4px 12px rgba(22,23,27,.18)}
.mic.listen{background:var(--green);box-shadow:0 8px 24px rgba(21,128,61,.25),0 0 0 calc(4px + var(--lvl) * 14px) rgba(21,128,61,.15)}
.side.on{background:var(--fg);border-color:var(--fg)!important;box-shadow:none}
.typebox button{background:var(--fg);box-shadow:none}
.inp:focus,.typebox input:focus,textarea.essay:focus{border-color:var(--fg)!important}
.ib{background:var(--muted-bg);color:var(--fg-2)}
.pets button.on{border-color:var(--fg)!important;box-shadow:none}
.voice.on{border-color:var(--fg)!important}
.face-btn svg{box-shadow:var(--clay-sm)}
.face-btn.go svg{background:var(--green);border-color:var(--green)!important;box-shadow:none}
.face-btn.end svg{background:#C2412D;border-color:#C2412D!important;color:#fff;box-shadow:none}
.toastx{box-shadow:0 8px 24px rgba(22,23,27,.25)}
:focus-visible{outline-color:var(--accent)}

/* ---------- движение: коротко и без пружин ---------- */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
.ring{animation:ring-in 1s var(--ease) backwards}
@keyframes ring-in{from{--p:0}}
.bar i{animation:bar-in .8s var(--ease) backwards}
@keyframes bar-in{from{width:0}}
.pop{animation:pop-in .42s var(--ease) backwards;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes pop-in{from{opacity:0;transform:translateY(8px)}}
.view.on{animation:view-in .24s var(--ease)}
@keyframes view-in{from{opacity:0}}
.spark{position:fixed;z-index:70;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:spark .6s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.typing-cursor::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;background:var(--muted);vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.choice.ok,.choice.bad,.choice:disabled{box-shadow:none!important}
/* свёрнутый список голосов в настройках */
.vbox{margin-top:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--clay-sm)}
.vbox summary{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;cursor:pointer;list-style:none}
.vbox summary::-webkit-details-marker{display:none}
.vbox summary .lbl{margin:0}
.vbox .vcur{flex:1;text-align:right;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbox .chev{width:20px;height:20px;flex:none;color:var(--muted);transition:transform var(--t-med) var(--ease)}
.vbox[open] .chev{transform:rotate(180deg)}
.vbox .voices{padding:0 10px 10px}
.vbox[open] .voices{animation:pop-in .3s var(--ease)}
/* вступление при первом входе */
.intro{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;padding:calc(14px + var(--safe-t)) 20px calc(16px + var(--safe-b));animation:view-in .3s var(--ease)}
.intro.out{opacity:0;transform:translateY(12px);transition:opacity .28s var(--ease),transform .28s var(--ease)}
.intro>*{width:100%;max-width:480px;margin-inline:auto}
.in-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.in-dots{display:flex;gap:6px}.in-dots i{width:8px;height:8px;border-radius:99px;background:var(--border-2);transition:width var(--t-med) var(--ease),background var(--t-med)}.in-dots i.on{width:24px;background:var(--accent)}
.in-skip{min-height:44px;padding:0 6px;color:var(--muted);font-weight:700}
.in-body{flex:1;padding:8px 0 20px}
.in-body h1{font-family:var(--head);font-weight:800;font-size:clamp(26px,7.4vw,34px);line-height:1.12;letter-spacing:-.03em;margin:6px 0 12px}
.in-lead{font-size:17px;line-height:1.55;color:var(--fg-2)}
.in-hero{display:grid;place-items:center;padding:18px 0 10px}.in-hero .buddy.mini{--bsize:min(56vw,230px)!important;width:auto;filter:none}
.in-hero.sm .buddy.mini{--bsize:120px!important}
.in-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.in-fact{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--clay-sm);display:flex;flex-direction:column}
.in-fact b{font-family:var(--head);font-weight:800;font-size:32px;letter-spacing:-.04em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.in-fact .t{font-weight:700;font-size:13px;margin-top:4px}
.in-fact p{font-size:13px;line-height:1.45;color:var(--fg-2);margin:8px 0 10px;flex:1}
.in-fact small{font-size:11px;color:var(--muted)}
.in-how{display:grid;gap:10px;margin-top:6px}.in-how .hrow{align-items:center}.in-how .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}.in-how .ic svg{width:22px;height:22px}
.in-how .t{display:flex;flex-direction:column;gap:2px}.in-how .t small{color:var(--muted);font-size:13px;line-height:1.4}
.in-note{color:var(--muted);font-size:13px;margin-top:12px}
.in-foot{display:flex;gap:10px;position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,var(--bg) 30%)}.in-foot .btn{flex:1;min-height:54px}.in-foot .btn.line{flex:0 0 auto;padding:0 20px}
/* экран подписки */
.pw-hero{display:grid;place-items:center;padding:4px 0 2px}.pw-hero .buddy.mini{--bsize:110px!important;width:auto;filter:none}
.pw-feat{list-style:none;margin:4px 0 18px;padding:0;display:grid;gap:9px}
.pw-feat li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;color:var(--fg-2)}
.pw-feat svg{width:20px;height:20px;flex:none;color:var(--green);margin-top:1px}
.pw-plans{display:grid;gap:10px}
.pw-plan{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:68px;padding:12px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;box-shadow:var(--clay-sm);transition:border-color var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast) var(--ease)}
.pw-plan:active{transform:scale(.985)}
.pw-plan.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg),var(--clay-sm)}
.pw-flag{position:absolute;top:-10px;left:14px;padding:2px 9px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em}
.pw-radio{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--border-2);transition:border var(--t-fast)}
.pw-plan.on .pw-radio{border:6px solid var(--fg)}
.pw-t{flex:1;display:flex;flex-direction:column;gap:2px}.pw-t b{font-size:16px}.pw-t small{color:var(--muted);font-size:13px}.pw-t s{opacity:.7}
.pw-d{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}.pw-d b{font-family:var(--head);font-weight:800;font-size:18px;letter-spacing:-.02em}.pw-d small{color:var(--muted);font-size:12px}
.pw-d i{font-style:normal;font-size:11px;font-weight:800;color:var(--green);background:var(--green-bg);padding:1px 6px;border-radius:99px;margin-bottom:3px}
.pw-fine{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:14px}
.pw-back{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2)}.pw-back svg{width:20px;height:20px}
.pw-sum{color:var(--fg-2);font-size:15px;margin:-4px 0 16px}.pw-sum b{color:var(--fg)}
.pw-way .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}.pw-way .ic svg{width:22px;height:22px}
.pw-way.busy{opacity:.6;pointer-events:none}.pw-way.busy .pw-d b{animation:blink .8s steps(1) infinite}
@media (hover:hover){.pw-way:hover{border-color:var(--fg)}}
.pw-err{min-height:20px;margin:12px 0 0;font-size:14px;color:var(--fg-2)}
/* «$8 включает YomiRead» — крупно на экране подписки */
.pw-incl{display:flex;flex-direction:column;gap:4px;margin:0 0 18px;padding:14px 16px;border-radius:16px;background:var(--accent-bg);border:1px solid #F4C9AE}
.pw-incl b{font-family:var(--head);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1.1;color:var(--fg)}
.pw-incl span{font-size:17px;font-weight:700;line-height:1.35;color:var(--ptext)}
/* статьи в «Моём плане» */
.arts{display:grid;gap:8px;margin-top:12px}
.art{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:#FAF9F7;border:1px solid var(--border);text-decoration:none;color:var(--fg);transition:border-color var(--t-fast)}
.art b{font-size:14px}.art small{font-size:12.5px;color:var(--muted)}
@media (hover:hover){.art:hover{border-color:var(--border-2)}}
/* ---------- «Учёба» ---------- */
nav{grid-template-columns:repeat(5,1fr)!important;gap:2px!important;padding-inline:6px!important}
nav button{font-size:11px!important}
.course .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.course .cn{font-weight:800;font-size:13px;color:var(--muted)}
.csteps{display:grid;gap:8px;margin-top:12px}
.cstep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:10px 12px;border-radius:14px;background:#FAF9F7;border:1px solid var(--border);transition:border-color var(--t-fast),transform var(--t-fast) var(--ease)}
.cstep:active{transform:scale(.985)}.cstep>svg{width:18px;height:18px;color:var(--muted);flex:none}
.cstep .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.cstep .t small{color:var(--muted);font-size:13px;line-height:1.35}
.cdot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accent-bg);color:var(--ptext)}.cdot svg{width:19px;height:19px}
.cstep.ok .cdot{background:var(--green);color:#fff}.cstep.ok .t b{text-decoration:line-through;text-decoration-color:var(--border-2)}
.cfin{margin:12px 0 0;font-weight:700;color:var(--green)}
.wordsc{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wordsc>div:not(.wbtns){display:flex;flex-direction:column}.wordsc .big{font-family:var(--head);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1}.wordsc span{color:var(--muted);font-size:13px}
.wbtns{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}.wbtns .btn{flex:1;min-width:140px}
.lessons{display:grid;gap:8px}
.lrow{width:100%;text-align:left}.lrow .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.lrow .t b{font-size:15px;line-height:1.35}.lrow .t small{font-size:12.5px;color:var(--muted)}.lrow .t small.weak{color:var(--ptext);font-weight:700}
.lrow>svg{width:18px;height:18px;color:var(--muted);flex:none}
.ldot{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid var(--border-2);display:grid;place-items:center}.ldot.ok{background:var(--green);border-color:var(--green);color:#fff}.ldot svg{width:13px;height:13px}
.backl{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:-6px 0 6px;font-weight:700;color:var(--fg-2)}.backl svg{width:20px;height:20px}
.lsteps{display:grid;gap:10px}.lstep{display:flex;gap:12px;align-items:flex-start}.lstep .num{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--fg);color:#fff;font-weight:800}
.lstep p{margin:4px 0 0;color:var(--fg-2);line-height:1.5}
.lex .eyebrow{display:block;margin-top:12px}.lex .eyebrow:first-child{margin-top:0}.lex p{margin:6px 0 0;line-height:1.55}
.lex .task{font-weight:700}.lex .model{padding:12px 14px;border-radius:12px;background:var(--green-bg);color:var(--fg);white-space:pre-wrap}
.phr{display:grid;gap:10px}.phr>div{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--border)}.phr>div:last-child{border:0;padding:0}
.phr span{color:var(--muted);font-size:14px}.phr small{color:var(--fg-2);font-size:13px;font-style:italic}
.mist{margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.5;color:var(--fg-2)}
.lq{margin-bottom:10px}.lq .q{margin:0 0 10px;line-height:1.5}
.lres{text-align:center;margin-top:6px}.lres .big{font-family:var(--head);font-weight:800;font-size:34px;letter-spacing:-.03em}.lres p{color:var(--fg-2);margin:8px 0 14px}
.wcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;text-align:center;cursor:pointer;margin-top:14px}
.wcard .ww{font-family:var(--head);font-weight:800;font-size:clamp(28px,8vw,38px);letter-spacing:-.02em}
.wcard .ib{position:absolute;top:12px;right:12px}
.wcard .wh{color:var(--muted);font-size:14px;margin:0}.wcard .wt{font-size:22px;font-weight:700;color:var(--ptext);margin:0}.wcard .we{color:var(--fg-2);font-style:italic;margin:0;max-width:420px;line-height:1.5}
.wcard.open{animation:pop-in .3s var(--ease)}
.wgrade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.wgrade .btn{min-height:52px}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.topics .chip{min-height:44px;padding:8px 14px;font-weight:700;background:var(--card)}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px}.lhead.top{align-items:flex-start}.lhead.top .lead{margin-bottom:6px}
#learnSlot{width:72px;height:66px;flex:none}#learnSlot .buddy.staged{--bsize:72px!important}
.lhead.top>div:first-child{flex:1;min-width:0}
/* политика конфиденциальности */
.privacy .pv{margin-top:12px}.privacy .pv h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:17px}.privacy .pv h3 svg{width:20px;height:20px;color:var(--green)}
.privacy .pv ul{margin:0;padding-left:18px;display:grid;gap:8px;line-height:1.5;color:var(--fg-2);font-size:15px}
.privacy .arts{margin-top:14px}
.in-note a,.pw-fine a{color:var(--fg);text-decoration:underline;text-underline-offset:2px}
.relink{font:inherit;color:var(--ptext);text-decoration:underline;text-underline-offset:2px;letter-spacing:inherit;text-transform:inherit}
.lrow .ldot{flex:0 0 22px;width:22px;height:22px}.lrow .ldot svg{flex:none}
/* личный план */
.qz .lbl{margin-top:16px}.qz .lbl:first-child{margin-top:0}
.qz-chips{display:flex;flex-wrap:wrap;gap:8px}
.qz-chips button{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--border-2);background:var(--card);font-weight:700;font-size:14px;color:var(--fg-2);transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast)}
.qz-chips button.on{background:var(--fg);border-color:var(--fg);color:#fff}
.qz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qz-grid small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.qz-hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.qz-err{min-height:20px;color:var(--red,#C2412D);font-weight:700;margin:10px 0 0}
.qz-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.qz-foot .btn{flex:1;min-width:150px;min-height:52px}
.spv p{margin:10px 0 14px;line-height:1.55;color:var(--fg-2)}.spv .btn{width:100%;min-height:52px}
.vchip{display:inline-flex;align-items:center;min-height:28px;padding:2px 12px;border-radius:99px;font-weight:800;font-size:13px}
.vchip.green{background:var(--green-bg);color:var(--green)}.vchip.orange{background:#FDF3DC;color:#9A6A08}.vchip.red{background:#FBECEA;color:#C2412D}
.vh{margin-left:10px;font-size:13px;color:var(--muted);font-weight:700}
.spweek{display:grid;gap:8px}
.spday{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;box-shadow:var(--clay-sm)}
.spday.now{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}.spday.rest{background:transparent;box-shadow:none}
.spday .dh{display:flex;align-items:baseline;gap:10px}.spday .dh b{font-family:var(--head);font-weight:800;font-size:16px;width:28px}.spday .dh small{color:var(--muted);font-size:13px}
.spday ul{margin:6px 0 0 38px;padding:0;list-style:none;display:grid;gap:6px}.spday li{display:flex;flex-direction:column;font-size:14px}.spday li small{color:var(--muted);font-size:12.5px}
.sppri{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.45}
.spphases{display:grid;gap:8px}.spphases .card b{display:block;margin-top:2px}.spphases .card p{margin:4px 0 0;color:var(--fg-2);line-height:1.5}
.spmile{margin:0;padding:0;list-style:none;display:grid;gap:10px}.spmile li{display:flex;flex-direction:column}.spmile span{color:var(--fg-2);font-size:14px}
.mkplan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px;border-radius:14px;background:var(--accent-bg);border:1px dashed #F4C9AE}
.mkplan>svg{width:20px;height:20px;flex:none;color:var(--ptext)}.mkplan span{flex:1;display:flex;flex-direction:column;gap:2px}.mkplan small{color:var(--fg-2);font-size:13px}
.cstep .cnote{color:var(--ptext)!important;font-size:12.5px!important}
.lslot{width:72px;height:66px;flex:none}.lslot .buddy.staged{--bsize:72px!important}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9.5C7 6 7.2 2.5 8.6 2.4S10.8 5.8 10.6 9M15.5 9.5C17 6 16.8 2.5 15.4 2.4S13.2 5.8 13.4 9"/><path d="M4 20c3-6 6-8 8-8s5 2 8 8"/></svg></span>Yomi<span class="brand-s">Score</span></div>
    <span class="chip fire" id="streak" hidden></span>
    <button class="iconbtn" id="setBtn" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="main">
    <section class="view on" id="v-home"><div class="scroll" id="homeBox"></div></section>
    <section class="view" id="v-ielts"><div class="scroll" id="ieltsBox"></div></section>
    <section class="view" id="v-sat"><div class="scroll" id="satBox"></div></section>
    <section class="view" id="v-learn"><div class="scroll" id="learnBox"></div></section>
    <section class="view" id="v-talk">
      <div class="chats" id="chats" role="tablist"><button data-ch="learn" role="tab">С исправлениями</button><button data-ch="talk" role="tab">Просто поболтать</button></div>
      <div class="modes" id="modes" role="tablist"></div>
      <div class="scroll" id="chatWrap"><div class="chat" id="chat" aria-live="polite"></div></div>
      <div class="dock">
        <div class="status" id="status">Нажми и говори по-английски</div>
        <div class="dock-row">
          <button class="side" id="kbBtn" aria-label="Написать текстом"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M7 15h10"/></svg></button>
          <button class="mic" id="mic" aria-label="Говорить"><svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg class="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
          <button class="side" id="endBtn" aria-label="Закончить разговор"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="facechip" id="faceBtn" hidden>Показать Yomi</button>
        </div>
        <form class="typebox" id="typebox"><input id="typeIn" placeholder="Type in English…" autocomplete="off" aria-label="Сообщение"><button aria-label="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
      </div>
    </section>
  </main>
  <nav id="nav" aria-label="Разделы">
    <button data-v="home" class="on" aria-label="Главная"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
    <button data-v="ielts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9L12 4 2 9l10 5 10-5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5M22 9v6"/></svg>IELTS</button>
    <button data-v="sat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>SAT</button>
    <button data-v="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>Учёба</button>
    <button data-v="talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Разговор</button>
  </nav>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="bShade" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#2A241D" stop-opacity=".10"/></radialGradient><clipPath id="wearClip"><ellipse cx="80" cy="92" rx="49" ry="40"/><ellipse cx="80" cy="132" rx="27" ry="16"/></clipPath></defs></svg>
<div class="face" id="face" hidden data-s="idle">
  <p class="face-mode" id="faceMode"></p>
  <p class="face-timer" id="faceTimer" hidden></p>

// тон: частота скользит по точкам [время, частота], громкость — мягкая атака и затухание
function tone(c, t0, type, freqs, dur, vol = .12, lowpass = 0){
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  freqs.forEach(([t, f], i) => i ? o.frequency.exponentialRampToValueAtTime(f, t0 + t) : o.frequency.setValueAtTime(f, t0 + t));
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  let out = o;
  if(lowpass){ const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass; o.connect(f); out = f; }
  out.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + .02);
}
// шорох: короткий шум через полосовой фильтр
function noise(c, t0, dur, freq, vol = .06){
  const len = Math.ceil(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t0);
}
