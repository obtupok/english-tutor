let EX = null, exStream = null, exCtx = null, exAn = null;
function exUI(on, name){
  const f = $('#face');
  f.toggleAttribute('data-exam', on); $('#faceChat').hidden = on; $('#faceGo').hidden = true; $('#faceTimer').hidden = true; $('#faceCard').hidden = true; $('#faceFix').hidden = true;
  if(on){ showFace(true); $('#faceMode').textContent = name; $('#faceCap').textContent = ''; } else { showFace(false); f.removeAttribute('data-exam'); }
}
function exCard(html){ const c = $('#faceCard'); c.hidden = !html; c.innerHTML = html || ''; c.scrollTop = 0; }
function exTimer(sec, label, btn){
  return new Promise(res => {
    const end = Date.now() + sec * 1000, t = $('#faceTimer'), go = $('#faceGo');
    t.hidden = false; go.hidden = !btn; if(btn) $('#faceGoT').textContent = btn;
    const done = () => { clearInterval(iv); go.hidden = true; t.hidden = true; EX.skip = null; res(); };
    EX.skip = done;
    const tick = () => { const left = Math.ceil((end - Date.now()) / 1000); t.textContent = `${label} · ${fmt(left)}`; t.classList.toggle('low', left <= 10); if(left <= 0 || EX.stop) done(); };
    const iv = setInterval(tick, 250); tick();
  });
}
// ответ пишется до конца времени или до «Готово»: паузы в речи ответ не обрывают (раньше 3,5 с тишины переключали вопрос)
async function exRecord(maxSec){
  const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
  const r = new MediaRecorder(exStream, mime ? {mimeType: mime} : undefined), parts = [];
  r.ondataavailable = e => { if(e.data.size) parts.push(e.data); };
  const stopped = new Promise(res => r.onstop = res);
  r.start(250); faceState('listen'); $('#faceCap').textContent = EX.q || ''; $('#faceStatus').textContent = 'Говори спокойно, паузы не страшны — ответ закончится, когда выйдет время или ты нажмёшь «Готово»';
  const buf = new Float32Array(exAn.fftSize), t0 = Date.now();
  let floor = .01;
  const vadIv = setInterval(() => {
    exAn.getFloatTimeDomainData(buf); let sum = 0; for(const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length), now = Date.now();
    if(now - t0 < 500) floor = Math.max(floor, rms * .9);
    $('#face').style.setProperty('--lvl', Math.min(1, rms * 8).toFixed(2));
  }, 50);
  await exTimer(maxSec, 'Ответ', 'Готово');
  clearInterval(vadIv); $('#face').style.setProperty('--lvl', 0);
  if(r.state === 'recording') r.stop();
  await stopped;
  return new Blob(parts, {type: r.mimeType || 'audio/webm'});
}
// вопрос вслух, но без долгого молчания: если голос не успел за несколько секунд — вопрос уже на экране, идём дальше
async function exSay(text){
  $('#buddy').dataset.p = 'kind'; faceState('speak');
  const ok = await Promise.race([sayText(text, 'en'), sleep(Math.min(14000, 6000 + text.length * 40)).then(() => 'late')]);
  if(ok === 'late') stopAudio();
}
function prefetchTts(text){
  const key = ['en', S.speaker, LOOK.char, 'kind', text].join('|');
  if(ttsCache.has(key)) return;
  api('tts', {text, lang: 'en', speaker: S.speaker, char: LOOK.char, emotion: 'kind'}).then(j => { if(j.audio) ttsCache.set(key, {b: j.audio, mime: j.mime}); }).catch(() => {});
}
async function runExam(kind, part = 0){
  if(EX) return;
  try{ exStream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}}); }
  catch{ notify('Разреши доступ к микрофону — Speaking идёт голосом'); return; }
  exCtx = new (window.AudioContext || window.webkitAudioContext)(); exAn = exCtx.createAnalyser(); exAn.fftSize = 1024; exCtx.createMediaStreamSource(exStream).connect(exAn);
  EX = {kind, stop: false}; setModeLook('ielts');
  const name = part ? `IELTS Speaking · Part ${part}` : 'IELTS Speaking';
  exUI(true, name);
  faceState('think'); $('#faceCap').textContent = 'Готовлю вопросы…'; $('#faceStatus').textContent = '';
  const j = await api('exam_start', {kind: 'ielts', part}).catch(() => ({error: 'failed'}));
  if(j.error || !j.items){ exClose(); notify('Не получилось начать — попробуй ещё раз'); return; }
  const items = j.items;
  prefetchTts(items[0].q);
  for(let i = 0; i < items.length && !EX.stop; i++){
    const it = items[i];
    $('#faceMode').textContent = `${name} · ${it.part} · ${i + 1}/${items.length}`;
    delete $('#face').dataset.mood; exCard('');
    $('#faceCap').textContent = it.q;
    exCard(it.bullets?.length ? `<b>You should say:</b><ul>${it.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : '');
    await exSay(it.q);
    if(EX.stop) break;
    if(items[i + 1]) prefetchTts(items[i + 1].q);   // следующий вопрос озвучится, пока ты отвечаешь
    if(it.prep){ faceState('think'); $('#faceStatus').textContent = 'Подумай, что скажешь.'; await exTimer(it.prep, 'Подготовка', 'Начать сразу'); }
    if(EX.stop) break;
    EX.q = it.q;
    const blob = await exRecord(it.speak);
    if(EX.stop) break;
    faceState('think'); $('#faceStatus').textContent = 'Записываю ответ…';
    const audio = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(blob); });
    const a = blob.size > 2000 ? await api('exam_answer', {i, audio, mime: blob.type}).catch(() => ({})) : {words: 0};
    if((a.words ?? 0) < 6){
      $('#face').dataset.mood = 'angry'; $('#buddy').dataset.p = 'angry'; sfx('angry');
      $('#faceCap').textContent = a.words ? 'Слишком коротко! На экзамене так нельзя — развивай мысль: причины, примеры, подробности.' : 'Я ничего не услышал… Говори громче и ближе к телефону.';
      await sleep(2600);
    } else if(a.words > 40){ $('#buddy').dataset.p = 'proud'; moodWear('proud'); }
  }
  if(EX.stop){ exClose(); return; }
  exCard(''); faceState('think'); $('#faceCap').textContent = 'Считаю band и готовлю разбор…'; $('#faceStatus').textContent = 'Это займёт несколько секунд';
  const r = await api('exam_finish').catch(() => ({error: 'failed'}));
  exClose();
  if(!r.result){ notify('Не получилось посчитать оценку — попробуй ещё раз'); return; }
  S.stats = {...S.stats, exams: r.exams, examLast: r.result};
  tab('ielts'); showSpeakResult(r.result); sfx('happy');
}
function exStop(){ if(!EX) return; EX.stop = true; EX.skip?.(); stopAudio(); }
function exClose(){
  exStream?.getTracks().forEach(t => t.stop()); exStream = null;
  exCtx?.close().catch(() => {}); exCtx = null; exAn = null;
  EX = null; exUI(false); setState('idle'); setModeLook(curTab);
}

/* ---------- «Мой план подготовки»: сколько часов нужно, успеваешь ли, как раскладывать неделю ----------
   Оценки по открытым данным: IELTS — около 3 месяцев на +0,5 band в среднем (ielts.org), 160–250 ч на +1 band;
   SAT — 20 ч Official SAT Practice ≈ +115 баллов в среднем (College Board, 2017), на уровне 1400+ — 60–80 ч на +50–100.
   Методы: практика с проверкой и распределённые повторения — самые действенные (Dunlosky 2013; мета-анализ 2021). */
let PLAN = store.get('yomi_plan', null);
function planDefaults(){
  const ie = lastIelts(), sat = lastSat();
  return {exam: 'ielts', ielts: {now: ie.speaking || 5.5, target: GOALS.ielts}, sat: {now: sat.total || 1100, target: GOALS.sat}, date: '', hours: 6};
}
function planCalc(p){
  const weeks = p.date ? Math.max(1, Math.round((Date.parse(p.date) - Date.now()) / (7 * 864e5))) : 12, have = weeks * p.hours;
  let need, needHi, gapTxt;
  if(p.exam === 'ielts'){
    const gap = Math.max(0, p.ielts.target - p.ielts.now);
    need = Math.round(gap * 160); needHi = Math.round(gap * 250); gapTxt = gap ? `+${gap} band` : 'цель уже достигнута';
  } else {
    const gap = Math.max(0, p.sat.target - p.sat.now), per100 = p.sat.now < 1200 ? 20 : p.sat.now < 1400 ? 35 : 70;   // чем выше балл, тем дороже каждые 100
    need = Math.round(gap / 100 * per100); needHi = Math.round(need * 1.5); gapTxt = gap ? `+${gap} баллов` : 'цель уже достигнута';
  }
  const status = !need ? 'done' : have >= needHi ? 'ok' : have >= need ? 'tight' : 'short';
  return {weeks, have, need, needHi, gapTxt, status, hoursNeeded: Math.ceil(need / weeks)};
}

/* ---------- движение: волна появления, «набегающие» числа, печать реплики, конфетти на верный ответ ---------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const POP_SEL = '.card,.tile,.hrow,details.rev,.choice,.bubble,.sec-h,.seg,.qtop,.hero-slot';
function popIn(root){
  if(RM) return;
  let i = 0;
  root.querySelectorAll(POP_SEL).forEach(el => { el.classList.remove('pop'); void el.offsetWidth; el.style.setProperty('--i', Math.min(i++, 12)); el.classList.add('pop'); });
  countUp(root);
}
function countUp(root){
  if(RM) return;
  root.querySelectorAll('.ring b, .goal .big').forEach(el => {
    const tn = el.firstChild; if(!tn || tn.nodeType !== 3) return;
    const m = tn.textContent.match(/^(\d+(?:\.\d)?)/); if(!m) return;
    const to = parseFloat(m[1]), dec = m[1].includes('.') ? 1 : 0, rest = tn.textContent.slice(m[1].length), t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 800), e = 1 - Math.pow(1 - k, 3); tn.textContent = (to * e).toFixed(dec) + rest; if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
// реплика кролика на главной печатается, как будто он говорит
function typeBubble(){
  const b = document.querySelector('#homeBox .bubble'); if(!b || RM) return;
  const tn = [...b.childNodes].filter(n => n.nodeType === 3).pop(); if(!tn) return;
  const full = tn.textContent; tn.textContent = ''; b.classList.add('typing-cursor');
  let k = 0; const iv = setInterval(() => { k += 2; tn.textContent = full.slice(0, k); if(k >= full.length){ clearInterval(iv); b.classList.remove('typing-cursor'); } }, 16);
}
function burst(el){
  if(RM || !el) return;
  const r = el.getBoundingClientRect(), cols = ['#E8692F', '#15803D', '#16171B', '#F2B544', '#9BD3AE'];
  for(let k = 0; k < 10; k++){
    const s = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 24 + Math.random() * 40;
    s.className = 'spark';
    s.style.cssText = `left:${r.left + 24}px;top:${r.top + r.height / 2}px;background:${cols[k % 5]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 12}px`;
    document.body.append(s); setTimeout(() => s.remove(), 650);
  }
}
// после перерисовки раздела — волна; в задании SAT после ответа анимируем только разбор
for(const id of ['homeBox', 'ieltsBox', 'satBox', 'learnBox']){
  const box = document.getElementById(id);
  new MutationObserver(ms => {
    if(!ms.some(m => m.target === box && m.addedNodes.length > 1)) return;
    if(box.dataset.still){ delete box.dataset.still; return; }   // перерисовка после ответа — без повторной волны
    if(id === 'satBox' && box.querySelector('.explain')){ const ex = box.querySelector('.explain'); ex.style.setProperty('--i', 0); ex.classList.add('pop'); return; }
    popIn(box);
    if(id === 'homeBox') typeBubble();
  }).observe(box, {childList: true});
}

function course(){
  let c = store.get('yomi_course', null);
  if(!c || Object.keys(c.done || {}).some(x => isNaN(x))) c = {day: c?.day || 1, date: todayKey(), done: {}, lesson: nextLesson().id};   // старый формат — начинаем день заново
  c.dow ||= todayDow();
  const all = dayTasks(c).every((t, i) => c.done[i]);
  if(c.date !== todayKey() && all) c = {day: c.day + 1, date: todayKey(), dow: todayDow(), done: {}, lesson: nextLesson().id};
  if(lessonsDone()[c.lesson]) dayTasks(c).forEach((t, i) => { if(t.type === 'lesson') c.done[i] = true; });
  store.set('yomi_course', c); return c;
}
function courseMark(type, idx){
  const c = course(), ts = dayTasks(c), i = idx ?? ts.findIndex((t, j) => t.type === type && !c.done[j]);
  if(i >= 0){ c.done[i] = true; store.set('yomi_course', c); }
}
const CHECK_I = svgI('<path d="M5 12l5 5 9-10"/>');
const LSLOT = '<div class="lslot" id="learnSlot" aria-hidden="true"></div>';
const BACK = () => `<div class="lhead"><button class="backl" data-lback>${svgI('<path d="M15 6l-6 6 6 6"/>')} Учёба</button>${LSLOT}</div>`;

function showLearn(){
  WC = null; LS = null; parkBunny();
  const c = course(), k = SKILLS.find(x => x.id === c.lesson) || nextLesson(), ts = dayTasks(c), p = SP();
  if(ts.some((t, i) => t.type === 'lesson' && !c.done[i]) && AUTH) loadLesson(k);   // урок дня — заранее
  const n = ts.filter((t, i) => c.done[i]).length, done = lessonsDone(), weak = weakSkills();
  const ICON = {lesson: I.book, practice: I.target, mock: I.cap, words: I.card};
  const title = t => ({lesson: 'Урок', practice: 'Практика', mock: 'Пробный экзамен', words: 'Карточки слов'})[t.type] || 'Задание';
  const sub = t => t.type === 'lesson' ? esc(k.name) : t.type === 'words' ? (S.due ? `${S.due} ${plural(S.due, 'слово', 'слова', 'слов')} на повторение` : 'Добавить 10 новых слов') : PRACTICE_NAME[t.act] || '';
  const step = (t, i) => `<button class="cstep${c.done[i] ? ' ok' : ''}" data-cs="${i}"><span class="cdot">${c.done[i] ? CHECK_I : ICON[t.type] || I.target}</span><span class="t"><b>${title(t)}${t.min ? ` · ${t.min} мин` : ''}</b><small>${sub(t)}</small>${t.note ? `<small class="cnote">${esc(t.note)}</small>` : ''}</span>${I.chev}</button>`;
  const groups = [...new Set(SKILLS.map(x => x.g))];
  $('#learnBox').innerHTML = `<div class="lhead top"><div><h2>Учёба</h2><p class="lead">Уроки по каждому навыку, карточки слов и курс на каждый день.</p></div>${LSLOT}</div>
    <div class="card course"><div class="ch"><span class="eyebrow">Курс · день ${c.day}${p ? ' · по твоему плану' : ''}</span><span class="cn">${ts.length ? `${n} из ${ts.length}` : 'отдых'}</span></div>
      <span class="bar"><i style="width:${ts.length ? n / ts.length * 100 : 100}%"></i></span>
      ${ts.length ? `<div class="csteps">${ts.map(step).join('')}</div>` : '<p class="cfin">Сегодня по плану отдых — мозгу нужно время, чтобы всё улеглось. Хочешь — повтори карточки.</p>'}
      ${ts.length && n === ts.length ? '<p class="cfin">День закрыт. Завтра откроется следующий.</p>' : ''}
      ${p ? '' : `<button class="mkplan" data-mkplan>${I.target}<span><b>Составить личный план</b><small>Курс подстроится под твою цель, дату экзамена и время</small></span>${I.chev}</button>`}</div>
    <div class="sec-h"><h3>Карточки слов</h3></div>
    <div class="card wordsc"><div><b class="big">${S.due || 0}</b><span>на повторение</span></div><div><b class="big">${S.words || 0}</b><span>всего слов</span></div>
      <div class="wbtns"><button class="btn" data-wrev${S.due ? '' : ' disabled'}>Повторять</button><button class="btn line" data-wadd>+10 слов по теме</button></div></div>
    ${groups.map(g => `<div class="sec-h"><h3>${g}</h3></div><div class="lessons">${SKILLS.filter(x => x.g === g).map(x => {
      const dn = done[x.id];
      return `<button class="hrow lrow" data-ls="${x.id}"><span class="ldot${dn ? ' ok' : ''}">${dn ? CHECK_I : ''}</span><span class="t"><b>${esc(x.name)}</b>${weak.has(x.id) ? '<small class="weak">Слабая тема — начни с неё</small>' : dn ? `<small>Пройден · ${dn.score} из ${dn.total}</small>` : ''}</span>${I.chev}</button>`; }).join('')}</div>`).join('')}`;
  homeBunny();
}
$('#learnBox').onclick = e => {
  const t = e.target, cs = t.closest('[data-cs]'), ls = t.closest('[data-ls]');
  if(cs){ const c = course(), i = +cs.dataset.cs, task = dayTasks(c)[i], k = SKILLS.find(x => x.id === c.lesson) || nextLesson();
    if(!task) return;
    if(task.type === 'lesson') return openLesson(k.id);
    if(task.type === 'words') return S.due ? reviewWords() : addWords();
    courseMark(task.type, i); return startAct(task.act); }
  if(t.closest('[data-mkplan]')){ tab('home'); return showPlan(); }
  if(ls) return openLesson(ls.dataset.ls);
  if(t.closest('[data-wrev]')) return reviewWords();
  if(t.closest('[data-wadd]')) return addWords();
  if(t.closest('[data-lback]')) return showLearn();
};

/* ---- урок: генерация с проверкой идёт ~20 с, поэтому урок курса готовим заранее, в фоне ---- */
let LS = null;
const lessonLoads = new Map();
// урок из памяти берём, только если он полный (иначе — готовим заново)
const lessonOk = L => !!(L && L.intro?.length > 40 && L.steps?.length >= 2 && L.steps.every(x => x.text?.length > 20) && L.example?.answer?.length > 10 && L.check?.length);
function loadLesson(k, fresh = false){
  if(!fresh){ const c = store.get('yomi_lsn_' + k.id, null); if(lessonOk(c)) return Promise.resolve(c); }
  if(!lessonLoads.has(k.id)) lessonLoads.set(k.id, api('lesson', {exam: k.exam, name: k.name, focus: k.f || (k.id.startsWith('g-') ? GRAMMAR_FOCUS : '')}).catch(() => ({}))
    .then(j => { lessonLoads.delete(k.id); if(j.lesson) store.set('yomi_lsn_' + k.id, j.lesson); return j.lesson || null; }));
  return lessonLoads.get(k.id);
}
async function openLesson(id, fresh = false){
  const k = SKILLS.find(x => x.id === id); if(!k) return;
  const box = $('#learnBox'); parkBunny();
  let lesson = fresh ? null : store.get('yomi_lsn_' + id, null);
  if(!lessonOk(lesson)) lesson = null;
  if(!lesson){
    box.innerHTML = `${BACK()}<div class="empty">Yomi готовит урок «${esc(k.name)}» и проверяет каждый ответ — это до 30 секунд…</div>`; homeBunny();
    lesson = await loadLesson(k, fresh);
    if(!lesson){ box.innerHTML = `${BACK()}<div class="empty">Не получилось подготовить урок. Попробуй ещё раз.</div>`; homeBunny(); return; }
    if(LS?.id && LS.id !== id) return;
  }
  LS = {id, k, lesson, picks: []}; drawLesson();
  box.scrollTop = 0; $('#v-learn .scroll').scrollTop = 0;
}
function drawLesson(){
  const {k, lesson: L, picks} = LS, answered = picks.filter(p => p != null).length, score = L.check.filter((q, i) => picks[i] === q.answer).length;
  $('#learnBox').innerHTML = `${BACK()}
    <p class="eyebrow">${esc(k.g)} · <button class="relink" data-lfresh>Обновить урок</button></p><h2>${esc(L.title)}</h2><p class="lead">${esc(L.intro)}</p>
    <div class="sec-h"><h3>Как делать</h3></div>
    <div class="lsteps">${L.steps.map((s, i) => `<div class="card lstep"><span class="num">${i + 1}</span><div><b>${esc(s.title)}</b><p>${esc(s.text)}</p></div></div>`).join('')}</div>
    <div class="sec-h"><h3>Разбор примера</h3></div>
    <div class="card lex"><span class="eyebrow">Задание</span><p class="task">${esc(L.example.task)}</p><span class="eyebrow">Сильный ответ</span><p class="model">${esc(L.example.answer)}</p><span class="eyebrow">Почему это работает</span><p>${esc(L.example.why)}</p></div>
    ${L.phrases?.length ? `<div class="sec-h"><h3>${k.id.startsWith('m-') ? 'Формулы и приёмы' : 'Полезные фразы'}</h3></div><div class="card phr">${L.phrases.map(p => `<div><b>${esc(p.en)}</b><span>${esc(p.ru)}</span></div>`).join('')}</div>` : ''}
    ${L.mistakes?.length ? `<div class="sec-h"><h3>Частые ошибки</h3></div><div class="card"><ul class="mist">${L.mistakes.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>` : ''}
    ${k.src?.length ? `<div class="sec-h"><h3>Правило подробнее</h3></div><div class="arts">${k.src.map(u => `<a class="art" href="${u}" target="_blank" rel="noopener"><b>British Council · LearnEnglish</b><small>${esc(u.split('/').pop().replace(/-/g, ' '))} — объяснение и упражнения</small></a>`).join('')}</div>` : ''}
    <div class="sec-h"><h3>Проверь себя</h3></div>
    ${L.check.map((q, i) => { const p = picks[i], done = p != null;
      return `<div class="card lq"><p class="q"><b>${i + 1}.</b> ${esc(q.question)}</p><div class="choices">${q.choices.map((c, j) => `<button class="choice${done ? (j === q.answer ? ' ok' : j === p ? ' bad' : '') : ''}" data-lq="${i}:${j}" ${done ? 'disabled' : ''}><span class="l">${'ABCD'[j]}</span><span>${esc(c)}</span></button>`).join('')}</div>
        ${done ? `<div class="explain ${p === q.answer ? 'ok' : 'bad'}"><b>${p === q.answer ? I.check + ' Верно' : I.x + ` Правильно — ${'ABCD'[q.answer]}`}</b>${esc(q.explanation)}</div>` : ''}</div>`; }).join('')}
    ${answered === L.check.length ? `<div class="card lres"><b class="big">${score} из ${L.check.length}</b><p>${score === L.check.length ? 'Отлично, навык понят. Закрепи его практикой.' : 'Перечитай шаги выше и закрепи практикой — так навык встанет на место.'}</p>
      <div class="wbtns"><button class="btn" data-ldone>Готово · дальше практика</button><button class="btn line" data-lfresh>Новый урок по теме</button></div></div>` : ''}`;
  homeBunny();
}
$('#learnBox').addEventListener('click', async e => {
  if(!LS) return;
  const q = e.target.closest('[data-lq]');
  if(q){ const [i, j] = q.dataset.lq.split(':').map(Number); if(LS.picks[i] != null) return; LS.picks[i] = j;
    const ok = j === LS.lesson.check[i].answer; sfx(ok ? 'happy' : 'oops'); if(ok && typeof burst === 'function') burst(q);
    const y = $('#v-learn .scroll').scrollTop; $('#learnBox').dataset.still = 1; drawLesson(); $('#v-learn .scroll').scrollTop = y; return; }
  if(e.target.closest('[data-lfresh]')) return openLesson(LS.id, true);
  if(e.target.closest('[data-ldone]')){
    const L = LS.lesson, score = L.check.filter((x, i) => LS.picks[i] === x.answer).length, k = LS.k;
    const j = await api('lesson_done', {skill: k.id, score, total: L.check.length, words: L.words, name: L.title}).catch(() => ({}));
    if(j.lessons) S.stats = {...(S.stats || {}), lessons: j.lessons};
    if(course().lesson === k.id){ courseMark('lesson'); courseMark('practice'); }   // практика запускается сразу после урока
    notify(L.words?.length ? `Урок пройден, ${L.words.length} слов добавлены в карточки` : 'Урок пройден');
    LS = null; S.words = (S.words || 0) + (L.words?.length || 0); S.due = (S.due || 0) + (L.words?.length || 0);
    return startAct(practiceFor(k));
  }
});

/* ---- карточки слов: показал слово → вспомнил → «Забыл / Трудно / Знаю» (интервалы считает сервер) ---- */
let WC = null;
async function reviewWords(){
  const box = $('#learnBox'); parkBunny();
  box.innerHTML = `${BACK()}<div class="empty">Достаю карточки…</div>`; homeBunny();
  const j = await api('words').catch(() => ({}));
  const now = Date.now(), due = (j.words || []).filter(w => !w.due || Date.parse(w.due) <= now).sort(() => Math.random() - .5).slice(0, 20);
  if(!due.length){ S.due = 0; return addWords(); }
  WC = {list: due, i: 0, open: false, ok: 0}; drawCard();
}
function drawCard(){
  const w = WC.list[WC.i];
  $('#learnBox').innerHTML = `${BACK()}
    <div class="qtop"><span class="bar"><i style="width:${WC.i / WC.list.length * 100}%"></i></span><b>${WC.i + 1}/${WC.list.length}</b></div>
    <div class="card wcard${WC.open ? ' open' : ''}" data-wflip>
      <b class="ww">${esc(w.word)}</b><button class="ib" data-wsay aria-label="Послушать">${I.play}</button>
      ${WC.open ? `<p class="wt">${esc(w.translation)}</p>${w.example ? `<p class="we">${esc(w.example)}</p>` : ''}` : '<p class="wh">Вспомни перевод и нажми на карточку</p>'}
    </div>
    ${WC.open ? `<div class="wgrade"><button class="btn line" data-wg="0">Забыл</button><button class="btn line" data-wg="1">Трудно</button><button class="btn green" data-wg="2">Знаю</button></div>` : ''}`;
  homeBunny();
}
$('#learnBox').addEventListener('click', async e => {
  if(!WC) return;
  if(e.target.closest('[data-wsay]')){ unlock(); sayText(WC.list[WC.i].word, 'en'); return; }
  if(e.target.closest('[data-wflip]') && !WC.open){ WC.open = true; $('#learnBox').dataset.still = 1; return drawCard(); }
  const g = e.target.closest('[data-wg]'); if(!g) return;
  const w = WC.list[WC.i], grade = +g.dataset.wg; if(grade === 2) WC.ok++;
  api('review', {id: w.id, grade}).catch(() => {});
  if(++WC.i < WC.list.length){ WC.open = false; $('#learnBox').dataset.still = 1; return drawCard(); }
  const n = WC.list.length, ok = WC.ok; WC = null; S.due = Math.max(0, (S.due || 0) - n); courseMark('words');
  $('#learnBox').innerHTML = `${BACK()}
    <div class="card lres"><b class="big">${ok} из ${n}</b><p>Слова, которые ты знаешь, вернутся через несколько дней, а трудные — уже сегодня. Так они запоминаются надолго.</p>
    <div class="wbtns"><button class="btn" data-lback>К учёбе</button><button class="btn line" data-wadd>+10 слов по теме</button></div></div>`;
  homeBunny();
});
$('#learnBox').addEventListener('click', e => { if(!WC && !LS && e.target.closest('[data-wtopic]')) loadWordset(e.target.closest('[data-wtopic]').dataset.wtopic); });
function addWords(){
  WC = null; LS = null; parkBunny();
  const topics = [...LEARN_THEMES].sort(() => Math.random() - .5).slice(0, 8);
  $('#learnBox').innerHTML = `${BACK()}
    <h2>Новые слова</h2><p class="lead">Выбери тему — Yomi подберёт 10 слов чуть выше твоего уровня, которые поднимают балл за лексику.</p>
    <div class="topics">${topics.map(t => `<button class="chip" data-wtopic="${t}">${t}</button>`).join('')}<button class="chip" data-wtopic="">Любая тема</button></div>`;
  homeBunny();
}
async function loadWordset(topic){
  $('#learnBox').innerHTML = `${BACK()}<div class="empty">Подбираю слова…</div>`; homeBunny();
  homeBunny();
  const j = await api('wordset', {topic}).catch(() => ({}));
  if(!j.words?.length){ notify('Не получилось подобрать слова'); return addWords(); }
  S.words = (S.words || 0) + j.words.length; S.due = (S.due || 0) + j.words.length;
  $('#learnBox').innerHTML = `${BACK()}
    <p class="eyebrow">${esc(j.topic)}</p><h2>10 новых слов</h2>
    <div class="card phr">${j.words.map(w => `<div><b>${esc(w.word)}</b><span>${esc(w.translation)}</span><small>${esc(w.example)}</small></div>`).join('')}</div>
    <div class="wbtns" style="margin-top:14px"><button class="btn" data-wrev>Учить карточками</button></div>`;
  homeBunny();
}


/* ---------- личный план учёбы: несколько вопросов → план под человека (сервер: study_plan) ----------
   План учитывает ответы и результаты в приложении; часы и вердикт сервер считает сам (данные IELTS и College Board).
   Курс в «Учёбе» идёт по этому плану: задания дня — из недели плана, порядок уроков — из priority. */
const SPA = () => S.stats?.studyPlan || null;
const HARD = ['Speaking', 'Writing', 'Reading', 'Listening', 'Грамматика', 'Словарный запас', 'SAT Math', 'SAT Reading & Writing'];
const IELTS_STEPS = [4, 4.5, 5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9], SAT_STEPS = Array.from({length: 25}, (_, k) => 400 + k * 50);
const VERDICT = {ok: ['green', 'Успеваешь'], tight: ['orange', 'Впритык'], short: ['red', 'Не успеваешь'], done: ['green', 'Цель уже достигнута']};
let QZ = null, planCalcMode = false;
const showPlanCalc = showPlan;   // прежний расчёт часов и этапов остаётся доступным из плана
showPlan = function(){ if(planCalcMode) return showPlanCalc(); return SPA() ? showStudyPlan() : showPlanQuiz(); };
document.addEventListener('click', e => { if(e.target.closest('[data-home]')) planCalcMode = false; }, true);

function quizDefaults(){
  const a = SPA()?.answers, ie = lastIelts(), sat = lastSat();
  return a ? JSON.parse(JSON.stringify(a)) : {exam: PLAN?.exam || 'ielts', ielts: {now: ie.speaking ?? null, target: GOALS.ielts}, sat: {now: sat.total || null, target: GOALS.sat},
    date: PLAN?.date || '', minutes: 30, days: 5, hard: []};
}
const chips = (name, list, cur, multi = false) => `<div class="qz-chips" data-qname="${name}"${multi ? ' data-multi' : ''}>${list.map(([v, t]) =>
  `<button type="button" data-qv="${v}" class="${multi ? (cur.includes(v) ? 'on' : '') : String(cur) === String(v) ? 'on' : ''}" aria-pressed="${multi ? cur.includes(v) : String(cur) === String(v)}">${t}</button>`).join('')}</div>`;
const scoreSel = (id, steps, v, unknown) => `<select class="inp" id="${id}">${unknown ? `<option value="">Не знаю</option>` : ''}${steps.map(x => `<option ${Number(v) === x ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
function showPlanQuiz(){
  QZ ||= quizDefaults();
  const q = QZ, ie = q.exam !== 'sat', sa = q.exam !== 'ielts';
  parkBunny();
  $('#homeBox').innerHTML = `<div class="lhead"><button class="btn line sm" data-home>${I.back} Главная</button><div class="lslot" id="heroSlot" aria-hidden="true"></div></div>
    <h2>Личный план</h2><p class="lead">Ответь на 6 вопросов — Yomi составит план под тебя: что делать каждый день, в каком порядке учить и успеваешь ли к экзамену.</p>
    <div class="card qz">
      <label class="lbl">1. Что сдаёшь</label>${chips('exam', [['ielts', 'IELTS'], ['sat', 'SAT'], ['both', 'Оба']], q.exam)}
      <label class="lbl">2. Сейчас и цель</label>
      <div class="qz-grid">
        ${ie ? `<div><small>IELTS сейчас</small>${scoreSel('qIeNow', IELTS_STEPS, q.ielts.now, true)}</div><div><small>IELTS цель</small>${scoreSel('qIeT', IELTS_STEPS, q.ielts.target || 7)}</div>` : ''}
        ${sa ? `<div><small>SAT сейчас</small>${scoreSel('qSaNow', SAT_STEPS, q.sat.now, true)}</div><div><small>SAT цель</small>${scoreSel('qSaT', SAT_STEPS, q.sat.target || 1400)}</div>` : ''}
      </div>
      <p class="qz-hint">Не знаешь свой балл — выбери «Не знаю», а потом пройди пробный тест: план станет точнее.</p>
      <label class="lbl" for="qDate">3. Дата экзамена</label><input class="inp" id="qDate" type="date" value="${q.date || ''}" min="${new Date().toLocaleDateString('sv')}">
      <p class="qz-hint">Ещё не записан — оставь пустым, план будет на 12 недель.</p>
      <label class="lbl">4. Сколько времени в день</label>${chips('minutes', [[15, '15 мин'], [30, '30 мин'], [45, '45 мин'], [60, '1 час'], [90, '1,5 часа'], [120, '2 часа']], q.minutes)}
      <label class="lbl">5. Сколько дней в неделю</label>${chips('days', [[3, '3'], [4, '4'], [5, '5'], [6, '6'], [7, '7']], q.days)}
      <label class="lbl">6. Что даётся труднее</label>${chips('hard', HARD.filter(h => q.exam === 'both' || (q.exam === 'sat' ? h.startsWith('SAT') || h === 'Грамматика' || h === 'Словарный запас' : !h.startsWith('SAT'))).map(h => [h, h]), q.hard, true)}
    </div>
    <p class="qz-err" id="qzErr" role="status"></p>
    <div class="qz-foot"><button class="btn" data-qgo>Составить мой план</button>${SPA() ? '<button class="btn line" data-qback>Отмена</button>' : ''}</div>`;
  homeBunny();
}
function readQuiz(){
  const q = QZ, v = id => $('#' + id)?.value;
  if(q.exam !== 'sat'){ q.ielts.now = v('qIeNow') ? +v('qIeNow') : null; q.ielts.target = +v('qIeT'); }
  if(q.exam !== 'ielts'){ q.sat.now = v('qSaNow') ? +v('qSaNow') : null; q.sat.target = +v('qSaT'); }
  q.date = v('qDate') || '';
  return q;
}
async function makePlan(answers){
  parkBunny();
  $('#homeBox').innerHTML = `<div class="hero" style="margin-top:20px"><div class="hero-slot" id="heroSlot"></div><div class="bubble"><b>Составляю твой план…</b>Считаю часы до экзамена, смотрю твои результаты и раскладываю неделю. Это до 30 секунд.</div></div>`;
  homeBunny();
  // уроки только по выбранному экзамену (грамматика нужна и там, и там)
  const skills = SKILLS.filter(k => k.id.startsWith('g-') || answers.exam === 'both' || k.exam === answers.exam).map(k => ({id: k.id, name: k.name}));
  const j = await api('study_plan', {answers, skills}).catch(() => ({}));
  if(!j.studyPlan){ showPlanQuiz(); $('#qzErr').textContent = 'Не получилось составить план. Попробуй ещё раз.'; return; }
  S.stats = {...(S.stats || {}), studyPlan: j.studyPlan};
  // цели и дату берём из ответов — их видно на главной и в «Моём плане»
  const a = j.studyPlan.answers;
  if(a.ielts?.target) GOALS.ielts = a.ielts.target; if(a.sat?.target) GOALS.sat = a.sat.target; saveGoals();
  PLAN = {...(PLAN || planDefaults()), exam: a.exam === 'sat' ? 'sat' : 'ielts', date: a.date}; store.set('yomi_plan', PLAN);
  const c = store.get('yomi_course', null); if(c){ c.dow = todayDow(); store.set('yomi_course', c); }
  QZ = null; showStudyPlan();
}
const TASK_TXT = t => t.type === 'lesson' ? 'Урок' : t.type === 'words' ? 'Карточки слов' : t.type === 'mock' ? `Пробный экзамен · ${PRACTICE_NAME[t.act] || ''}` : `Практика · ${PRACTICE_NAME[t.act] || ''}`;
function showStudyPlan(){
  const sp = SPA(), p = sp.plan, v = VERDICT[p.verdict] || VERDICT.ok, today = todayDow(), h = p.hours;
  const pri = (p.priority || []).map(id => SKILLS.find(k => k.id === id)).filter(Boolean).slice(0, 6);
  parkBunny();
  $('#homeBox').innerHTML = `<div class="lhead"><button class="btn line sm" data-home>${I.back} Главная</button><div class="lslot" id="heroSlot" aria-hidden="true"></div></div>
    <p class="eyebrow">Личный план · составлен ${dateRu(sp.at)}</p>
    <h2>Твой план на ${p.weeks} ${plural(p.weeks, 'неделю', 'недели', 'недель')}</h2>
    <div class="card spv"><span class="vchip ${v[0]}">${v[1]}</span>${h ? `<span class="vh">${h.have} ч есть · нужно ${h.need}–${h.needHi} ч</span>` : ''}<p>${esc(p.summary)}</p>
      <button class="btn" data-sptoday>Начать сегодняшний день</button></div>
    <div class="sec-h"><h3>Неделя</h3></div>
    <div class="spweek">${(p.week || []).map(d => { const rest = d.tasks.every(t => t.type === 'rest'), mins = d.tasks.reduce((x, t) => x + (t.minutes || 0), 0);
      return `<div class="spday${d.day === today ? ' now' : ''}${rest ? ' rest' : ''}"><div class="dh"><b>${d.day}</b><small>${rest ? 'отдых' : `${mins} мин`}${d.day === today ? ' · сегодня' : ''}</small></div>
        ${rest ? '' : `<ul>${d.tasks.filter(t => t.type !== 'rest').map(t => `<li><span>${TASK_TXT(t)}${t.minutes ? ` · ${t.minutes} мин` : ''}</span>${t.note ? `<small>${esc(t.note)}</small>` : ''}</li>`).join('')}</ul>`}</div>`; }).join('')}</div>
    ${pri.length ? `<div class="sec-h"><h3>Уроки по порядку</h3></div><div class="card"><ol class="sppri">${pri.map(k => `<li>${esc(k.name)}</li>`).join('')}</ol></div>` : ''}
    <div class="sec-h"><h3>Этапы</h3></div>
    <div class="spphases">${(p.phases || []).map(x => `<div class="card"><span class="eyebrow">Недели ${esc(x.weeks)}</span><b>${esc(x.title)}</b><p>${esc(x.focus)}</p></div>`).join('')}</div>
    ${p.milestones?.length ? `<div class="sec-h"><h3>Контрольные точки</h3></div><div class="card"><ul class="spmile">${p.milestones.map(m => `<li><b>Неделя ${m.week}</b><span>${esc(m.what)}</span></li>`).join('')}</ul></div>` : ''}
    ${p.tips?.length ? `<div class="sec-h"><h3>Советы тебе</h3></div><div class="card"><ul class="mist">${p.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
    <div class="qz-foot"><button class="btn line" data-sprenew>Обновить по моим результатам</button><button class="btn line" data-spedit>Изменить ответы</button></div>
    <button class="relink" data-spcalc style="margin-top:12px">Расчёт часов и общие этапы →</button>`;
  homeBunny();
}
$('#homeBox').addEventListener('click', e => {
  const t = e.target, chip = t.closest('.qz-chips [data-qv]');
  if(chip){ const box = chip.parentElement, name = box.dataset.qname, val = isNaN(chip.dataset.qv) ? chip.dataset.qv : +chip.dataset.qv;
    readQuiz();
    if(box.hasAttribute('data-multi')){ const l = QZ[name]; QZ[name] = l.includes(val) ? l.filter(x => x !== val) : [...l, val]; } else QZ[name] = val;
    if(name === 'exam') QZ.hard = [];
    return showPlanQuiz(); }
  if(t.closest('[data-qgo]')) return makePlan(readQuiz());
  if(t.closest('[data-qback]')){ QZ = null; return showStudyPlan(); }
  if(t.closest('[data-spedit]')){ QZ = quizDefaults(); return showPlanQuiz(); }
  if(t.closest('[data-sprenew]')) return makePlan(SPA().answers);
  if(t.closest('[data-sptoday]')) return tab('learn');
  if(t.closest('[data-spcalc]')){ planCalcMode = true; return showPlanCalc(); }
});
