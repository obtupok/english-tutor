<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Статистика аккаунтов</title>
<!-- Мини-апп бота видео @DFHGAPKLMO_bot: статистика всех аккаунтов. Данные — POST …/functions/v1/stories-bot/stats
     с initData Telegram (бот проверяет подпись и владельца). ?demo=1 — пример данных без бота. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f8; --card: #ffffff; --text: #12141a; --muted: #7c828d; --line: #eceef2; --soft: #f4f5f8;
    --accent: #5b5bf0; --accent2: #8b5cf6; --ok: #16a34a; --warn: #d97706;
    --yt: #ff0033; --tt: #111111; --ig: #e1306c;
  }
  :root.dark { --bg: #0f1115; --card: #191c22; --text: #f1f2f5; --muted: #8b919c; --line: #252932; --soft: #20242b; --tt: #f1f2f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 Manrope, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
  .upd { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .refresh { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer; }
  .refresh svg { width: 20px; height: 20px; }
  .refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hero { border-radius: 22px; padding: 20px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); margin-bottom: 12px; }
  .hero .lbl { font-size: 13px; opacity: .85; font-weight: 600; }
  .hero .big { font-size: 42px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 4px 0 16px; }
  .hero .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .hero .row div { background: rgba(255,255,255,.15); border-radius: 14px; padding: 10px 12px; }
  .hero .row b { display: block; font-size: 18px; font-weight: 800; }
  .hero .row span { font-size: 12px; opacity: .85; }

  h2 { font-size: 17px; font-weight: 800; margin: 24px 2px 10px; letter-spacing: -.01em; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--card); border-radius: 18px; padding: 14px 12px; }
  .tile .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; margin-bottom: 10px; }
  .tile b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .tile span { color: var(--muted); font-size: 12.5px; }

  .acc { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 10px; }
  .acc-head { display: flex; align-items: center; gap: 12px; }
  .ava { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; flex: none; }
  .acc-name { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc-sub { color: var(--muted); font-size: 13px; }
  .counts { display: flex; gap: 6px; margin: 14px 0 4px; }
  .counts div { flex: 1; background: var(--soft); border-radius: 12px; padding: 8px 10px; }
  .counts b { font-size: 16px; font-weight: 800; }
  .counts span { display: block; color: var(--muted); font-size: 12px; }

  .pl { display: flex; align-items: center; gap: 12px; padding: 12px 0 0; margin-top: 12px; border-top: 1px solid var(--line); }
  .logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; }
  .logo svg { width: 20px; height: 20px; }
  .pl-mid { flex: 1; min-width: 0; }
  .pl-name { font-weight: 700; }
  .pl-who { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-num { text-align: right; }
  .pl-num b { font-size: 18px; font-weight: 800; display: block; }
  .pl-num span { color: var(--muted); font-size: 12px; }
  .note { margin-top: 8px; background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; font-weight: 600; }
  .note small { display: block; font-weight: 500; opacity: .85; margin-top: 2px; }
  .mini { display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; margin: 6px 0 0 48px; }
  .mini b { color: var(--text); font-weight: 700; }
  .off { color: var(--muted); font-size: 13px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }

  .more { margin-top: 12px; width: 100%; border: 0; background: var(--soft); color: var(--text); font: inherit; font-weight: 700; font-size: 14px;
    padding: 10px; border-radius: 12px; cursor: pointer; }
  .vids { margin-top: 6px; }
  .vid { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .vid:last-child { border-bottom: 0; }
  .rank { width: 22px; color: var(--muted); font-weight: 800; font-size: 13px; flex: none; text-align: center; }
  .vid-t { flex: 1; min-width: 0; }
  .vid-t div { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vid-t span { color: var(--muted); font-size: 12px; }
  .vid-v { text-align: right; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .vid-v span { display: block; color: var(--muted); font-size: 11.5px; font-weight: 500; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  .chip { display: inline-block; background: rgba(255,255,255,.2); border-radius: 99px; padding: 3px 10px; font-size: 13px; font-weight: 700; margin: -8px 0 14px; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 10px; }
  .vc-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .vc-title { font-weight: 800; font-size: 16px; margin: 6px 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; color: inherit; text-decoration: none; }
  .vc-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .vc-nums div { background: var(--soft); border-radius: 12px; padding: 8px 10px; }
  .vc-nums b { display: block; font-size: 17px; font-weight: 800; }
  .vc-nums span { color: var(--muted); font-size: 11.5px; }
  .vs { margin-top: 10px; font-size: 13px; font-weight: 600; }
  .up { color: var(--ok); } .down { color: var(--warn); }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 12px; position: relative; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; cursor: default; }
  .bar i { display: block; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar.today i { background: var(--accent2); }
  .bar.empty i { background: var(--line); }
  .bar:hover i { filter: brightness(1.15); }
  .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 6px; }
  .ch-head { display: flex; justify-content: space-between; align-items: baseline; }
  .ch-head b { font-size: 20px; font-weight: 800; }
  .ch-head span { color: var(--muted); font-size: 12.5px; }
  .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600;
    padding: 5px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none; display: none; z-index: 2; }
  .plrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .plrow:last-child { border-bottom: 0; }
  .next { display: flex; gap: 10px; align-items: center; background: var(--card); border-radius: 16px; padding: 12px 14px; margin-top: 8px; font-size: 14px; }
  .next b { font-weight: 700; }
  .accline { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .accline b { color: var(--text); }
  .tabs { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 12px; position: sticky; top: 8px; z-index: 3; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 700; font-size: 14px; padding: 9px; border-radius: 10px; cursor: pointer; }
  .tabs button.on { background: var(--soft); color: var(--text); }
  .lastv { display: block; margin: 10px 0 0 48px; background: var(--soft); border-radius: 12px; padding: 10px 12px; text-decoration: none; color: inherit; }
  @media (max-width: 380px) { .lastv { margin-left: 0; } }
  .lastv .lt { color: var(--muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .lastv .ln { font-weight: 700; font-size: 14px; margin: 2px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lastv .lm { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .lastv .lm b { color: var(--text); }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; line-height: 1.5; }
  .state { text-align: center; color: var(--muted); padding: 64px 16px; }
  .skel { border-radius: 20px; background: var(--card); margin-bottom: 10px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (max-width: 360px) { .hero .big { font-size: 36px; } .tile b { font-size: 20px; } }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Статистика</h1><div class="upd" id="upd">загрузка…</div></div>
    <button class="refresh" id="ref" aria-label="Обновить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  </header>
  <div id="app"><div class="skel" style="height:190px"></div><div class="skel" style="height:110px"></div><div class="skel" style="height:220px"></div></div>
</main>
<script>
const API = 'https://yxoakverustsnnglzdiy.supabase.co/functions/v1/stories-bot/stats';
const ICONS = {
  yt: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9.5 8.2v7.6L16 12z"/></svg>',
  tt: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2.4 2 4 4.5 4.2"/></svg>',
  ig: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17" cy="7" r=".8" fill="#fff"/></svg>',
};
const PL = { yt: { name: 'YouTube', bg: 'var(--yt)' }, tt: { name: 'TikTok', bg: '#111' }, ig: { name: 'Instagram', bg: 'linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af)' } };
const AVA = ['#5b5bf0', '#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
const tgApp = window.Telegram && Telegram.WebApp;
const demo = new URLSearchParams(location.search).has('demo');
const open = new Set();
let tab = 'all';
try { tab = localStorage.getItem('vstats_tab') || 'all'; } catch (e) {}
let data = null;

const dark = tgApp && tgApp.initData ? tgApp.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
if (dark) document.documentElement.classList.add('dark');
if (tgApp && tgApp.initData) {
  tgApp.ready(); tgApp.expand();
  try { tgApp.setHeaderColor(dark ? '#0f1115' : '#f4f5f8'); tgApp.setBackgroundColor(dark ? '#0f1115' : '#f4f5f8'); } catch (e) {}
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.0', '') + ' млн'
  : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K' : String(n);
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
const day = (iso) => iso ? new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) : '';

// понятный текст вместо технической ошибки сервера
function problem(err) {
  const e = err || '';
  if (/TT_STATS|user\.info\.stats/.test(e)) return ['Нет доступа к статистике TikTok', 'Нужно разрешить статистику в приложении TikTok и переподключить аккаунт'];
  if (/insights/.test(e)) return ['Просмотры скрыты', 'Instagram не дал доступ к просмотрам — лайки и комментарии видны'];
  if (/истёк|переподключите|Invalid Credentials|expired/i.test(e)) return ['Доступ истёк', 'Переподключите площадку в боте: аккаунт → Площадки'];
  return ['Не удалось загрузить', e.slice(0, 120)];
}

async function load() {
  const btn = document.getElementById('ref');
  btn.classList.add('spin');
  try {
    if (demo) { await new Promise((r) => setTimeout(r, 300)); data = DEMO(); }
    else {
      if (!tgApp || !tgApp.initData) throw new Error('Откройте страницу из бота — кнопка «Статистика» слева от поля ввода.');
      const r = await fetch(API, { method: 'POST', headers: { 'x-init-data': tgApp.initData } });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error) throw new Error(j.error || 'Сервер не ответил (' + r.status + ')');
      data = j;
    }
    render();
  } catch (e) {
    document.getElementById('upd').textContent = '';
    document.getElementById('app').innerHTML = `<div class="state">${esc(e.message || e)}</div>`;
  } finally { btn.classList.remove('spin'); }
}

function platRow(pl, s) {
  const P = PL[pl];
  const head = `<div class="logo" style="background:${P.bg}">${ICONS[pl]}</div>
    <div class="pl-mid"><div class="pl-name">${P.name}</div><div class="pl-who">${esc(s.name || '')}</div></div>`;
  if (!s.ok) { const [t, d] = problem(s.err); return `<div class="pl">${head}</div><div class="note">${t}<small>${esc(d)}</small></div>`; }
  const r = { ...(s.recent || {}) };
  if (s.totalViews != null) r.views = s.totalViews;   // всего за всё время, где площадка отдаёт
  if (s.totalLikes != null) r.likes = s.totalLikes;
  const hasViews = r.views != null;   // нет просмотров (Instagram без доступа) — крупно показываем лайки
  let h = `<div class="pl">${head}<div class="pl-num"><b class="num">${fmt(hasViews ? r.views : r.likes)}</b><span>${hasViews ? 'просмотров' : 'лайков'}</span></div></div>
    <div class="mini"><span><b class="num">${fmt(s.followers)}</b> подписч.</span>${hasViews ? `<span><b class="num">${fmt(r.likes)}</b> лайков</span>` : ''}<span><b class="num">${fmt(r.comments)}</b> комм.</span></div>`;
  if (s.err) { const [t, d] = problem(s.err); h += `<div class="note">${t}<small>${esc(d)}</small></div>`; }
  return h + lastOnPlatform(s);
}

// последнее видео на этом канале + сравнение со средним по каналу
function lastOnPlatform(s) {
  const vs = s.videos || [], v = vs.find((x) => x.date) || vs[0];
  if (!v) return '';
  const wv = vs.filter((x) => x.views != null), avg = wv.length > 1 ? wv.reduce((a, x) => a + x.views, 0) / wv.length : null;
  let cmp = '';
  if (avg && v.views != null) { const k = v.views / avg; cmp = k >= 1.1 ? `<span class="up">▲ ${k.toFixed(1).replace('.0', '')}× от среднего</span>` : k <= 0.9 ? `<span class="down">▼ ${Math.round(k * 100)}% от среднего</span>` : '<span>как обычно</span>'; }
  return `<a class="lastv" href="${esc(v.url || '#')}" target="_blank" rel="noopener"><div class="lt">Последнее · ${ago(v.date)}</div>
    <div class="ln">${esc(v.title || 'Без названия')}</div>
    <div class="lm">${v.views != null ? `<span><b class="num">${fmt(v.views)}</b> просм.</span>` : ''}<span><b class="num">${fmt(v.likes)}</b> лайков</span><span><b class="num">${fmt(v.comments)}</b> комм.</span>${cmp}</div></a>`;
}

function topVideos(a) {
  const all = [];
  for (const pl of Object.keys(PL)) for (const v of (a.platforms[pl]?.videos || [])) all.push({ ...v, pl });
  all.sort((x, y) => (y.views ?? -1) - (x.views ?? -1) || (y.likes ?? 0) - (x.likes ?? 0));
  return all.slice(0, 10);
}

const sign = (n) => n == null ? '' : (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
function ago(iso) {
  if (!iso) return '';
  const m = (Date.now() - Date.parse(iso)) / 60e3;
  return m < 60 ? Math.max(1, Math.round(m)) + ' мин назад' : m < 1440 ? Math.round(m / 60) + ' ч назад' : m < 2880 ? 'вчера' : day(iso);
}
const when = (iso) => new Date(iso).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

// карточка одного видео: последнее / лучшее за неделю
function videoCard(label, v, avg) {
  if (!v) return '';
  const P = PL[v.pl], er = v.views ? ((v.likes || 0) + (v.comments || 0)) / v.views * 100 : null;
  let cmp = '';
  if (avg && v.views != null) {
    const k = v.views / avg;
    cmp = k >= 1.1 ? `<div class="vs up">▲ в ${k.toFixed(1).replace('.0', '')}× больше среднего (${fmt(avg)})</div>`
      : k <= 0.9 ? `<div class="vs down">▼ ${Math.round(k * 100)}% от среднего (${fmt(avg)})</div>` : `<div class="vs">≈ как обычно (${fmt(avg)})</div>`;
  }
  return `<div class="card"><div class="vc-top"><i class="dot" style="background:${P.bg}"></i>${label} · ${P.name} · ${ago(v.date)}</div>
    <a class="vc-title" href="${esc(v.url || '#')}" target="_blank" rel="noopener">${esc(v.title || 'Без названия')}</a>
    <div class="vc-nums"><div><b class="num">${fmt(v.views)}</b><span>просмотры</span></div><div><b class="num">${fmt(v.likes)}</b><span>лайки</span></div>
    <div><b class="num">${fmt(v.comments)}</b><span>комм.</span></div><div><b class="num">${er == null ? '—' : er.toFixed(1) + '%'}</b><span>вовлеч.</span></div></div>${cmp}</div>`;
}

// столбики за 14 дней: прирост просмотров по снимкам; пока истории нет — просмотры видео по дню выхода
function chart(T) {
  const days = T.days || [];
  if (!days.length) return '';
  const hist = days.filter((d) => d.views != null).length >= 2;
  const val = (d) => hist ? d.views : d.viewsByRelease;
  const max = Math.max(1, ...days.map((d) => val(d) || 0)), total = days.reduce((s, d) => s + (val(d) || 0), 0);
  const today = days[days.length - 1].day;
  const bars = days.map((d, i) => {
    const v = val(d), h = v ? Math.max(3, v / max * 100) : 0;
    const tip = `${day(d.day + 'T12:00:00')}: ${v == null ? 'нет данных' : fmt(v) + ' просм.'}${d.published ? ' · вышло ' + d.published : ''}`;
    return `<div class="bar${d.day === today ? ' today' : ''}${v == null ? ' empty' : ''}" data-tip="${esc(tip)}" data-i="${i}"><i style="height:${v == null ? 2 : h}%"></i></div>`;
  }).join('');
  return `<h2>${hist ? 'Просмотры по дням' : 'Просмотры по дню выхода видео'}</h2><div class="card">
    <div class="ch-head"><b class="num">${fmt(total)}</b><span>${hist ? 'прирост за 14 дней' : 'у видео, вышедших за 14 дней'}</span></div>
    <div class="chart" id="chart">${bars}<div class="tip" id="tip"></div></div>
    <div class="axis"><span>${day(days[0].day + 'T12:00:00')}</span><span>сегодня</span></div>
    ${hist ? '' : '<div class="accline">Прирост по дням появится, когда бот накопит историю (снимок каждые 3 часа).</div>'}</div>`;
}

function platformsBlock(T) {
  const rows = Object.keys(PL).map((pl) => ({ pl, t: T.byPl?.[pl] })).filter((x) => x.t && (x.t.accounts || x.t.published));
  if (!rows.length) return '';
  return `<h2>По площадкам</h2><div class="card">${rows.map(({ pl, t }) => `<div class="plrow"><div class="logo" style="background:${PL[pl].bg}">${ICONS[pl]}</div>
    <div class="pl-mid"><div class="pl-name">${PL[pl].name}</div><div class="pl-who">${t.accounts ? fmt(t.followers) + ' подписч. · ' + fmt(t.likes) + ' лайков' : 'статистика недоступна'} · ботом ${t.published}</div></div>
    <div class="pl-num"><b class="num">${fmt(t.views || !t.likes ? t.views : t.likes)}</b><span>${t.views || !t.likes ? 'просмотров' : 'лайков'}</span></div></div>`).join('')}</div>`;
}

function render() {
  const d = data, T = d.totals, g = T.growth;
  document.getElementById('upd').textContent = 'обновлено в ' + new Date(d.updated).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  let h = `<div class="tabs"><button data-tab="all" class="${tab === 'all' ? 'on' : ''}">Обзор</button><button data-tab="ch" class="${tab === 'ch' ? 'on' : ''}">Каналы</button></div>`;
  if (tab === 'all') {
  h += `<div class="hero">
    <div class="lbl">Просмотры · все аккаунты</div>
    <div class="big num">${fmt(T.views)}</div>
    ${g ? `<div class="chip">${sign(g.views)} за ${Date.now() - Date.parse(g.since) > 20 * 3600e3 ? 'сутки' : 'с ' + new Date(g.since).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}${g.followers ? ' · ' + sign(g.followers) + ' подписч.' : ''}</div>` : ''}
    <div class="row"><div><b class="num">${fmt(T.followers)}</b><span>подписчики</span></div>
      <div><b class="num">${fmt(T.likes)}</b><span>лайки</span></div><div><b class="num">${fmt(T.comments)}</b><span>комментарии</span></div></div></div>`;

  h += `<div class="tiles">
    <div class="tile"><div class="ic" style="background:color-mix(in srgb,#5b5bf0 15%,transparent)">👁</div><b class="num">${fmt(T.avg)}</b><span>в среднем на видео</span></div>
    <div class="tile"><div class="ic" style="background:color-mix(in srgb,#ec4899 15%,transparent)">❤️</div><b class="num">${T.er == null ? '—' : T.er + '%'}</b><span>вовлечённость</span></div>
    <div class="tile"><div class="ic" style="background:color-mix(in srgb,#10b981 15%,transparent)">🎬</div><b class="num">${T.count || 0}</b><span>видео в подсчёте</span></div></div>`;

  if (T.best7) h += `<h2>Лучшее за неделю</h2>` + videoCard('Топ', T.best7, T.avg);
  h += chart(T);
  h += platformsBlock(T);

  h += `<h2>Видео в боте</h2><div class="tiles">
    <div class="tile"><div class="ic" style="background:color-mix(in srgb,#0ea5e9 15%,transparent)">📂</div><b class="num">${T.draft}</b><span>в папке</span></div>
    <div class="tile"><div class="ic" style="background:color-mix(in srgb,#f59e0b 15%,transparent)">⏰</div><b class="num">${T.scheduled}</b><span>запланировано</span></div>
    <div class="tile"><div class="ic" style="background:color-mix(in srgb,#16a34a 15%,transparent)">✅</div><b class="num">${T.published}</b><span>опубликовано${T.week ? `, ${T.week} за неделю` : ''}</span></div></div>`;
  if (T.next) h += `<div class="next">⏰<div>Следующее: <b>${when(T.next.at)}</b> — ${esc(T.next.title)} <span style="color:var(--muted)">· ${esc(T.next.account)}${T.next.mode === 'remind' ? ' · напоминание' : ''}</span></div></div>`;
  if (T.errors) h += `<div class="note" style="margin-top:8px">⚠️ Ошибок публикации: ${T.errors}<small>Откройте видео в боте — там написано, что пошло не так</small></div>`;

  } else {
  d.accounts.forEach((a, i) => {
    const on = Object.keys(PL).filter((pl) => a.platforms[pl]?.connected), off = Object.keys(PL).filter((pl) => !a.platforms[pl]?.connected);
    const vids = topVideos(a), b = a.bot, ag = a.growth;
    h += `<div class="acc"><div class="acc-head"><div class="ava" style="background:${AVA[i % AVA.length]}">${esc((a.name || '?').trim()[0].toUpperCase())}</div>
      <div style="min-width:0"><div class="acc-name">${esc(a.name)}</div><div class="acc-sub">${a.note ? esc(a.note) + ' · ' : ''}${on.length ? on.length + ' ' + plural(on.length, 'площадка', 'площадки', 'площадок') : 'площадки не подключены'}</div></div></div>
      <div class="counts"><div><b class="num">${b.draft}</b><span>в папке</span></div><div><b class="num">${b.scheduled}</b><span>в плане</span></div><div><b class="num">${b.published}</b><span>вышло</span></div></div>
      ${a.avg != null || ag ? `<div class="accline">${a.avg != null ? `В среднем <b>${fmt(a.avg)}</b> на видео` : ''}${a.er != null ? ` · вовлечённость <b>${a.er}%</b>` : ''}${ag ? ` · за сутки <b class="up">${sign(ag.views)}</b>${ag.followers ? ` / ${sign(ag.followers)} подп.` : ''}` : ''}</div>` : ''}
      ${a.next ? `<div class="accline">⏰ Дальше: <b>${when(a.next.at)}</b> — ${esc(a.next.title)}</div>` : ''}
      ${on.map((pl) => platRow(pl, a.platforms[pl])).join('')}
      ${off.length && on.length ? `<div class="off">Не подключены: ${off.map((pl) => PL[pl].name).join(', ')}</div>` : ''}
      ${!on.length ? `<div class="off">Подключить: бот → аккаунт → 🔗 Площадки</div>` : ''}
      ${vids.length ? `<button class="more" data-id="${a.id}">${open.has(a.id) ? 'Скрыть видео' : 'Лучшие видео'}</button>` : ''}
      ${open.has(a.id) ? `<div class="vids">${vids.map((v, k) => `<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener"><span class="rank">${k + 1}</span>
        <div class="vid-t"><div>${esc(v.title || 'Без названия')}</div><span><i class="dot" style="background:${PL[v.pl].bg}"></i>${PL[v.pl].name} · ${day(v.date)}</span></div>
        <div class="vid-v num">${v.views != null ? fmt(v.views) : fmt(v.likes)}<span>${v.views != null ? 'просм.' : 'лайков'}</span></div></a>`).join('')}</div>` : ''}
    </div>`;
  });
  if (!d.accounts.length) h += '<div class="state">Аккаунтов пока нет.</div>';
  }
  h += `<div class="foot">Просмотры и лайки — всего за всё время (YouTube — канал, TikTok — все видео); комментарии и Instagram — по последним видео.<br>Вовлечённость = (лайки + комментарии) / просмотры.</div>`;
  const app = document.getElementById('app');
  app.innerHTML = h;
  app.querySelectorAll('.tabs button').forEach((el) => el.onclick = () => { tab = el.dataset.tab; try { localStorage.setItem('vstats_tab', tab); } catch (e) {} render(); scrollTo(0, 0); });
  app.querySelectorAll('.more').forEach((el) => el.onclick = () => { const id = +el.dataset.id; open.has(id) ? open.delete(id) : open.add(id); render(); });
  const ch = document.getElementById('chart'), tip = document.getElementById('tip');
  if (ch) ch.querySelectorAll('.bar').forEach((el) => {
    const show = () => { tip.textContent = el.dataset.tip; tip.style.display = 'block';
      const x = el.offsetLeft + el.offsetWidth / 2, w = tip.offsetWidth / 2; tip.style.left = Math.min(ch.clientWidth - w, Math.max(w, x)) + 'px'; };
    el.onmouseenter = show; el.onclick = show; el.onmouseleave = () => tip.style.display = 'none';
  });
}

document.getElementById('ref').onclick = load;
load();

function DEMO() {
  const v = (t, vw, l, c, days, bot) => ({ id: t, title: t, url: '#', date: new Date(Date.now() - days * 864e5).toISOString(), views: vw, likes: l, comments: c, bot: !!bot });
  const sum = (vs) => ({ count: vs.length, views: vs.some((x) => x.views != null) ? vs.reduce((a, x) => a + (x.views || 0), 0) : null, likes: vs.reduce((a, x) => a + (x.likes || 0), 0), comments: vs.reduce((a, x) => a + (x.comments || 0), 0) });
  const yt1 = [v('Часть 7/22 · Сосед за стеной', 15400, 820, 41, 1, 1), v('Часть 6/22 · Ночной звонок', 9300, 455, 18, 2, 1), v('Серия 2 · Квартира 47', 2100, 96, 7, 4)];
  const ig1 = [v('Серия 2 · Квартира 47', null, 240, 12, 3, 1), v('Что мне делать?', null, 51, 3, 6)];
  const yt2 = [v('Часть 3/10 · AITA за свадьбу', 48200, 2100, 133, 1, 1), v('Часть 2/10 · AITA за свадьбу', 31000, 1500, 90, 2, 1)];
  const A = [
    { id: 2, name: 'kryroibob(ai stories)', note: 'ИИ-видео', bot: { draft: 12, scheduled: 3, publishing: 0, published: 18, reminded: 2, week: 5, errors: 1, byPl: { yt: 15, tt: 0, ig: 9 } },
      platforms: { yt: { connected: true, ok: true, name: 'kryroibob', followers: 1240, totalViews: 210500, videoCount: 41, videos: yt1, recent: sum(yt1) },
        tt: { connected: true, ok: false, name: 'kryroibob', err: 'нет доступа к статистике — включите user.info.stats и video.list в приложении TikTok, задайте TT_STATS=1 и переподключите TikTok' },
        ig: { connected: true, ok: true, name: '@kryroibob', followers: 530, videoCount: 22, videos: ig1, recent: sum(ig1), err: 'просмотры недоступны — нужно право instagram_manage_insights' } } },
    { id: 3, name: 'redit stories', note: 'клипы с YouTube', bot: { draft: 40, scheduled: 6, publishing: 1, published: 31, reminded: 0, week: 12, errors: 0, byPl: { yt: 31, tt: 0, ig: 0 } },
      platforms: { yt: { connected: true, ok: true, name: 'Reddit Stories RU', followers: 3900, totalViews: 1204000, videoCount: 88, videos: yt2, recent: sum(yt2) }, tt: { connected: false }, ig: { connected: false } } },
    { id: 1, name: 'Основной', note: '', bot: { draft: 0, scheduled: 0, publishing: 0, published: 4, reminded: 1, week: 0, errors: 0, byPl: { yt: 0, tt: 0, ig: 0 } },
      platforms: { yt: { connected: false }, tt: { connected: false }, ig: { connected: false } } },
  ];
  const T = { draft: 52, scheduled: 9, published: 53, week: 17, followers: 0, views: 0, likes: 0, comments: 0, byPl: {} };
  for (const pl of ['yt', 'tt', 'ig']) {
    const t = T.byPl[pl] = { accounts: 0, followers: 0, views: 0, likes: 0, comments: 0, published: A.reduce((a, x) => a + x.bot.byPl[pl], 0) };
    for (const a of A) { const s = a.platforms[pl]; if (!s.ok) continue; t.accounts++; t.followers += s.followers || 0; t.views += s.recent.views || 0; t.likes += s.recent.likes; t.comments += s.recent.comments; }
    T.followers += t.followers; T.views += t.views; T.likes += t.likes; T.comments += t.comments;
  }
  // последнее / лучшее / среднее / прирост — как считает бот
  const summ = (vs) => { const d = vs.filter((x) => x.date).sort((x, y) => Date.parse(y.date) - Date.parse(x.date)), w = vs.filter((x) => x.views != null);
    const views = w.reduce((s, x) => s + x.views, 0), act = w.reduce((s, x) => s + x.likes + x.comments, 0);
    return { last: d[0] || null, best7: [...w].sort((x, y) => y.views - x.views)[0] || null, avg: w.length ? Math.round(views / w.length) : null, er: views ? Math.round(act / views * 1000) / 10 : null, count: vs.length }; };
  const vidsOf = (a) => ['yt', 'tt', 'ig'].flatMap((pl) => a.platforms[pl].ok ? a.platforms[pl].videos.map((x) => ({ ...x, pl })) : []);
  const since = new Date(Date.now() - 864e5).toISOString();
  A.forEach((a, i) => Object.assign(a, summ(vidsOf(a)), { growth: i < 2 ? { views: [5400, 21000][i], followers: [38, 112][i], since } : null,
    next: i < 2 ? { at: new Date(Date.now() + (i + 1) * 3 * 3600e3).toISOString(), mode: 'publish', title: ['Часть 8/22 · Сосед за стеной', 'Часть 4/10 · AITA за свадьбу'][i] } : null }));
  Object.assign(T, summ(A.flatMap(vidsOf)), { growth: { views: 26400, followers: 150, since }, errors: 1,
    next: { ...A[0].next, account: A[0].name },
    days: Array.from({ length: 14 }, (_, i) => ({ day: new Date(Date.now() - (13 - i) * 864e5).toLocaleDateString('sv-SE'), views: i < 3 ? null : Math.round(3000 + 9000 * Math.abs(Math.sin(i * 1.7)) + i * 900),
      followers: 10 + i, published: i % 3, videos: 0, viewsByRelease: 0 })) });
  return { updated: new Date().toISOString(), recentN: 20, accounts: A, totals: T };
}
